<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50" role="img" aria-labelledby="revealing-title revealing-desc" data-pencil-art="revealing-dust">
  <title id="revealing-title">显迹尘 · Revealing Dust</title>
  <desc id="revealing-desc">A softly sketched golden dust pouch with a closed lilac diamond frame around an ivory four-point star, matching its pixel item emblem.</desc>
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f2ddb1"/><stop offset=".46" stop-color="#dabb7c"/><stop offset="1" stop-color="#a17a58"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fff0ca"/><stop offset=".5" stop-color="#dfc38e"/><stop offset="1" stop-color="#b18b62"/>
    </linearGradient>
    <linearGradient id="powder" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fff0bf"/><stop offset=".5" stop-color="#e4cf97"/><stop offset="1" stop-color="#ba9b7f"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#dfc1e4"/><stop offset=".5" stop-color="#b392c5"/><stop offset="1" stop-color="#7c658f"/>
    </linearGradient>
  </defs>

  <!-- The low shadow is omitted by the notebook pencil conversion. -->
  <ellipse cx="25" cy="44.6" rx="18.3" ry="2" fill="#211932" fill-opacity=".26"/>

  <!-- A warm powder spill, sharing the ash pouch's visual language. -->
  <path d="M26.8 43.8c1.7-3.1 3.7-5.5 6.1-5.5 2.4 0 3.8 1.4 4.8 2.6 1.8-.6 4.5.4 5.6 2.8-4.5 1.1-11.1 1.3-16.5.1Z" fill="url(#powder)" stroke="#3c2c4c" stroke-width="1.05" stroke-linejoin="round"/>
  <path d="M31 41.2c1.6-1.1 3.3-.9 4.6.2m2.2.5 2.1.7" fill="none" stroke="#fff1cf" stroke-width=".75" stroke-linecap="round"/>
  <path d="m33.7 42.7.7-.3m4.2 1 .6-.2" fill="none" stroke="#a48268" stroke-width=".55" stroke-linecap="round"/>

  <!-- Soft asymmetric cloth, drawn together at the neck. -->
  <path d="M14.5 20.1c-1.8 3.5-4.8 8.4-5.1 13.7-.4 6.8 4.1 10.7 11.8 10.9 7.2.2 12.6-3 12.5-9.1-.1-5.3-3.2-11-5.1-15.3Z" fill="url(#cloth)" stroke="#3c2c4c" stroke-width="1.35" stroke-linejoin="round"/>
  <path d="M14.5 24c-1.5 3.4-3.1 7-3.2 10.5-.1 3 .9 5 2.9 6.4" fill="none" stroke="#fae9be" stroke-opacity=".76" stroke-width="1.15" stroke-linecap="round"/>
  <path d="M28.2 24.8c1.6 3.4 3 7.2 3 10.3 0 4.5-3.4 6.9-7.6 7.4" fill="none" stroke="#84664f" stroke-opacity=".6" stroke-width=".85" stroke-linecap="round"/>
  <path d="M17.1 23.1c-1.4 1.3-2.2 2.8-2.7 4.4m8.6-4.8c.6 1.4.9 2.5.8 3.4m2.3-2.9c.8 1.1 1.3 2.2 1.6 3.3" fill="none" stroke="#a98663" stroke-width=".65" stroke-linecap="round"/>
  <path d="M12.9 37.3c.9 1 1.9 1.5 2.9 1.8m-1.1.8c2.5 1.6 6.1 2.3 9.8 1.5" fill="none" stroke="#f4dba4" stroke-width=".65" stroke-linecap="round"/>
  <path d="m13.7 36.9.6.5m.7 1 .6.4m.9.8.7.3m1.1.7.8.2m1.1.5.8.1" fill="none" stroke="#8f7160" stroke-opacity=".66" stroke-width=".48" stroke-linecap="round"/>

  <!-- Scalloped mouth and alternating cloth pleats. -->
  <path d="M14.8 18.7c.3-1.9-1.2-4.2-.7-5.7.3-1 2.5-1.1 3.8-.7 1-2.4 3.2-2.7 4.9-1.1 1.7-1.4 3.8-1 4.4.9 1.7-.2 3.1.3 3.3 1.5.2 1.3-1.6 3.6-2.2 5.6-3.3 1.7-10 1.7-13.5-.5Z" fill="url(#fold)" stroke="#3c2c4c" stroke-width="1" stroke-linejoin="round"/>
  <path d="M17.9 12.5c.2 2 1.3 3.2 1.5 5.2m3.5-6.2c-.5 2.2-.1 4.5-.4 6.7m4.6-5.7c-.3 2-1.6 3.9-1.5 5.7" fill="none" stroke="#ac8964" stroke-width=".76" stroke-linecap="round"/>
  <path d="M15.8 13.5c.2 1.2.7 2.4.8 3.5m3.2-4.2c.7 1.2.9 2.6 1 3.9m3.2-3.9-.2 3.7m4.1-2.4-.9 2.4" fill="none" stroke="#fff1cf" stroke-opacity=".82" stroke-width=".65" stroke-linecap="round"/>
  <path d="M13.9 18.7c3.3-1.1 11.6-1.1 15.4.4l-.9 2.3c-3.6 1.8-10.9 1.7-14.4-.4Z" fill="url(#fold)" stroke="#3c2c4c" stroke-width=".9" stroke-linejoin="round"/>
  <path d="M15 19.2c3.4 1.3 9.2 1.5 12.9.5" fill="none" stroke="#fff0cc" stroke-width=".75" stroke-linecap="round"/>

  <!-- Lilac drawstring, side knot, and two relaxed tails. -->
  <path d="M14.4 21c3.6 1.7 10 1.9 14 .4" fill="none" stroke="#6b4f7d" stroke-width="2.25" stroke-linecap="round"/>
  <path d="M14.6 20.8c3.4 1.6 9.7 1.8 13.5.5" fill="none" stroke="#ceacd8" stroke-width="1.15" stroke-linecap="round"/>
  <path d="M28.1 21.6c1-3.4 3.6-4.5 4.5-3.4 1.1 1.4-1.6 3.4-4.5 3.4Zm.4.4c2.7-.8 5.7.1 5.3 1.6-.4 1.4-3.4.5-5.3-1.6Z" fill="url(#ribbon)" stroke="#70537f" stroke-width=".72" stroke-linejoin="round"/>
  <path d="M28.6 22.7c1.6 2 1.2 4.6 2.6 6.4l1.4-.6c-1.8-1.7-1.7-4.3-3-6.1M28.1 22.5c.1 2.4-.6 3.4-1.5 4.9" fill="url(#ribbon)" stroke="#785787" stroke-width=".65" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="28.4" cy="21.8" rx="1.2" ry="1" fill="#e1c2e2" stroke="#70537f" stroke-width=".65"/>

  <!-- Closed lilac square, rotated 45 degrees, matching the pixel item emblem. -->
  <g id="revealing-emblem" stroke-linecap="round" stroke-linejoin="round">
    <path id="revealing-diamond" d="M20.8 26.8 26.8 32.8 20.8 38.8 14.8 32.8Z" fill="none" stroke="#a88ab8" stroke-width="1.05"/>
    <path id="revealing-star" d="M20.8 29.4c.4 1.9 1 2.8 3.2 3.4-2.2.6-2.8 1.5-3.2 3.4-.4-1.9-1-2.8-3.2-3.4 2.2-.6 2.8-1.5 3.2-3.4Z" fill="#fff3df"/>
  </g>

  <!-- A restrained revealing trace, one main star, and scattered grains. -->
  <path d="M36.7 35.2c2-2.7 3.7-5.7 2.9-8.8-.6-2.4-2.8-3.5-2.4-6.3" fill="none" stroke="#c6a8d5" stroke-opacity=".44" stroke-width=".55" stroke-linecap="round" stroke-dasharray=".6 2.15"/>
  <path d="m38.8 10 .85 2.6 2.6.85-2.6.85-.85 2.6-.85-2.6-2.6-.85 2.6-.85Z" fill="#ffebbb" stroke="#85648f" stroke-width=".55" stroke-linejoin="round"/>
  <path d="m35.6 31.9.5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5Z" fill="#f7e3af" stroke="#a4819e" stroke-width=".38" stroke-linejoin="round"/>
  <circle cx="34.4" cy="8.2" r=".55" fill="#d8bddf"/>
  <circle cx="42.5" cy="24.6" r=".65" fill="#e8d3ab"/>
  <circle cx="38" cy="38.1" r=".6" fill="#e8cdeb"/>
  <circle cx="44.5" cy="40.7" r=".5" fill="#eddbac"/>
  <circle cx="7" cy="27" r=".72" fill="#cdb0d5"/>
  <circle cx="10.1" cy="18.1" r=".42" fill="#e5d09d"/>
</svg>
