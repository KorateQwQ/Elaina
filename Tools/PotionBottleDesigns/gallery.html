<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>魔药瓶型 · 候选图鉴</title>
<style>
:root{color-scheme:dark;--paper:#e9dceb;--muted:#b3a0c4;--gold:#dec499;--line:#4a3b5a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 5% 0,#3c3049 0,transparent 50%),#201b29;color:var(--paper);font:15px/1.6 'Microsoft YaHei',sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}header{max-width:1460px;margin:0 auto;padding:44px 30px 28px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:4px}h1{font-family:'Noto Serif SC','SimSun',serif;font-size:36px;font-weight:400;letter-spacing:4px;margin:9px 0}header p{margin:7px 0;color:var(--muted)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:26px}.modes{display:flex;gap:4px;padding:4px;background:#19151f;border:1px solid var(--line);border-radius:8px}.modes button{background:none;border:0;border-radius:5px;padding:7px 19px;color:var(--muted)}.modes button[aria-pressed=true]{background:#4a3857;color:#f1e3ed}.scale-note{color:var(--muted);font-size:12px}main{max-width:1460px;padding:0 30px 110px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:linear-gradient(140deg,#352c40,#292231);border:1px solid var(--line);border-radius:12px;padding:18px;transition:border-color .2s,background .2s}.card.selected{border-color:var(--gold);background:linear-gradient(140deg,#44354b,#302635)}.card-heading{display:flex;align-items:center;gap:13px}.card-heading>b{font:30px Georgia,serif;color:var(--gold)}h2{font-size:17px;margin:0;font-weight:500}.card-heading span{font-size:11px;color:var(--muted)}.pick{margin-left:auto;flex-shrink:0;width:29px;height:29px;background:#241d2c;border:1px solid #675070;border-radius:50%;line-height:1}.selected .pick{color:#2c2234;background:var(--gold);border-color:var(--gold)}.art{border:0;background:radial-gradient(ellipse,#c5a6d60e,transparent 63%);width:100%;display:grid;place-items:center;margin:12px 0 0;padding:0}.art>img{width:172px;height:172px;object-fit:contain}.art>span{font-size:10px;color:#9784a8;opacity:0;transition:opacity .2s}.art:hover>span,.art:focus-visible>span{opacity:1}.small-row{margin-top:9px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-around}.small-row>div{display:grid;justify-items:center;gap:5px}.small-row img{width:46px;height:46px;object-fit:contain}.small-row small{font-size:10px;color:var(--muted)}.card p{font-size:12px;color:#c1aecb;min-height:40px;margin:19px 0 9px}.card>a{color:#d1b6df;text-decoration:none;font-size:11px}.card>a:hover{text-decoration:underline}footer{position:fixed;bottom:0;width:100%;padding:17px 30px;background:#231c2bed;border-top:1px solid #63506e;backdrop-filter:blur(14px);display:flex;justify-content:space-between;gap:20px;align-items:center}#selection{color:var(--gold)}footer small{color:var(--muted)}dialog{border:1px solid #745784;border-radius:16px;background:#2a2233;color:var(--paper);max-width:min(700px,94vw);padding:30px}dialog::backdrop{background:#121017d9;backdrop-filter:blur(7px)}.dialog-title{display:flex;justify-content:space-between;align-items:center}.dialog-title h2{font-size:23px}.close{background:none;border:1px solid var(--line);border-radius:50%;width:32px;height:32px}.compare{display:flex;gap:18px}.compare>div{display:grid;place-items:center}.compare img{width:min(256px,38vw);height:min(256px,38vw)}.compare p{color:var(--muted);font-size:12px}.dialog-note{color:#c1aecb;font-size:13px}@media(max-width:1150px){main{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:850px){main{grid-template-columns:repeat(2,minmax(0,1fr))}footer{font-size:12px}footer small{display:none}}@media(max-width:530px){main{grid-template-columns:1fr}header{padding:25px 22px}h1{font-size:29px}.scale-note{display:none}}
.small-row>div{grid-template-rows:64px 16px;align-items:center}.small-row img.pixel{width:64px;height:64px;image-rendering:pixelated}
main{grid-template-columns:repeat(4,minmax(0,1fr))}main:not(.all-concepts) .card:not([data-id="A"]):not([data-id="B"]):not([data-id="C"]):not([data-id="I"]){display:none}#toggle-archive{background:transparent;border:1px solid var(--line);border-radius:7px;padding:8px 13px;color:var(--muted);font-size:12px}@media(max-width:1150px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:530px){main{grid-template-columns:1fr}}
</style></head><body>
<header><div class="eyebrow">ELAINA · ALCHEMY STUDIES / 02</div><h1>I · 斜放实验室试管</h1><p>向右倾斜 32°，直筒圆底，药液保持水平。保留已选 A / B / C，试管 I 为新候选。</p><p>月露合剂维持原有圆瓶。「原像素」仅供对照；确认用途后，所有版本统一轮廓。</p>
<div class="toolbar"><div class="modes" aria-label="展示风格"><button data-mode="pencil" aria-pressed="true">彩铅预览</button><button data-mode="raw" aria-pressed="false">SVG 原稿</button><button data-mode="mask" aria-pressed="false">只看轮廓</button></div><button id="toggle-archive" aria-expanded="false">展开其他草案</button></div></header>
<main>{{CARDS}}</main><footer><div>已选候选：<span id="selection" aria-live="polite">A、B、C</span></div><small>本页仅为设计评审，游戏资源尚未替换</small></footer>
<dialog><div class="dialog-title"><h2 id="detail-title"></h2><button class="close" aria-label="关闭">×</button></div><div class="compare"><div><img id="detail-raw" alt="SVG原稿"><p>SVG 原稿</p></div><div><img id="detail-pencil" alt="彩铅预览"><p>现有彩铅处理</p></div></div><p class="dialog-note" id="detail-note"></p></dialog>
<script>
const concepts={{DATA}};const chosen=new Set(['A','B','C']);const dialog=document.querySelector('dialog');
document.getElementById('toggle-archive').addEventListener('click',event=>{const expanded=document.querySelector('main').classList.toggle('all-concepts');event.currentTarget.setAttribute('aria-expanded',expanded);event.currentTarget.textContent=expanded?'收起其他草案':'展开其他草案'});
document.querySelectorAll('.pick').forEach(button=>button.addEventListener('click',()=>{const card=button.closest('.card'),id=card.dataset.id;if(chosen.has(id))chosen.delete(id);else chosen.add(id);card.classList.toggle('selected',chosen.has(id));button.setAttribute('aria-pressed',chosen.has(id));button.textContent=chosen.has(id)?'✓':'＋';document.getElementById('selection').textContent=[...chosen].sort().join('、')||'尚未选择'}));
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b===button));const mode=button.dataset.mode==='mask'?'mask-large':button.dataset.mode;document.querySelectorAll('.card').forEach(card=>{card.querySelector('.art img').src=`png/${card.dataset.id}-${mode}.png`})}));
document.querySelectorAll('.art').forEach(button=>button.addEventListener('click',()=>{const id=button.closest('.card').dataset.id,c=concepts.find(v=>v.id===id);document.getElementById('detail-title').textContent=`${id} · ${c.name}`;document.getElementById('detail-raw').src=`png/${id}-raw.png`;document.getElementById('detail-pencil').src=`png/${id}-pencil.png`;document.getElementById('detail-note').textContent=`建议方向：${c.use}。${c.note}`;dialog.showModal()}));
document.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close()}});
</script></body></html>
