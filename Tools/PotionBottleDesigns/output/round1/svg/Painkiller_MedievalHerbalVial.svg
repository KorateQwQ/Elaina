<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 64 64">
  <title>止痛药 · 中世纪草药药剂瓶示例</title>
  <desc>圆腹琥珀药瓶、软木塞、深红蜡封和粗纸标签；用于讨论止痛药的时代感方向。</desc>
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0b0"/>
      <stop offset=".28" stop-color="#e7ad5c"/>
      <stop offset=".72" stop-color="#ad5b38"/>
      <stop offset="1" stop-color="#643246"/>
    </linearGradient>
    <linearGradient id="cork" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d9a878"/>
      <stop offset=".55" stop-color="#9b634b"/>
      <stop offset="1" stop-color="#5c3c3d"/>
    </linearGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a92f4b"/>
      <stop offset="1" stop-color="#4c203c"/>
    </linearGradient>
    <pattern id="paper" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#e9d5a5"/>
      <path d="M0 3L3 0M2 4L4 2" stroke="#b9946e" stroke-width=".35" opacity=".55"/>
    </pattern>
    <clipPath id="body"><path d="M24 21h16v7q0 3 5 8a15 15 0 1 1-26 0q5-5 5-8z"/></clipPath>
  </defs>

  <ellipse cx="32" cy="57" rx="16" ry="2.2" fill="#20182b" fill-opacity=".35"/>
  <path d="M24 21h16v7q0 3 5 8a15 15 0 1 1-26 0q5-5 5-8z" fill="url(#amber)" stroke="#39263d" stroke-width="1.4" stroke-linejoin="round"/>
  <g clip-path="url(#body)">
    <path d="M17 39q7-3 15 0t15 0v22H17z" fill="#a95139" opacity=".82"/>
    <path d="M17 34q7-2 15 0t15 0" fill="none" stroke="#ffd98b" stroke-width="1" opacity=".8"/>
    <path d="M23 24v24q0 6 3 9" fill="none" stroke="#fff5c5" stroke-width="1.7" stroke-linecap="round" opacity=".8"/>
    <path d="M39 28v20" fill="none" stroke="#67334b" stroke-width="1.1" opacity=".65"/>

    <!-- Rough paper label with a simple herb-and-cross mark. -->
    <path d="M21 34l3-2h17l2 2-1 14-3 2H23l-3-2z" fill="url(#paper)" stroke="#6a4648" stroke-width=".75"/>
    <path d="M32 36v9M27.5 40.5h9" stroke="#6b4c48" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M32 38q-4-3-5-1 2 3 5 3m0-2q4-4 5-2-1 3-5 4m0 1q-3 1-4 4m4-4q3 1 4 4" fill="none" stroke="#55704e" stroke-width=".8" stroke-linecap="round"/>
  </g>

  <!-- Short neck, cork and a visibly handmade wax seal. -->
  <path d="M25 20h14v3H25z" fill="#d4b17a" stroke="#4e343d" stroke-width="1"/>
  <path d="M24 14h16v7H24z" fill="url(#cork)" stroke="#39263d" stroke-width="1.2"/>
  <path d="M27 15v5m4-5v5m4-5v5" stroke="#efc48a" stroke-width=".7" opacity=".65"/>
  <path d="M23 20h18v3H23z" fill="url(#wax)" stroke="#39263d" stroke-width="1"/>
  <path d="M26 21.5h12" stroke="#dc6a66" stroke-width=".55" opacity=".75"/>
  <path d="M39 22q3 2 1 5l-2 1v-5z" fill="#7b2547" stroke="#39263d" stroke-width=".6"/>
  <circle cx="37" cy="22" r="1.15" fill="#e07b68" stroke="#51213d" stroke-width=".45"/>

  <path d="M22 28q2-3 4-4" fill="none" stroke="#fff4c4" stroke-width="1" stroke-linecap="round" opacity=".75"/>
  <circle cx="46" cy="17" r=".8" fill="#f3d890"/>
  <path d="M47 15l.6 1.4L49 17l-1.4.6L47 19l-.6-1.4L45 17l1.4-.6z" fill="#fff0b0" opacity=".8"/>
</svg>
