    </style></head><body><header><small>ELAINA · PURIFICATION / COLOR STUDY</small><h1>净土露滴，换一种更纯净的颜色</h1><p>保持滴管造型。A 用珍珠虹彩，B 用乳白与香槟金。</p><p>原稿与彩铅均保留多色层次，下方可查看实际小图。</p></header><main><article><h2>A · 虹彩珍珠</h2><p>珍珠白吸头、淡金套环；药液由冰蓝、淡紫过渡到粉金。</p><div class="pair"><figure><img src="Iridescent-raw.png" alt="虹彩珍珠原稿"><figcaption>SVG 原稿</figcaption></figure><figure><img src="Iridescent-pencil.png" alt="虹彩珍珠彩铅"><figcaption>彩铅预览</figcaption></figure></div><div class="sizes"><figure><img src="Green-reference.png" alt="原绿色版本"><figcaption>原深绿</figcaption></figure><figure><img src="Iridescent-small.png" alt="46px候选"><figcaption>新色 · 46px</figcaption></figure><figure><img class="tiny" src="Iridescent-tiny.png" alt="32px候选"><figcaption>新色 · 32px</figcaption></figure></div><a href="PurificationDew_Iridescent.svg" target="_blank">打开此版 SVG ↗</a></article><article><h2>B · 象牙白金</h2><p>乳白药液和香槟金微光，更安静、纯净，强调祝福感。</p><div class="pair"><figure><img src="IvoryGold-raw.png" alt="象牙白金原稿"><figcaption>SVG 原稿</figcaption></figure><figure><img src="IvoryGold-pencil.png" alt="象牙白金彩铅"><figcaption>彩铅预览</figcaption></figure></div><div class="sizes"><figure><img src="Green-reference.png" alt="原绿色版本"><figcaption>原深绿</figcaption></figure><figure><img src="IvoryGold-small.png" alt="46px候选"><figcaption>新色 · 46px</figcaption></figure><figure><img class="tiny" src="IvoryGold-tiny.png" alt="32px候选"><figcaption>新色 · 32px</figcaption></figure></div><a href="PurificationDew_IvoryGold.svg" target="_blank">打开此版 SVG ↗</a></article></main><footer><a href="../index.html">← 返回整套魔药</a>　颜色评审稿 · 其他五款保持原样 · 像素图待定</footer></body></html>
