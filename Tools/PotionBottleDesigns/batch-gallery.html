<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔药适配 · 第一版</title>
<style>
:root{color-scheme:dark;--ink:#eaddeb;--muted:#b7a0c7;--gold:#e0c89c;--line:#503d60}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#3a2d49,transparent 55%),#201a29;color:var(--ink);font:14px/1.65 'Microsoft YaHei',sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}header{max-width:1480px;margin:auto;padding:34px 26px 22px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:3px}h1{font-family:'SimSun',serif;font-weight:400;letter-spacing:3px;font-size:35px;margin:10px 0}header p{color:var(--muted);margin:4px 0}.reference{display:flex;align-items:center;gap:20px;margin-top:20px;padding:11px 18px;border:1px solid var(--line);border-radius:9px;background:#271f31}.reference>div{display:flex;align-items:center;gap:10px}.reference img{height:46px;width:46px}.reference strong{font-weight:400;color:var(--gold)}.reference small{display:block;color:var(--muted);font-size:11px}.reference a{margin-left:auto;font-size:12px;color:#c3a4d5;text-decoration:none}main{max-width:1480px;margin:auto;padding:0 26px 110px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:19px}.card{padding:18px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(145deg,#352b42,#2a2135);transition:border-color .2s}.card.selected{border-color:var(--gold)}.heading{display:flex;align-items:center;gap:14px}.heading>b{font:26px Georgia,serif;color:var(--gold)}h2{font-size:20px;font-weight:500;margin:0}.heading small{font-size:11px;color:var(--muted)}.pick{margin-left:auto;width:31px;height:31px;border:1px solid #725480;border-radius:50%;background:#251d30;flex-shrink:0;line-height:1}.selected .pick{background:var(--gold);border-color:var(--gold);color:#2c2236}.compare{display:flex;justify-content:center;gap:4px;width:100%;border:0;background:radial-gradient(ellipse,#b991c410,transparent 70%);margin:13px 0 22px;padding:0}.compare>span{width:50%;display:grid;justify-items:center}.compare img{width:100%;max-width:184px;aspect-ratio:1;object-fit:contain}.compare small{color:var(--muted);font-size:11px}.thumbs{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding-top:17px}.thumbs>div{display:grid;justify-items:center;grid-template-rows:46px 22px;align-items:center;gap:5px}.thumbs img{width:46px;height:46px}.thumbs img.tiny{width:32px;height:32px}.thumbs small{font-size:10px;color:var(--muted)}.card p{font-size:12px;color:#cbb6d4;min-height:40px;margin:18px 0 7px}.card>a{color:#d2b5e2;text-decoration:none;font-size:11px}.card>a:hover{text-decoration:underline}footer{position:fixed;bottom:0;left:0;width:100%;background:#251d30ee;border-top:1px solid #695077;padding:17px 28px;backdrop-filter:blur(15px);display:flex;justify-content:space-between;gap:20px;align-items:center}#selection{color:var(--gold)}footer small{color:var(--muted);font-size:11px}dialog{background:#2b2235;color:var(--ink);border:1px solid #765b87;border-radius:14px;padding:26px;max-width:min(680px,94vw)}dialog::backdrop{background:#120c19db;backdrop-filter:blur(6px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:15px}.close{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:none}.large-pair{display:flex;gap:14px}.large-pair>div{display:grid;justify-items:center}.large-pair img{width:min(256px,38vw);height:min(256px,38vw)}.large-pair p{font-size:12px;color:var(--muted)}.detail-note{color:#c5b1cf;font-size:13px}@media(max-width:1060px){main{grid-template-columns:repeat(2,minmax(0,1fr))}.reference a{display:none}}@media(max-width:610px){main{grid-template-columns:1fr}h1{font-size:28px}.reference{gap:12px;align-items:flex-start;flex-wrap:wrap}.reference img{width:36px;height:36px}footer{font-size:12px}footer small{display:none}}
</style></head><body>
<header><div class="eyebrow">ELAINA · POTION COLLECTION / DROPPER REVISION</div><h1>净土露滴 · 试试滴管形式</h1><p>其余五款保留本版。06 改为独立滴管：橡胶吸头、细玻璃管，以及管尖的一滴药液。</p><p>本轮只有 SVG 与彩铅候选；像素图等最终样式选定后再制作。</p><p><a href="palettes/index.html">净土露滴新试色：虹彩珍珠 / 象牙白金 ↗</a></p>
<div class="reference"><div><img src="reference/MoonDewElixir_Pencil.png" alt="现有月露合剂"><span><strong>月露合剂 · 圆瓶已确定</strong><small>沿用现有外观</small></span></div><div><img src="reference/Painkiller_Pencil.png" alt="止痛药片"><span>止痛药<small>继续保留药片形态</small></span></div><a href="../index.html">查看瓶型草案 ↗</a></div></header>
<main>{{CARDS}}</main><footer><div>备选：<span id="selection" aria-live="polite">尚未选择</span></div><small>点击 ＋ 标记 · 点图标放大 · 尚未替换游戏资源</small></footer>
<dialog><div class="dialog-head"><h2 id="detail-title"></h2><button class="close" aria-label="关闭放大预览">×</button></div><div class="large-pair"><div><img id="detail-raw" alt="SVG原稿"><p>SVG 原稿</p></div><div><img id="detail-pencil" alt="彩铅预览"><p>彩铅预览</p></div></div><p class="detail-note" id="detail-note"></p></dialog>
<script>
const items={{DATA}},chosen=new Set(items.filter(p=>p.status==='preferred').map(p=>p.key)),dialog=document.querySelector('dialog');
const storageKey='elaina-potion-round1-dropper-shortlist';
try{for(const key of JSON.parse(localStorage.getItem(storageKey)||'[]'))if(items.some(p=>p.key===key))chosen.add(key)}catch{}
function refresh(){document.querySelectorAll('.card').forEach(card=>{const selected=chosen.has(card.dataset.key),button=card.querySelector('.pick');card.classList.toggle('selected',selected);button.setAttribute('aria-pressed',selected);button.textContent=selected?'✓':'＋'});document.getElementById('selection').textContent=items.filter(p=>chosen.has(p.key)).map(p=>p.number+' '+p.name).join('、')||'尚未选择'}
document.querySelectorAll('.pick').forEach(button=>button.addEventListener('click',()=>{const key=button.closest('.card').dataset.key;if(chosen.has(key))chosen.delete(key);else chosen.add(key);refresh();try{localStorage.setItem(storageKey,JSON.stringify([...chosen]))}catch{}}));
document.querySelectorAll('.compare').forEach(button=>button.addEventListener('click',()=>{const key=button.closest('.card').dataset.key,p=items.find(p=>p.key===key);document.getElementById('detail-title').textContent=p.number+' · '+p.name+' / '+p.shape_name;document.getElementById('detail-raw').src=`png/${key}-raw.png`;document.getElementById('detail-pencil').src=`png/${key}-pencil.png`;document.getElementById('detail-note').textContent=p.note;dialog.showModal()}));
document.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{const r=dialog.getBoundingClientRect();if(event.target===dialog&&(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom))dialog.close()});refresh();
</script></body></html>
