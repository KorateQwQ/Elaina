<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>魔女手札 · 技能面板改版（第二版）</title>
<style>
/* ============================================================
   第二版：以游戏内 1100×800 设计平面为准
   · 还原：书本外框（皮面 / 书页块 / 三道页缘 / 书脊 / 角饰）、封面翻页与停靠飞行、
           顶部标题区、四个筛选页签 + 星图收录、星图网格 / 连线 / 节点样式
   · 保留：上一版的底部点线分割、幽灵按钮；右侧详情卡（夜色，本轮搁置未改）
   · 第三轮：装配槽回到游戏方槽；点线分割推广到标题线 / 页签线 / 竖分栏 / 短分隔 / 缩放胶囊；
           最外层页框改为「实线页边 + 点线内框 + 星角饰」（?frame=old 或左下按钮可对比原框）
   · 第四轮：右侧详情不再是浮在右栏的卡片，改为直接写在书页上（?detail=card 或左下按钮可对比旧卡）
   · 轻微优化（翻页 / 书本）：飞行时就带书本厚度、封面掠光、衬页跟随、书签丝带、柔和投影、
           星图上下边缘淡出
   ============================================================ */
@font-face { font-family: "Gelasio"; src: url("../../.vissandbox/gelasio-source/Gelasio.ttf"), local("Georgia"); }
:root {
  --ink: #eee9f5; --muted: #b2a8c3; --lav: #cab2ed; --gold: #e6cea5; --line: #4c3e58;
  --serif: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
  --hsans: "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
  --latin: "Gelasio", Georgia, serif;
  --dot: rgba(236,229,247,.32);
  /* 详情卡（上一版原样保留） */
  --bg1: #1d1926; --tab: #0e0c13; --muted2: #9e96ae; --faint: #6c6579; --blue: #5b86d6;
  --paper: #f4f2f7; --paper2: #e7e4ec; --paperLine: #d6d1de; --pInk: #2c2836; --pMuted: #7d7689;
  --sans: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", "Source Han Sans SC", sans-serif;
  --num: "Bahnschrift", "DIN Alternate", "Segoe UI", var(--sans);
}
/* 字体分工（只用游戏内 FontManager 已有的三款，且都只有一个字重——不用粗体 / 斜体，层级靠字号与颜色）
   · 宋体 Noto Serif SC：写在书上的「名字」——书名、技能名、星图节点名、区块标题（角色等级 / 研习点 / 星图收录 / 装配）
   · 黑体 HarmonyOS Sans：功能与阅读——页签、按钮、小标签（魔力 / 效果 / 进修所需…）、描述正文、状态提示
   · Gelasio：所有数字与拉丁字符——等级、数值、MP / %、LV.、ESC、槽位键 */
body.nightCard { --paper: #272233; --paper2: #2f2a3c; --paperLine: #3d364b; --pInk: #f0ecf6; --pMuted: #a59db3; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font-family: var(--hsans); color: var(--ink); background: #07080d; }
svg.defs { position: absolute; width: 0; height: 0; }

/* 示意的游戏画面 + 打开时压暗的背景（BackdropAlpha，(8,10,18)×.72） */
#world { position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 30% 20%, rgba(70,84,140,.45), transparent 70%),
    radial-gradient(ellipse 60% 40% at 80% 85%, rgba(60,40,70,.5), transparent 70%),
    linear-gradient(180deg, #1b2440, #121626 60%, #0d0f18); }
#world::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18%;
  background: linear-gradient(180deg, transparent, rgba(5,6,10,.85)), repeating-linear-gradient(90deg, #141320 0 46px, #191726 46px 92px); opacity: .7; }
#backdrop { position: fixed; inset: 0; background: rgb(8,10,18); opacity: 0; pointer-events: none; }

#stageWrap { position: fixed; inset: 0; }
#app { width: 1100px; height: 800px; position: absolute; left: 50%; top: 50%; transform-origin: center; }
#book { position: absolute; left: 0; top: 0; width: 1100px; height: 800px; transform-origin: 0 0; transform-style: preserve-3d; }
#book.rest { transform-style: flat; }
#body, #page, #pshadow, #cover, #flyleaf { position: absolute; left: 0; top: 0; width: 1100px; height: 800px; }
#body { pointer-events: none; }
#body svg { position: absolute; left: 0; top: 0; overflow: visible; }
#page { overflow: visible; }
#page > img.surface { position: absolute; left: 0; top: 0; width: 1100px; height: 800px; display: block; }
#pshadow { pointer-events: none; opacity: 0; }
#cover, #flyleaf { transform-style: preserve-3d; pointer-events: none; }
.strip { position: absolute; left: 0; top: 0; height: 800px; transform-origin: 0 0; transform-style: preserve-3d; }
.strip > i { position: absolute; inset: 0; backface-visibility: hidden; background-repeat: no-repeat; background-size: 1100px 800px; }
.strip > i.b { transform: rotateY(180deg); }
.strip > i > b { position: absolute; inset: 0; }

/* 书签丝带：翻开后轻轻一晃 */
#ribbon { transform-origin: 968px 796px; }
#ribbon.sway { animation: sway 1.9s cubic-bezier(.3,.6,.4,1) both; }
@keyframes sway { 0% { transform: rotate(0); } 18% { transform: rotate(5deg); } 42% { transform: rotate(-3deg); } 66% { transform: rotate(1.4deg); } 100% { transform: rotate(0); } }

/* 页面上的图层 */
svg.layer { position: absolute; left: 0; top: 0; width: 1100px; height: 800px; overflow: visible; }
#chrome { pointer-events: none; }
#chrome .hit { pointer-events: all; cursor: pointer; fill: transparent; }
#marker { transition: transform .18s ease-in-out; }
#map { position: absolute; left: 26px; top: 150px; width: 727px; height: 558px; cursor: grab;
  -webkit-mask: linear-gradient(180deg, transparent, #000 44px, #000 calc(100% - 30px), transparent), linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 10px), transparent);
  -webkit-mask-composite: source-in; mask-composite: intersect; }
#map.drag { cursor: grabbing; }
#map .node { cursor: pointer; }
/* 背景星点动态（参数见 starfield） */
#map .tw { animation: twinkle ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }
#map .gl { opacity: 0; transform-box: fill-box; transform-origin: center; animation: glint linear infinite; }
@keyframes glint { 0%, 86% { opacity: 0; transform: scale(.3) rotate(0); } 92% { opacity: 1; transform: scale(1) rotate(20deg); } 100% { opacity: 0; transform: scale(.3) rotate(45deg); } }

/* 小工具 */
.spark { width: 1em; height: 1em; display: inline-block; vertical-align: -.12em; fill: currentColor; }
.dotline { height: 3px; background: radial-gradient(circle, var(--dot) .7px, transparent 1px) 0 50% / 4.5px 3px repeat-x; }
.vdots { width: 3px; background: radial-gradient(circle, var(--dot) .7px, transparent 1px) 50% 0 / 3px 4.5px repeat-y; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }

/* ============ 详情卡（上一版夜色，原样缩放放入右栏） ============ */
.cardHost { position: absolute; left: 770px; top: 153px; width: 412px; transform-origin: 0 0; }
.card { position: absolute; left: 0; top: 0; width: 412px; height: 640px; border-radius: 16px; background: var(--paper); color: var(--pInk); font-family: var(--sans);
  box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.5); display: flex; flex-direction: column; overflow: hidden; }
body.nightCard .card { box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(236,229,247,.1); }
.card::before { content: ""; position: absolute; inset: 6px; border-radius: 12px; border: 1px solid var(--paperLine); pointer-events: none; }
.cardOuterStar { display: none; position: absolute; left: -10px; top: -10px; width: 22px; height: 22px; fill: var(--ink); filter: drop-shadow(0 0 4px rgba(255,255,255,.6)); z-index: 1; }
.cardBody { padding: 26px 28px 0; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.cHead { display: flex; align-items: baseline; gap: 12px; }
.cHead h2 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: 4px; }
.cHead .kind { font-size: 12px; color: var(--pMuted); letter-spacing: 3px; margin-left: auto; }
.pdots { height: 3px; margin: 12px 0; background: radial-gradient(circle, var(--paperLine) 1px, transparent 1.4px) 0 50% / 6px 3px repeat-x; flex: none; }
.pdots.push { margin-top: auto; }
body:not(.nightCard) .pdots { background-image: radial-gradient(circle, #b9b2c4 1px, transparent 1.4px); }
.banner { height: 112px; border-radius: 8px; position: relative; overflow: hidden; flex: none;
  background:
    repeating-conic-gradient(from 0deg at 76% 50%, rgba(255,255,255,.07) 0 2deg, transparent 2deg 9deg),
    radial-gradient(circle at 76% 50%, var(--bannerGlow, rgba(120,200,160,.45)), transparent 55%),
    linear-gradient(120deg, #2b2742, #1d2036 70%); }
.banner .art { position: absolute; right: 30px; top: 50%; width: 80px; height: 80px; margin-top: -52px; border-radius: 50%; overflow: hidden;
  box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 0 0 7px rgba(255,255,255,.12), 0 0 24px rgba(255,255,255,.25); background: #241f31; }
.banner .art img { width: 100%; height: 100%; display: block; }
.banner .tagrow { position: absolute; left: 14px; top: 12px; display: flex; gap: 6px; }
.banner .tag { height: 26px; padding: 0 14px; border-radius: 13px; background: rgba(14,12,19,.82); color: #f2eef8; font-weight: 700; font-size: 13px; letter-spacing: 2px; display: grid; place-items: center; }
.banner .elem { width: 26px; height: 26px; border-radius: 50%; background: #f2eef8; display: grid; place-items: center; }
.banner .elem svg { width: 14px; height: 14px; fill: #1d1926; }
.banner .blv { position: absolute; left: 16px; bottom: 30px; font: 700 26px/1 var(--num); color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.4); }
.banner .blv small { font-size: 15px; opacity: .75; }
.banner .stars { position: absolute; left: 0; right: 0; bottom: 0; height: 24px; background: rgba(14,12,19,.78); display: flex; align-items: center; gap: 3px; padding: 0 12px; }
.banner .stars svg { width: 14px; height: 14px; }
.banner .stars span { margin-left: auto; font: 600 11px/1 var(--num); color: rgba(242,238,248,.65); letter-spacing: 1px; }
.banner .max { height: 26px; padding: 0 12px; border-radius: 13px; background: #ecd28f; color: #4a3a1c; font: 800 11px/26px var(--num); letter-spacing: 2px; }
.stats { margin-top: 12px; flex: none; }
.stats .r { display: flex; justify-content: space-between; align-items: baseline; padding: 0 10px; height: 32px; line-height: 32px; font-size: 15px; font-weight: 600; letter-spacing: 1px; border-radius: 4px; }
.stats .r:nth-child(even) { background: var(--paper2); }
.stats .r b { font: 700 18px/32px var(--num); }
.stats .r b small { font-size: 12px; color: var(--pMuted); margin-left: 3px; font-family: var(--sans); font-weight: 600; }
.desc { font-size: 14px; line-height: 1.75; letter-spacing: .5px; flex: none; }
.desc .h { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; margin-bottom: 4px; }
.desc .h .ci { width: 22px; height: 22px; border-radius: 50%; background: var(--pInk); display: grid; place-items: center; }
.desc .h .ci svg { width: 12px; height: 12px; fill: var(--paper); }
.desc p { margin: 0; color: var(--pInk); opacity: .88; }
.desc em { font-style: normal; color: var(--blue); font-weight: 700; }
body.nightCard .desc em { color: #8fb4f0; }
.req { display: flex; align-items: center; gap: 14px; flex: none; margin-bottom: 14px; }
.req .ri { width: 52px; height: 52px; border-radius: 50%; background: #34303f; display: grid; place-items: center; flex: none;
  box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px #8d869a; }
.req .ri img { width: 30px; height: 30px; }
.req .rt { flex: 1; }
.req .rt b { display: block; font-size: 15px; letter-spacing: 1px; }
.req .rt small { font-size: 12px; color: var(--pMuted); letter-spacing: 1px; }
.req .rv { font: 700 18px/1 var(--num); text-align: right; }
.req .rv small { font-size: 13px; color: var(--pMuted); }
.req .ok { color: #3e9a6a; } .req .no { color: #d0566e; }
.cardFoot { flex: none; height: 92px; margin: 0 6px 6px; border-radius: 0 0 12px 12px; position: relative; overflow: hidden;
  background: #1a1722; display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 0 18px; }
.cardFoot .wm { position: absolute; left: 22px; top: 50%; width: 120px; height: 120px; margin-top: -60px; fill: rgba(236,229,247,.05); }
.cardFoot .cs { position: absolute; width: 12px; height: 12px; fill: rgba(236,229,247,.45); }
.cardFoot::before { content: ""; position: absolute; inset: 8px; border: 1px dashed rgba(236,229,247,.12); border-radius: 4px 4px 8px 8px; pointer-events: none; }
.pill { all: unset; box-sizing: border-box; cursor: pointer; height: 48px; padding: 0 40px; border-radius: 24px; position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: 3px;
  background: #f6f4f9; color: #3a3545;
  box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3.5px #d9d4e0, 0 3px 0 rgba(0,0,0,.25); transition: transform .12s, filter .12s; }
.pill::before, .pill::after { content: ""; position: absolute; top: 50%; width: 11px; height: 11px; margin-top: -5.5px; background: currentColor; opacity: .35;
  -webkit-mask: var(--sparkMask) center / contain no-repeat; mask: var(--sparkMask) center / contain no-repeat; }
.pill::before { left: 15px; } .pill::after { right: 15px; }
.pill:hover { filter: brightness(1.04); transform: translateY(-1px); }
.pill:active { transform: translateY(1px); box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3.5px #d9d4e0, 0 1px 0 rgba(0,0,0,.25); }
.pill.gold { background: linear-gradient(180deg, #f8e6ae, #efd185); color: #4f3d17; box-shadow: inset 0 0 0 2px #fff4cf, inset 0 0 0 3.5px #dcb969, 0 3px 0 rgba(0,0,0,.25); }
.pill.gold::before, .pill.gold::after { background: #fff; opacity: .9; }
.pill .cost { display: inline-flex; align-items: center; gap: 4px; font: 700 15px/1 var(--num); letter-spacing: 0; opacity: .8; }
.pill .cost img { width: 18px; height: 18px; filter: brightness(.35); }
.pill.dis { filter: grayscale(1) opacity(.5); pointer-events: none; }
.fade { animation: fadeIn .28s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ============ 右栏详情 · 嵌页版：直接写在书页上——无底板、无投影、无圆角框；分区只用点线 ============ */
.detail { position: absolute; left: 790px; top: 160px; width: 270px; height: 536px; display: none; color: var(--ink); }
body.detailPage .detail { display: block; }
body.detailPage .cardHost { display: none; }
.detail .in { height: 100%; display: flex; flex-direction: column; }
.detail .dotline { flex: none; margin: 13px 0; }
.dKind { display: flex; align-items: center; gap: 6px; height: 14px; font-size: 11px; letter-spacing: 2px; color: rgb(196,180,210); }
.dKind .spark { width: 8px; height: 8px; color: var(--lav); }
.dKind .el { width: 11px; height: 11px; fill: rgb(196,180,210); }
.dKind .st { margin-left: auto; font-size: 10px; letter-spacing: 1.5px; color: var(--muted2); display: flex; align-items: center; gap: 5px; }
.dKind .st.max { color: var(--gold); } .dKind .st.ready { color: var(--gold); }
.dHead { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.dIcon { width: 90px; height: 90px; flex: none; margin-left: -6px; overflow: visible; }
.dName { flex: 1; min-width: 0; }
.dName h2 { margin: 0; font: 400 25px/1.25 var(--serif); letter-spacing: 3px; color: rgb(240,231,244); white-space: nowrap; }
.dLv { margin-top: 7px; display: flex; align-items: baseline; gap: 5px; font-family: var(--latin); color: var(--muted); }
.dLv i { font: 9px/1 var(--latin); font-style: normal; text-transform: uppercase; letter-spacing: 1.5px; }
.dLv b { font-weight: 400; font-size: 18px; line-height: 1; color: var(--ink); }
.dLv b.max { color: var(--gold); }
.dLv span { font-size: 11px; }
.dLv .none { font: 12px/1 var(--hsans); letter-spacing: 2px; color: var(--muted2); }
/* 进度条：深色圆角槽（无描边）比进度略大一圈，进度内缩 1px 浮在槽里；满级换暗金 */
.dBar { margin-top: 8px; height: 5px; border-radius: 2.5px; position: relative; background: rgba(8,6,14,.55); }
.dBar i { position: absolute; left: 1px; top: 1px; bottom: 1px; border-radius: 1.5px; background: rgba(202,178,237,.8); }
.dBar.max i { background: rgba(230,206,165,.85); }
.dStats { display: flex; }
.dStats > div { flex: 1; }
.dStats .vdots { flex: none; margin: 2px 20px; }
.dStats small { display: block; font-size: 10px; letter-spacing: 2px; color: var(--muted2); }
.dStats b { display: block; margin-top: 7px; font: 400 24px/1 var(--latin); color: var(--ink); white-space: nowrap; }
.dStats b em { font: 10px/1 var(--hsans); font-style: normal; letter-spacing: 1px; margin-left: 5px; color: var(--muted); }
.dStats b em.lat { font: 11px/1 var(--latin); letter-spacing: .5px; }
.dStats b.nil { color: var(--faint); }
.dDesc h4 { margin: 0 0 7px; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 400; letter-spacing: 2px; color: rgb(196,180,210); }
.dDesc h4 .spark { width: 8px; height: 8px; color: var(--lav); }
.dDesc p { margin: 0; font-size: 13px; line-height: 1.85; letter-spacing: .5px; color: rgba(238,233,245,.86); }
.dDesc em { font-style: normal; color: rgb(228,210,250); }
/* 下一级预览：左名称、右「旧值 → 新值」，新值薄荷色（游戏内同款） */
.dNext h4 { margin: 0 0 4px; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 400; letter-spacing: 2px; color: rgb(196,180,210); }
.dNext h4 .spark { width: 8px; height: 8px; color: var(--lav); }
.dNext h4 .lv { margin-left: auto; font: 12px/1 var(--latin); letter-spacing: 0; color: var(--muted); display: flex; align-items: baseline; gap: 3px; }
.dNext h4 .lv i { font: 8px/1 var(--latin); font-style: normal; text-transform: uppercase; letter-spacing: 1px; margin-left: 2px; }
.dNext h4 .lv b { font-weight: 400; color: rgb(178,222,200); }
.dNext s, .dNext h4 s { text-decoration: none; margin: 0 6px; color: rgba(178,168,195,.7); font-family: var(--hsans); }
.dNext .r { display: flex; align-items: baseline; justify-content: space-between; height: 28px; line-height: 28px; font-size: 12px; letter-spacing: 1.5px; color: rgb(214,200,224); }
.dNext .r + .r { box-shadow: inset 0 1px 0 rgba(236,229,247,.06); }
.dNext .v { font: 17px/28px var(--latin); letter-spacing: 0; color: var(--muted); }
.dNext .v b { font-weight: 400; font-size: 20px; color: rgb(178,222,200); }
.dNext .v em { font: 10px/1 var(--hsans); font-style: normal; margin-left: 3px; letter-spacing: 1px; opacity: .8; }
.dNext .v em.lat { font: 13px/1 var(--latin); letter-spacing: 0; margin-left: 1px; }
.dReq { margin-top: auto; }
.dReq .row { display: flex; align-items: center; justify-content: space-between; font-size: 10px; letter-spacing: 2px; color: var(--muted2); }
.dReq .row .lat { font: 10px/1 var(--latin); letter-spacing: 1px; margin-left: 5px; }
.dReq .row .spark { width: 8px; height: 8px; color: var(--lav); margin-right: 6px; }
.dReq .need { margin-top: 9px; display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 1px; color: rgb(214,200,224); }
.dReq .need .v { margin-left: auto; font: 15px/1 var(--latin); color: var(--muted); letter-spacing: 0; }
.dReq .need .v b { font-weight: 400; font-size: 18px; }
.dReq .ok { color: var(--gold); } .dReq .no { color: rgb(226,128,150); }
.dReq .lack { margin-top: 6px; text-align: right; font-size: 10px; letter-spacing: 1.5px; color: rgb(226,128,150); }
.bk { width: 15px; height: 15px; flex: none; display: inline-block; background: currentColor;
  -webkit-mask: url("../../ElainaModSkills/ElainaSkillUI/ConstellationSkillPanel/Assets/StudyBook.png") center / contain no-repeat; }
.dReq .need .bk { color: var(--gold); }
/* 满级：一行小字即可（顶部已有「已满级」状态，这里不再大张旗鼓） */
.dDone { margin-top: auto; display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 2px; color: var(--muted2); }
.dDone .spark { width: 8px; height: 8px; color: var(--gold); }
.dActs { display: flex; gap: 10px; }
/* 动作按钮：底栏幽灵胶囊放大版；主动作用金色描边，不再是奶白实心药丸 */
.dBtn { all: unset; box-sizing: border-box; cursor: pointer; flex: 1; height: 36px; border-radius: 18px; position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; letter-spacing: 3px; color: rgb(222,212,232);

<script>
const IMG = "../../ElainaModSkills/";
const ASSET = IMG + "ElainaSkillUI/ConstellationSkillPanel/Assets/";

const BUTTERFLY = ASSET + "ButterflyMask.png";
const HAT = IMG + "ElainaSkillUI/ConstellationSkillPanel/Assets/HeaderHat.png";
const SP_PATH = "M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10Z";
document.documentElement.style.setProperty("--sparkMask",
  `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='-10 -10 20 20'><path d='${SP_PATH}'/></svg>`)}")`);

/* ---------- 游戏内色板（ConstellationDrawing） ---------- */
const rgba = (r, g, b, a = 1) => `rgba(${r},${g},${b},${+a.toFixed(4)})`;
const INK = [238, 233, 245], MUTED = [178, 168, 195], LAV = [202, 178, 237], GOLD = [230, 206, 165];
const LINE = [76, 62, 88], PLATE = [39, 32, 51];
const C = (c, a = 1) => rgba(c[0], c[1], c[2], a);
const SERIF = "'Noto Serif SC','Source Han Serif SC',serif", SANS = "'HarmonyOS Sans SC','Noto Sans SC','Microsoft YaHei UI',sans-serif", LATIN = "Gelasio,Georgia,serif";
const NS = "vector-effect=\"non-scaling-stroke\"";

const _mc = document.createElement("canvas").getContext("2d");
function measure(s, size, font = SANS, sp = 0) { _mc.font = `${size}px ${font}`; return _mc.measureText(s).width + Math.max(0, [...s].length - 1) * sp; }
// 左上角对齐的文字（FNA 的 Text(x, y) 语义）；align 0 / .5 / 1
function T(s, x, y, size, col, o = {}) {
  const sp = o.sp || 0, al = o.align || 0, font = o.font || SANS;
  const w = measure(s, size, font, sp), x0 = x - w * al;
  return `<text x="${x0.toFixed(2)}" y="${y}" font-size="${size}" fill="${col}" font-family="${font}" dominant-baseline="text-before-edge"` +
    `${sp ? ` letter-spacing="${sp}"` : ""}${o.w ? ` font-weight="${o.w}"` : ""}>${s}</text>`;
}
const polar = (r, d) => [r * Math.cos(d * Math.PI / 180), r * Math.sin(d * Math.PI / 180)];
const ease = v => { const t = Math.max(0, Math.min(1, v)); return t * t * (3 - 2 * t); };
const easeOut = v => { const t = Math.max(0, Math.min(1, v)); return 1 - (1 - t) ** 3; };
// KL CrossStar：四角星，waist 越小越瘦
function crossStar(cx, cy, sx, sy, col, waist = .2, filled = true) {
  const hx = sx / 2, hy = sy / 2, c = Math.min(.49, Math.max(.05, waist)), f = n => n.toFixed(2);
  const P = (x, y) => `${f(cx + x)},${f(cy + y)}`;
  const d = `M${P(0, -hy)}C${P(c * hx, -c * hy)} ${P(c * hx, -c * hy)} ${P(hx, 0)}C${P(c * hx, c * hy)} ${P(c * hx, c * hy)} ${P(0, hy)}` +
            `C${P(-c * hx, c * hy)} ${P(-c * hx, c * hy)} ${P(-hx, 0)}C${P(-c * hx, -c * hy)} ${P(-c * hx, -c * hy)} ${P(0, -hy)}Z`;
  return filled ? `<path d="${d}" fill="${col}"/>` : `<path d="${d}" fill="none" stroke="${col}" stroke-width=".9" ${NS}/>`;
}
const line = (x1, y1, x2, y2, col, w = 1) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" ${NS}/>`;
const frame = (x, y, w, h, col) => `<rect x="${x + .5}" y="${y + .5}" width="${w - 1}" height="${h - 1}" fill="none" stroke="${col}" stroke-width="1" ${NS}/>`;
// 点线：与底部 .dotline 同款（直径 1.4、间距 4.5）。圆头 + 零长虚线 = 一串圆点
const DOT = "rgba(236,229,247,.32)";
const dots = (x1, y1, x2, y2, col = DOT, gap = 4.5) =>
  `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="0 ${gap}"/>`;
// 竖向点线分隔：两端各一颗稍大的点（底栏 .bsep 同款）
const dotSep = (x, y1, y2, col = DOT) =>
  dots(x, y1 + 6, x, y2 - 6, col) + `<circle cx="${x}" cy="${y1 + 2}" r="2" fill="rgba(236,229,247,.5)"/><circle cx="${x}" cy="${y2 - 2}" r="2" fill="rgba(236,229,247,.5)"/>`;
const trio = (cx, cy, col = C(INK), w = 40) => `<use href="#trio" x="${cx - w / 2}" y="${cy - w / 6}" width="${w}" height="${w / 3}" fill="${col}"/>`;
// Glow.png 的近似：按颜色缓存的径向渐隐（SVG 渐变不继承引用者的 color，只能一色一份）
const _gf = {};
function gf(col) {
  if (!_gf[col]) {
    const id = "gl" + Object.keys(_gf).length;
    document.querySelector("svg.defs defs").insertAdjacentHTML("beforeend",
      `<radialGradient id="${id}"><stop offset="0" stop-color="${col}"/><stop offset=".35" stop-color="${col}" stop-opacity=".45"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient>`);
    _gf[col] = `url(#${id})`;
  }
  return _gf[col];
}
// Corners：四个开口直角，size 边长、arm 臂长；rot 45° 即菱形
function corners(cx, cy, size, arm, col, rot = 45) {
  let d = "";
  for (const x of [-1, 1]) for (const y of [-1, 1]) {
    const px = x * size / 2, py = y * size / 2;
    d += `M${px - x * arm},${py}L${px},${py}L${px},${py - y * arm}`;
  }
  return `<path d="${d}" fill="none" stroke="${col}" stroke-width="1" ${NS} transform="translate(${cx} ${cy}) rotate(${rot})"/>`;
}
// Glow.png 的近似：径向渐隐的椭圆
function glow(cx, cy, rx, ry, col, a) {
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${col}" opacity="${a}" style="mask:radial-gradient(closest-side,#000,transparent)"/>`;
}
let _gid = 0;
function glowE(cx, cy, rx, ry, col, a) {
  const id = "g" + (_gid++);
  return `<radialGradient id="${id}"><stop offset="0" stop-color="${col}" stop-opacity="${a}"/><stop offset=".4" stop-color="${col}" stop-opacity="${a * .5}"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient>` +
    `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#${id})"/>`;
}

/* ---------- 数据（数值为示意；坐标为 727×550 世界坐标） ---------- */
const N = [
  { id: "witch",   name: "灰之魔女", icon: "Skills/AshenWitch/AshenWitchSkill.png",     lv: 1,  max: 5,  x: 130, y: 45,  kind: "心得", el: "star", mp: 0,  cd: 0,   glow: "rgba(230,150,220,.45)",
    desc: "身为<em>灰之魔女</em>的自觉。每习得一门术式，魔力上限提高 <em>2%</em>。" },
  { id: "barrier", name: "魔力护盾", icon: "Skills/MagicBarrier/MagicBarrierSkill.png", lv: 1,  max: 5,  x: 50,  y: 189, kind: "术式", el: "star", mp: 40, cd: 30,  parent: "witch", glow: "rgba(140,190,255,.45)",
    desc: "展开一层魔力屏障，吸收 <em>120</em> 点伤害，持续 <em>8</em> 秒。" },
  { id: "missile", name: "魔法飞弹", icon: "Skills/MagicMissile/MagicMissileSkill.png", lv: 21, max: 21, x: 218, y: 148, kind: "术式", el: "star", mp: 6,  cd: 0.5, glow: "rgba(240,150,220,.45)",
    desc: "射出追踪敌人的魔力飞弹，造成 <em>48</em> 点魔法伤害。" },
  { id: "wind",    name: "风刃",     icon: "Icon/WindBladeSkill.png",                    lv: 15, max: 15, x: 330, y: 162, kind: "术式", el: "wind", mp: 12, cd: 2,   glow: "rgba(230,170,240,.45)",
    desc: "挥出新月形的风刃，贯穿路径上的敌人，造成 <em>72</em> 点伤害。" },
  { id: "alchemy", name: "炼金术",   icon: "Skills/Alchemy/AlchemySkill.png",            lv: 1,  max: 5,  x: 146, y: 324, kind: "术式", el: "star", mp: 0,  cd: 60,  glow: "rgba(120,220,150,.5)",

function renderBodyRim() {
  const w = 1100, h = 800, T = 10, M = 4;

  for (const [k, a] of [[1.3, .34], [2.4, .16], [3.2, .28], [4.6, .14], [5.5, .3], [6.9, .18], [7.8, .26], [9.0, .2]])

/* ---------- 蝴蝶（ConstellationButterflyMotion 的同款节奏） ---------- */

  // 下一级预览：已习得未满级 → 当前 → 下一级；待研习 → 习得后的 Lv.1；满级不显示
  const grow = GROW[n.id] || [], fmt = (v, u) => `${v}${unit(u)}`;
  const next = max || !grow.length ? "" : `<div class="dotline"></div><div class="dNext">
      <h4>${sp}${learn ? "习得后" : "下一级"}<span class="lv">${learn ? `<i>Lv.</i>1` : `<i>Lv.</i>${n.lv}<s>→</s><i>Lv.</i><b>${n.lv + 1}</b>`}</span></h4>
      ${grow.map(g => `<div class="r"><span>${g[0]}</span><span class="v">${learn ? "" : `${fmt(growAt(g, n.lv), g[3])}<s>→</s>`}<b>${fmt(growAt(g, learn ? 1 : n.lv + 1), g[3])}</b></span></div>`).join("")}
    </div>`;
  const acts = [];
  if (!max) acts.push(`<button class="dBtn ${learn ? "gold" : ""} ${enough ? "" : "dis"}" id="btnUp">${learn ? "研习" : "进修"}<span class="c"><i class="bk"></i>${cost}</span></button>`);
  if (!learn) acts.push(eq >= 0 ? `<button class="dBtn" id="btnEq">卸下<span class="k">${pad2(eq)}</span></button>`
                                : `<button class="dBtn gold" id="btnEq">装配<span class="k">${pad2(selSlot)}</span></button>`);
  document.getElementById("detail").innerHTML = `<div class="in ${anim ? "fade" : ""}">
    <div class="dKind">${sp}${n.kind}${st}</div>
    <div class="dHead">${detailIcon(n, learn, max)}
      <div class="dName"><h2>${n.name}</h2>
        <div class="dLv">${learn ? `<span class="none">未习得</span><span style="margin-left:auto">/ ${n.max}</span>` : `<i>Lv.</i><b class="${max ? "max" : ""}">${n.lv}</b><span>/ ${n.max}</span>`}</div>
        <div class="dBar ${max ? "max" : ""}"><i style="width:calc(${(learn ? 0 : n.lv / n.max * 100).toFixed(1)}% - 2px)${learn ? ";display:none" : ""}"></i></div>
      </div></div>
    <div class="dotline"></div>
    <div class="dStats">${stat("魔力", n.mp, "MP")}<div class="vdots"></div>${stat("冷却", n.cd, "秒")}</div>
    <div class="dotline"></div>
    <div class="dDesc"><h4>${sp}效果</h4><p>${n.desc}</p></div>
    ${next}
    ${foot}
    <div class="dotline"></div>
    <div class="dActs">${acts.join("")}</div>
  </div>`;
  bindActs(n, cost);
}

/* ---------- 装配栏（游戏内 DrawSlot 原样：方槽 + 三层内框 + 压线编号 + 选中金框 / 光晕 / 小星） ---------- */
let hoverSlot = -1;
function renderSlots() {
  _gid = 3000;
  const SURF = "rgb(32,30,47)", Y = 17;
  let o = "";
  slots.forEach((id, i) => {
    const n = id && byId(id), x = 1 + i * 48, y = Y, on = i === selSlot, hov = i === hoverSlot, cx = x + 21, cy = y + 21;
    if (on) o += glowE(cx, cy, 33, 33, "rgb(195,162,118)", .32);
    o += `<rect x="${x}" y="${y}" width="42" height="42" fill="${on ? rgba(185, 155, 87, .125) : "rgb(33,27,44)"}"/>`;
    for (let k = 1; k <= 3; k++) o += frame(x + k, y + k, 42 - 2 * k, 42 - 2 * k, on ? rgba(185, 155, 87, .106) : rgba(52, 35, 62, .333));
    o += frame(x, y, 42, 42, on ? "rgb(227,193,141)" : hov ? C(LAV) : rgba(164, 136, 179, .34));
    if (n) o += `<image href="${IMG + n.icon}" x="${cx - 16}" y="${cy - 16}" width="32" height="32"/>`;
    else o += `<path d="M${cx - 7},${cy + .5}h14M${cx + .5},${cy - 7}v14" stroke="rgb(155,125,173)" stroke-width="1" ${NS}/>`;
    // 编号压在上框线上：先垫一块页面底色把框线切开
    const key = SLOT_KEYS[i], kw = measure(key, 9, LATIN);
    o += `<rect x="${x - 3}" y="${y - 6}" width="${kw + 6}" height="10" fill="${SURF}"/>`;
    o += T(key, x, y - 7.5, 9, on ? "rgb(227,193,141)" : hov ? "rgb(240,192,222)" : "rgb(222,166,200)", { font: LATIN });
    if (on) o += crossStar(cx, y + 44, 8.5, 8.5, "rgb(227,193,141)", .5);
    o += `<rect class="hit" data-i="${i}" x="${x - 3}" y="${y - 8}" width="48" height="54"><title>${key} · ${n ? `${n.name} · Lv. ${n.lv}` : "空"}</title></rect>`;
  });
  document.getElementById("slots").innerHTML = o;
  document.getElementById("eqCount").textContent = `${slots.filter(Boolean).length} / ${slots.length}`;
}
const slotsEl = document.getElementById("slots");
slotsEl.addEventListener("click", e => {
  const s = e.target.closest(".hit"); if (!s) return;
  selSlot = +s.dataset.i; const id = slots[selSlot];
  renderSlots(); if (id) select(id); else renderCard();
});
slotsEl.addEventListener("pointerover", e => { const s = e.target.closest(".hit"), i = s ? +s.dataset.i : -1; if (i !== hoverSlot) { hoverSlot = i; renderSlots(); } });
slotsEl.addEventListener("pointerleave", () => { if (hoverSlot !== -1) { hoverSlot = -1; renderSlots(); } });
function select(id) {
  if (id === selId) return;
  if (FX.landed === selId || FX.landed == null) FX.fades[selId] = 1;
  selId = id;
  renderSky(); renderCard();
  const n = byId(id); setTarget([n.x, n.y]);
}

/* ============================================================
   书本翻页（ConstellationBookMotion / Renderer 同款时间线）
   · 32 条封面纸带，CSS 3D；弯曲 bend = 32°·sin(π·Turn)·curl，curl 为临界阻尼弹簧
   · 轻微优化：①飞行途中就带出皮面与书页块（书本厚度）②封面掠光 ③衬页滞后跟随 ④翻开后书签轻晃
   ============================================================ */
const book = {
  p: 0, target: false, curl: 1, curlV: 0,
  request(open) {
    if (this.target === open) return;
    if (this.p === 0 || this.p === 1) { this.curl = open ? 1 : -1; this.curlV = 0; }
    this.target = open;
  },
  get moving() { return this.p !== (this.target ? 1 : 0); },
  advance(s) {
    if (!this.moving || s <= 0) return;
    const dir = this.target ? 1 : -1, off = this.curl - dir, imp = this.curlV + 32 * off, decay = Math.exp(-32 * s);
    this.curl = dir + (off + imp * s) * decay;
    this.curlV = (this.curlV - 32 * imp * s) * decay;
    this.p = Math.max(0, Math.min(1, this.p + dir * s / (this.target ? .56 : .44)));
    if (!this.moving) { this.curl = this.target ? 1 : -1; this.curlV = 0; if (this.target) onOpened(); }
  },
};
const STRIPS = 32, SW = 1100 / STRIPS, LEAF_STRIPS = 16, LW = 1100 / LEAF_STRIPS;
const coverEl = document.getElementById("cover"), leafEl = document.getElementById("flyleaf");
const coverStrips = [], leafStrips = [];
function buildStrips(el, count, list, frontUrl, backUrl) {
  const w = 1100 / count;
  for (let i = 0; i < count; i++) {
    const s = document.createElement("div"); s.className = "strip"; s.style.width = (w + .7) + "px";
    s.innerHTML = `<i class="f" style="background-image:url('${frontUrl}');background-position:${-i * w}px 0"><b class="sh"></b><b class="gl"></b></i>` +
                  `<i class="b" style="background-image:url('${backUrl}');background-position:${-(1100 - (i + 1) * w)}px 0"><b class="sh"></b></i>`;
    el.appendChild(s);
    list.push({ el: s, f: s.children[0], b: s.children[1], fsh: s.children[0].children[0], fgl: s.children[0].children[1], bsh: s.children[1].children[0] });
  }
}
// 封面正面 = BookCoverFront + 「魔女手札」（PaintCover：550,512 · 29px 宋体 · 字距 7）
async function paintCovers() {
  const load = src => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.src = src; });
  await document.fonts.load(`29px "Noto Serif SC"`);
  const [front, back] = await Promise.all([load(ASSET + "BookCoverFront.png"), load(ASSET + "BookCoverBack.png")]);
  const cv = document.createElement("canvas"); cv.width = 1100; cv.height = 800;
  const g = cv.getContext("2d");
  g.drawImage(front, 0, 0, 1100, 800);
  g.font = `29px "Noto Serif SC"`; g.letterSpacing = "7px"; g.textBaseline = "top"; g.fillStyle = "rgb(226,208,233)";
  const tw = g.measureText("魔女手札").width - 7;
  g.fillText("魔女手札", 550 - tw / 2, 512);
  const frontUrl = cv.toDataURL();
  // 衬页：比封底略深的纸色 + 一道很淡的内框
  const lv = document.createElement("canvas"); lv.width = 1100; lv.height = 800;
  const h = lv.getContext("2d"), grad = h.createLinearGradient(0, 0, 1100, 800);
  grad.addColorStop(0, "#3b3149"); grad.addColorStop(1, "#2c2539");
  h.fillStyle = grad; h.fillRect(0, 0, 1100, 800);
  h.strokeStyle = "rgba(202,178,237,.12)"; h.strokeRect(10.5, 10.5, 1079, 779);
  h.strokeStyle = "rgba(202,178,237,.3)"; h.strokeRect(.5, .5, 1099, 799);
  const leafUrl = lv.toDataURL();
  buildStrips(coverEl, STRIPS, coverStrips, frontUrl, back.src);
  buildStrips(leafEl, LEAF_STRIPS, leafStrips, leafUrl, leafUrl);
}
function layoutSheet(list, count, turn, maxAngle, bendMax, curl, alpha, z, gloss) {
  const w = 1100 / count, bend = bendMax * Math.sin(Math.PI * turn) * curl;
  let ex = 0, ez = 0, right = 0;
  for (let i = 0; i < count; i++) {
    const u = (i + .5) / count, deg = -maxAngle * turn - bend * (1 - 2 * u), a = deg * Math.PI / 180, s = list[i];
    s.el.style.transform = `translate3d(${ex.toFixed(2)}px,0,${(ez + z).toFixed(2)}px) rotateY(${deg.toFixed(3)}deg)`;
    // 明暗按纸带两端的角度做渐变，相邻纸带首尾相接，不会出现竖条纹
    const edgeDeg = k => -maxAngle * turn - bend * (1 - 2 * k), dl = edgeDeg(i / count), dr = edgeDeg((i + 1) / count);
    const sh = d => Math.abs(Math.sin(d * Math.PI / 180)) * .2, gl = d => .13 * Math.exp(-(((d + 38) / 15) ** 2)) * Math.sin(Math.PI * turn);
    s.fsh.style.background = `linear-gradient(90deg, rgba(13,10,27,${sh(dl).toFixed(3)}), rgba(13,10,27,${sh(dr).toFixed(3)}))`;
    s.bsh.style.background = `linear-gradient(270deg, rgba(225,212,241,${(sh(dl) * .35).toFixed(3)}), rgba(225,212,241,${(sh(dr) * .35).toFixed(3)}))`;
    if (gloss) s.fgl.style.background = `linear-gradient(90deg, rgba(240,226,255,${gl(dl).toFixed(3)}), rgba(240,226,255,${gl(dr).toFixed(3)}))`;
    s.f.style.opacity = s.b.style.opacity = alpha.toFixed(3);
    ex += w * Math.cos(a); ez -= w * Math.sin(a); right = Math.max(right, ex);
  }
  return right;
}
const bookEl = document.getElementById("book"), bodyEl = document.getElementById("body"), pageEl = document.getElementById("page");
const shadowEl = document.getElementById("pshadow"), backdropEl = document.getElementById("backdrop"), dockEl = document.getElementById("dock");
let fitK = 1;
function dockVector() {
  const app = document.getElementById("app").getBoundingClientRect(), d = dockEl.getBoundingClientRect();
  return [((d.left + d.width / 2) - app.left) / fitK - 550, ((d.top + d.height / 2) - app.top) / fitK - 400];
}
function renderBook() {
  const p = book.p, turn = ease((p - .26) / .64), scene = ease(p / .04), pageA = ease((p - .3) / .5);
  const coverA = p === 1 ? 0 : 1 - ease((p - .78) / .2), shadowA = Math.sin(Math.PI * turn) * .45;
  backdropEl.style.opacity = (ease((p - .08) / .72) * .72).toFixed(3);
  const glow = Math.sin(Math.PI * Math.min(1, p / .26)) * .7;
  dockEl.querySelector(".glow").style.opacity = book.moving ? glow.toFixed(3) : 0;
  if (p === 1) {
    bookEl.style.transform = "none"; bookEl.classList.add("rest"); bookEl.style.visibility = "";
    bodyEl.style.opacity = pageEl.style.opacity = 1; shadowEl.style.opacity = 0;
    coverEl.style.display = leafEl.style.display = "none"; pageEl.style.pointerEvents = "";
    return;
  }
  bookEl.classList.remove("rest");
  bookEl.style.visibility = p === 0 ? "hidden" : "";
  pageEl.style.pointerEvents = "none";
  coverEl.style.display = leafEl.style.display = "";
  const [dx, dy] = dockVector(), dlen = Math.hypot(dx, dy), sg = Math.sign(dx) || 1;
  const travel = ease(p / .82), tucked = 1 - travel, lift = Math.min(100, dlen * .16);
  const dockScale = Math.min(1, Math.min(96 / 1100, 30 / 800)) * .82;
  const sc = dockScale + (1 - dockScale) * Math.pow(travel, 1.45);
  const bank = tucked === 0 || tucked === 1 ? 0 : Math.sin(Math.PI * tucked) ** 2;
  const tx = dx * tucked, ty = dy * tucked - lift * 4 * tucked * (1 - tucked);
  bookEl.style.transform = `translate(${tx.toFixed(2)}px,${ty.toFixed(2)}px) translate(550px,400px) scale(${sc.toFixed(4)}) translate(-550px,-400px) ` +
    `translate(385px,384px) perspective(5000px) translate(-385px,-384px) translate(550px,400px) ` +
    `rotateX(${(5 * bank).toFixed(3)}deg) rotateY(${(-7 * bank * sg).toFixed(3)}deg) rotateZ(${(9 * bank * sg).toFixed(3)}deg) translate(-550px,-400px)`;
  // 优化①：皮面 / 书页块随封面一起出现，飞行中的合书有厚度；页面内容仍按 PageAlpha 渐显
  bodyEl.style.opacity = scene.toFixed(3);
  pageEl.style.opacity = (scene * pageA).toFixed(3);
  if (!coverStrips.length) return;
  // 优化③：衬页滞后 0.05 跟随，最终停在 -100°，与封面一起淡出
  const leafTurn = ease((p - .31) / .62);
  layoutSheet(leafStrips, LEAF_STRIPS, leafTurn, 100, 22, book.curl, coverA * scene, .3, false);
  // 优化②：封面掠光
  const right = layoutSheet(coverStrips, STRIPS, turn, 104, 32, book.curl, coverA * scene, .8, true);
  const sw = Math.max(.12 * 1100, right), sa = shadowA * scene;
  shadowEl.style.width = sw + "px";
  shadowEl.style.background = `linear-gradient(90deg, rgba(9,6,18,${(.7 * sa).toFixed(3)}), rgba(41,26,59,${(.4 * sa).toFixed(3)}) 58%, transparent)`;
  shadowEl.style.opacity = 1;
}
function onOpened() {
  const r = document.getElementById("ribbon"); if (!r) return;
  r.classList.remove("sway"); void r.getBoundingClientRect(); r.classList.add("sway");
}
dockEl.onclick = () => book.request(!book.target);
addEventListener("keydown", e => {
  if (e.key === "Escape") book.request(false);
  if (e.key === "k" || e.key === "K") book.request(!book.target);
});

/* ---------- 预览开关 ---------- */
let slow = 1;
document.getElementById("devBook").onclick = () => { book.p = 0; book.target = false; book.request(true); };
document.getElementById("devSlow").onclick = e => { slow = slow === 1 ? .25 : 1; e.target.textContent = "慢放 ×4：" + (slow === 1 ? "关" : "开"); };
document.getElementById("devRim").onclick = e => { rimNew = !rimNew; e.target.textContent = "页缘：" + (rimNew ? "精简" : "原"); renderBody(); renderFrame(); onOpened(); };
document.getElementById("devFrame").onclick =e => { frameNew = !frameNew; e.target.textContent = "外框：" + (frameNew ? "新" : "原"); renderFrame(); };
document.getElementById("devCard").onclick =e => { document.body.classList.toggle("nightCard"); e.target.textContent = "详情卡：" + (document.body.classList.contains("nightCard") ? "夜色" : "月白"); };
document.getElementById("devDetail").onclick = e => { detailNew = !detailNew; document.body.classList.toggle("detailPage", detailNew); e.target.textContent = "详情：" + (detailNew ? "嵌页" : "卡片"); renderCard(false); };
document.getElementById("devReplay").onclick = () => { M.visible = false; FX.landed = null; const n = byId(selId); setTarget([n.x, n.y]); };
const ART_ORDER = ["night", "line", "color", "off"];
const setArt = m => { artMode = m; artDust = []; document.getElementById("devArt").textContent = "立绘：" + ART_NAME[m]; renderSky(); };
document.getElementById("devArt").onclick = () => setArt(ART_ORDER[(ART_ORDER.indexOf(artMode) + 1) % ART_ORDER.length]);
document.getElementById("tEdit").onclick =e => e.target.classList.toggle("on");

/* ---------- 缩放适配 ---------- */
function fit() {
  fitK = Math.min(innerWidth / 1180, innerHeight / 890);
  document.getElementById("app").style.transform = `translate(-50%, -50%) scale(${fitK})`;
  dockEl.style.transform = `scale(${fitK})`;
}
addEventListener("resize", fit); fit();

// 预览参数：?sel=<节点 id>  ?book=open（跳过翻页）| ?book=0.55（定格在某一进度）  ?card=day  ?art=night|line|color|off
const Q = new URLSearchParams(location.search);
if (Q.get("sel") && byId(Q.get("sel"))) selId = Q.get("sel");
if (FILTERS.some(f => f.k === Q.get("filter"))) filter = Q.get("filter");
if (Q.get("rim") === "old") { rimNew = false; document.getElementById("devRim").textContent = "页缘：原"; }
if (Q.get("frame") === "old") { frameNew = false; document.getElementById("devFrame").textContent = "外框：原"; }
if (Q.get("detail") === "card") { detailNew = false; document.body.classList.remove("detailPage"); document.getElementById("devDetail").textContent = "详情：卡片"; }
if (ART_NAME[Q.get("art")]) { artMode = Q.get("art"); document.getElementById("devArt").textContent = "立绘：" + ART_NAME[artMode]; }
if (Q.get("card") === "day") { document.body.classList.remove("nightCard"); document.getElementById("devCard").textContent = "详情卡：月白"; }
document.querySelector("svg.defs defs").insertAdjacentHTML("beforeend",
  `<filter id="tintGold" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".902 0 0 0 0  0 .808 0 0 0  0 0 .647 0 0  0 0 0 1 0"/></filter>`);
recenter();
document.fonts.ready.then(() => {
  renderBody(); renderFrame(); renderChrome(); renderSlots(); renderSky(); renderCard(false);
  // 截图用：直接打开 / 定格时先把蝴蝶落定、星座描完
  if (Q.get("book")) for (let i = 0; i < 150; i++) tick(1 / 60);
});
renderBody(); renderFrame(); renderChrome(); renderSlots(); renderSky(); renderCard(false);
setTarget([byId(selId).x, byId(selId).y]);

const bq = Q.get("book"), frozen = bq && bq !== "open" && !isNaN(+bq);
paintCovers().then(() => {
  if (bq === "open") { book.target = true; book.p = 1; }
  else if (frozen) { book.target = true; book.p = Math.max(0, Math.min(1, +bq)); }
  else setTimeout(() => book.request(true), 350);
  renderBook();
});
renderBook();
let last = performance.now();
(function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;
  if (!frozen) book.advance(dt * slow);
  if (book.moving || !frozen) renderBook();
  tick(dt);
  if (Q.has("debug")) document.title = `t=${M.time.toFixed(2)} fx=${refs.fx?.innerHTML.length} landed=${FX.landed}`;
})(last);
</script>
