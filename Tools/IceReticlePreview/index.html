<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>冰锥索敌 · 冰凌锁状态预览</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
canvas{position:absolute;inset:0;width:100%;height:100%;}
#gl{pointer-events:none;}
#scene{cursor:crosshair;}
#hud{position:absolute;left:16px;top:16px;width:320px;padding:14px 16px;background:rgba(8,20,42,.72);border:1px solid rgba(140,200,255,.35);border-radius:10px;color:#d8ecff;font-size:13px;backdrop-filter:blur(6px);user-select:none;}
#hud h1{font-size:16px;margin:0 0 6px;color:#c4e8ff;letter-spacing:1px;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0;}
.row button{background:rgba(40,80,130,.5);color:#cfe8ff;border:1px solid rgba(140,200,255,.3);border-radius:6px;padding:6px 4px;cursor:pointer;font-family:inherit;font-size:13px;}
.row button.on{background:rgba(90,170,255,.55);border-color:#bfe6ff;color:#fff;}
.row button:disabled{opacity:.4;cursor:default;}
#desc{min-height:76px;white-space:pre-line;color:#a5c8ea;line-height:1.55;margin-bottom:6px;}
label{display:flex;align-items:center;gap:6px;margin-top:6px;}
label span{width:64px;color:#a5c8ea;}
input[type=range]{flex:1;}
select{flex:1;background:#12284a;color:#d8ecff;border:1px solid rgba(140,200,255,.3);border-radius:4px;padding:2px;}
.sep{border-top:1px solid rgba(140,200,255,.18);margin:10px 0 4px;}
.hint{color:#7fa3c6;font-size:12px;margin-top:10px;line-height:1.6;}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<canvas id="gl"></canvas>
<div id="hud">
  <h1>❄ 冰锥索敌 · 冰凌锁</h1>
  <div class="row" id="states">
    <button data-s="cd">冰凌锁未冷却</button>
    <button data-s="ready">冰凌锁冷却完毕</button>
  </div>
  <div id="desc"></div>
  <label><span>冷却进度</span><input type="range" id="progress" min="0" max="1" step="0.01" value="0.4"><b id="progressV">40%</b></label>
  <label><input type="checkbox" id="auto" checked> 自动冷却</label>
  <label><span>冷却时长</span><input type="range" id="cdTime" min="2" max="20" step="0.5" value="6"><b id="cdTimeV">6.0s</b></label>
  <div class="row">
    <button id="cast">释放冰凌锁</button>
    <button id="refund">冷却返还 30%</button>
  </div>
  <label><span>就绪方案</span><select id="variant"></select></label>
  <label><input type="checkbox" id="equip" checked> 已装备冰凌锁（取消则只有菱形框）</label>
  <label><span>并排对比</span><select id="gallery">
    <option value="off">关闭</option><option value="states">冷却 / 就绪形态</option><option value="variants">全部就绪方案</option>
  </select></label>
  <label><input type="checkbox" id="moving" checked> 对比时假人移动（模拟实战）</label>
  <div class="sep"></div>
  <label><span>冷却配色</span><select id="palette">
    <option value="0">冰蓝</option><option value="1">霜白</option><option value="2">深寒紫</option>
  </select></label>
  <label><span>就绪配色</span><select id="readyPalette">
    <option value="0">亮青</option><option value="1">霜金</option><option value="2">寒紫</option><option value="3">不变色</option>
  </select></label>
  <label><span>锁定时长</span><input type="range" id="lockTime" min="0.1" max="1" step="0.05" value="0.35"><b id="lockTimeV">0.35s</b></label>
  <label><span>尺寸</span><input type="range" id="size" min="0.6" max="2.5" step="0.05" value="1.2"><b id="sizeV">1.20×</b></label>
  <div class="hint">把鼠标移到敌人或假人身上触发锁定，移开会解除。<br>快捷键：1–5 就绪方案 · Space 释放 · R 返还 · E 装备 · G 切换并排对比 · M 假人移动 · P 暂停</div>
</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
uniform vec2 uCenter;
uniform float uExtent;
uniform vec2 uRes;
void main(){
  vec2 px = uCenter + aPos * uExtent;
  gl_Position = vec4(px / uRes * 2.0 - 1.0, 0.0, 1.0);
}
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uCenter;   // 设备像素，左下角原点
uniform float uRadius;  // 设备像素
uniform float uTime;
uniform float uLock;    // 0..1 锁定进度
uniform float uAge;     // 完全锁定后经过的秒数，未锁定为 -1
uniform float uAlpha;
uniform vec3 uDeep;
uniform vec3 uMid;
uniform float uChain;   // 冰凌锁链整体可见度（已装备 × 锁定淡入）
uniform float uCd;      // 冰凌锁冷却进度（显示值），1 = 锁链合拢
uniform float uReady;   // 就绪形态混合 0..1
uniform float uReadyAge;// 锁链合拢后经过的秒数，未就绪为 -1
uniform vec3 uReadyDeep;// 就绪形态的配色
uniform vec3 uReadyMid;
uniform float uVariant; // 就绪方案：0 冰凌合围 / 1 流光描边 / 2 星芒轮闪 / 3 冰晶环绕 / 4 仅变色呼吸

#define TAU 6.28318530718
const vec3 WHITE = vec3(0.95, 0.99, 1.0);
// 锁链框比菱形框外扩的距离；第一枚链环距角点的距离；每半条边的链环间隔数（偶数，边中点正好是正面链环）
const float CHAIN_GAP = 0.16;
const float CHAIN_U0 = 0.12;
const float CHAIN_N = 16.0;

float gE;      // 累计能量，最后经色带映射成颜色
float gCov;    // 实体覆盖率，决定 alpha（亮背景上保持可读）
float AA;
vec3 gDeep, gMid;  // 冷却 / 就绪配色按就绪程度混合
float gPulse;      // 就绪后每次波纹发出时的脉冲

mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++){ s += a * noise(p); p = p * 2.03 + 1.7; a *= 0.5; }
  return s;
}
float easeOutBack(float x){ float t = x - 1.0; return 1.0 + 2.70158 * t * t * t + 1.70158 * t * t; }

float sdSeg(vec2 p, vec2 a, vec2 b){
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h);
}
float ndot(vec2 a, vec2 b){ return a.x * b.x - a.y * b.y; }
float sdRhombus(vec2 p, vec2 b){
  p = abs(p);
  float h = clamp(ndot(b - 2.0 * p, b) / dot(b, b), -1.0, 1.0);
  float d = length(p - 0.5 * b * vec2(1.0 - h, 1.0 + h));
  return d * sign(p.x * b.y + p.y * b.x - b.x * b.y);
}
// 极坐标重复：把角度折叠到第 idx 个扇区，扇区中心朝 +x
vec2 prep(vec2 p, float n, out float idx){
  float an = TAU / n;
  float a = atan(p.y, p.x);
  idx = floor(a / an + 0.5);
  a -= idx * an;
  return vec2(cos(a), sin(a)) * length(p);
}

// 线条：线芯 + 紧贴光晕 + 大范围柔光
void stroke(float d, float th, float k){
  float c = 1.0 - smoothstep(th - AA, th + AA, d);
  float x = max(d - th, 0.0);
  float halo = exp(-x / (th * 2.0 + 0.022));
  float bloom = exp(-x / 0.16);
  gE += k * (c * 1.3 + halo * 0.45 + bloom * 0.07);
  gCov += k * c;
}
// 冰晶面：facet 0..1 控制这一面的明暗
void facetFill(float d, float k, float facet){
  float c = 1.0 - smoothstep(-AA, AA, d);
  gE += k * c * mix(0.22, 0.8, facet);
  gCov += k * c * 0.55;
  stroke(abs(d), 0.005, k);
}
// 二次元十字星芒
void glint(vec2 q, float s, float k){
  q /= s;
  float arms = exp(-abs(q.x) * 36.0) * exp(-abs(q.y) * 3.2)
             + exp(-abs(q.y) * 36.0) * exp(-abs(q.x) * 3.2);
  float core = exp(-length(q) * 11.0);
  gE += k * (arms * 0.9 + core * 1.8);
  gCov += k * core * 0.4;
}
vec3 ramp(float E){
  vec3 c = mix(gDeep * 0.55, gDeep, smoothstep(0.0, 0.3, E));
  c = mix(c, gMid, smoothstep(0.25, 0.8, E));
  return mix(c, WHITE, smoothstep(0.85, 1.7, E));
}

// 向目标螺旋吸入的冰尘
void motes(vec2 p, float k){
  for (int i = 0; i < 14; i++){
    float fi = float(i);
    float h1 = hash(vec2(fi, 7.1)), h2 = hash(vec2(fi, 3.3));
    float life = fract(uTime * (0.3 + 0.25 * h2) + h1);
    float an = h1 * TAU + life * 1.8;
    vec2 pos = mix(1.75, 0.4, life) * vec2(cos(an), sin(an));
    glint(p - pos, 0.05 + 0.05 * h2, sin(life * 3.14159) * k * 0.55);
  }
}

// ---------- 寒霜菱形框 ----------
float bracket(vec2 a, float s, float L){
  return min(sdSeg(a, vec2(s, s - L), vec2(s, s)), sdSeg(a, vec2(s - L, s), vec2(s, s)));
}
void styleBracket(vec2 p, float r, float e, float e3, float s, float rk){
  float t = uTime;
  // 正方形转 45°，四个角指向上下左右
  vec2 a = abs(rot(TAU / 8.0) * p);
  // 冰凌锁就绪时菱形框加粗加亮，并随波纹脉冲
  float boost = 1.0 + rk * (0.35 + 0.6 * gPulse);
  stroke(bracket(a, s, 0.42), 0.013 + 0.005 * rk, e3 * boost);
  stroke(bracket(a, s - 0.07, 0.26), 0.003, e3 * 0.6 * boost);
  // 顶点冰刺（分面），作为锁链的锁桩
  float grow = smoothstep(0.5, 1.0, uLock);
  float spikeLen = 0.17 * grow * (1.0 + 0.15 * rk);
  vec2 cp = rot(-TAU / 8.0) * (a - vec2(s));
  vec2 sl = cp - vec2(spikeLen, 0.0);
  facetFill(sdRhombus(sl, vec2(spikeLen + 0.001, 0.03 + 0.008 * rk)), grow, smoothstep(-0.004, 0.004, sl.y));
  vec2 s1 = a - vec2(s + 0.055, s - 0.26);
  vec2 s2 = a.yx - vec2(s + 0.055, s - 0.26);
  facetFill(sdRhombus(s1, vec2(0.06 * grow + 0.001, 0.018)), grow * 0.8, step(0.0, s1.y));
  facetFill(sdRhombus(s2, vec2(0.06 * grow + 0.001, 0.018)), grow * 0.8, step(0.0, s2.y));
  // 锁定后从四角蔓延的霜纹
  float creep = uAge < 0.0 ? 0.0 : clamp(uAge / 0.9, 0.0, 1.0);
  float mask = smoothstep(0.0, 1.0, clamp(1.0 - length(a - vec2(s)) / max(0.75 * creep, 1e-4), 0.0, 1.0)) * step(a.x, s) * step(a.y, s);
  // 噪声等值线作为霜纹，梯度近似换算成距离，画成发光细线
  stroke(abs(fbm(p * 7.0) - 0.5) / 3.5, 0.0025, smoothstep(0.0, 0.25, mask) * 0.8);
  // 顶点之间的淡菱形轮廓
  vec2 bq = a - vec2(s);
  float box = length(max(bq, 0.0)) + min(max(bq.x, bq.y), 0.0);
  stroke(abs(box), 0.0015, e3 * 0.3);
  // 旋正的十字准星
  vec2 cq = rot((1.0 - e3) * TAU / 8.0) * p;
  float ip;
  vec2 xq = prep(cq, 4.0, ip);
  float g0 = mix(0.4, 0.22, e3);
  stroke(sdSeg(xq, vec2(g0 + 0.04, 0.0), vec2(g0 + 0.24, 0.0)), 0.004, e3);
  vec2 hl = xq - vec2(g0 + 0.02, 0.0);
  facetFill(sdRhombus(hl, vec2(0.05, 0.026)), e3 * 0.9, step(0.0, hl.y));
  stroke(abs(sdRhombus(p, vec2(0.05))), 0.004, e3 * (0.6 + 0.4 * sin(t * 6.0)));
}

// ---------- 冰凌锁链 ----------
// 锁链框是旋转空间里半边长 sc 的正方形；perim 返回点在其周长上的坐标 0..1（逆时针），perimPos 反过来取位置与切向
float perim(vec2 q, float sc){
  vec2 n = clamp(q / sc, -1.0, 1.0);
  float u;
  if (abs(q.x) >= abs(q.y)) u = q.x > 0.0 ? (n.y + 1.0) * 0.5 : 2.0 + (1.0 - n.y) * 0.5;
  else u = q.y > 0.0 ? 1.0 + (1.0 - n.x) * 0.5 : 3.0 + (n.x + 1.0) * 0.5;
  return u * 0.25;
}
vec2 perimPos(float h, float sc, out vec2 tang){
  float hu = fract(h) * 4.0;
  float side = floor(hu);
  float f = fract(hu) * 2.0 - 1.0;
  if (side < 0.5){ tang = vec2(0.0, 1.0); return vec2(sc, f * sc); }
  if (side < 1.5){ tang = vec2(-1.0, 0.0); return vec2(-f * sc, sc); }
  if (side < 2.5){ tang = vec2(0.0, -1.0); return vec2(-sc, -f * sc); }
  tang = vec2(1.0, 0.0);
  return vec2(f * sc, -sc);
}

// 冷却中：链环从四个顶点冰刺向各边中点逐节冻结，未成形处只留暗淡的虚点，生长前端有闪烁星芒。
// 冷却完毕：两半锁链在边中点合拢（扣合闪光 + 菱形冲击波），整体换成就绪配色，再按 uVariant 叠加一种就绪提示。
void lockChain(vec2 p, float s, float rk){
  float t = uTime;
  float sc = s + CHAIN_GAP;
  vec2 a = abs(rot(TAU / 8.0) * p);
  // 八向折叠：只处理一条半边，边位于 x = sc，y 从 0（边中点）到 sc（角点）
  vec2 b = a.x > a.y ? a : a.yx;
  float H = (sc - CHAIN_U0) / CHAIN_N;
  float v = (sc - b.y - CHAIN_U0) / H;   // 0 = 靠冰刺的第一枚链环，N = 边中点
  float x = b.x - sc;
  float rv = (CHAIN_N + 1.0) * uCd - 0.5; // 已成形到第几枚链环

  float flow = pow(0.5 + 0.5 * sin(v * 0.8 - t * 5.0), 6.0);
  // 就绪后的链环亮度：只有冰凌合围会加亮，其余方案让锁链退到底纹，把注意力留给就绪提示
  float readyK = uVariant < 0.5 ? 1.0 + 0.4 * gPulse + 0.45 * flow
               : uVariant < 1.5 ? 0.25
               : uVariant < 3.5 ? 0.55
               : 0.6 * (1.0 + 0.25 * sin(t * 2.5));
  float k = uChain * mix(0.5, readyK, uReady);
  // 偶数位是正面链环（胶囊轮廓），奇数位是侧面链环（短杆）
  float ie = clamp(2.0 * floor(v * 0.5 + 0.5), 0.0, CHAIN_N);
  float io = clamp(2.0 * floor(v * 0.5) + 1.0, 1.0, CHAIN_N - 1.0);
  vec2 qe = vec2(x, (v - ie) * H);
  vec2 qo = vec2(x, (v - io) * H);
  stroke(abs(length(vec2(qe.x, max(abs(qe.y) - 0.018, 0.0))) - 0.026), 0.0045, k * clamp(rv - ie + 0.5, 0.0, 1.0));
  stroke(sdSeg(qo, vec2(0.0, -0.04), vec2(0.0, 0.04)), 0.0065, k * clamp(rv - io + 0.5, 0.0, 1.0));
  // 绕过冰刺的系绳
  stroke(sdSeg(b, vec2(sc), vec2(sc, sc - CHAIN_U0 + 0.044)), 0.004, k * clamp(rv + 0.5, 0.0, 1.0));

  // 尚未成形的链环位置
  float ig = clamp(floor(v + 0.5), 0.0, CHAIN_N);
  stroke(length(vec2(x, (v - ig) * H)), 0.0035, uChain * 0.4 * (1.0 - uReady) * clamp(ig - rv + 0.5, 0.0, 1.0));
  // 生长前端
  float fv = clamp(rv, 0.0, CHAIN_N);
  glint(b - vec2(sc, sc - CHAIN_U0 - fv * H), 0.16, uChain * (1.0 - uReady) * step(0.0, rv) * (0.8 + 0.3 * sin(t * 9.0)));

  vec2 cp = rot(-TAU / 8.0) * (a - vec2(s));
  vec2 q = rot(TAU / 8.0) * p;
  float sq = max(abs(q.x), abs(q.y));
  if (rk > 0.0 && uVariant > 0.5){
    if (uVariant < 1.5){
      // 流光描边：细亮框线 + 两道光点沿锁链框追逐
      stroke(abs(sq - sc), 0.0025, rk * 0.45);
      float u = perim(q, sc);
      vec2 tg;
      for (int i = 0; i < 2; i++){
        float h = fract(t * 0.35 + float(i) * 0.5);
        stroke(abs(sq - sc), 0.004, rk * 1.3 * exp(-fract(h - u) * 16.0));
        glint(q - perimPos(h, sc, tg), 0.22, rk * 1.1);
      }
    } else if (uVariant < 2.5){
      // 星芒轮闪：四个顶点冰刺尖端依次闪出大星芒，逆时针轮转
      float idx = abs(p.x) > abs(p.y) ? (p.x > 0.0 ? 0.0 : 2.0) : (p.y > 0.0 ? 1.0 : 3.0);
      float flash = exp(-fract(t * 0.9 - idx * 0.25) * 6.0);
      float tip = 0.34 * smoothstep(0.5, 1.0, uLock);
      glint(cp - vec2(tip + 0.02, 0.0), 0.2 + 0.28 * flash, rk * (0.35 + 1.4 * flash));
    } else if (uVariant < 3.5){
      // 冰晶环绕：三枚小冰晶沿锁链框巡游，身后拖短尾光
      float u = perim(q, sc);
      for (int i = 0; i < 3; i++){
        vec2 tg;
        float h = fract(t * 0.16 + float(i) / 3.0);
        vec2 d = q - perimPos(h, sc, tg);
        vec2 l = vec2(dot(d, tg), dot(d, vec2(-tg.y, tg.x)));
        facetFill(sdRhombus(l, vec2(0.08, 0.036)), rk, step(0.0, l.y));
        glint(d, 0.12, rk * 0.7);
        stroke(abs(sq - sc), 0.003, rk * 0.8 * exp(-fract(h - u) * 28.0));
      }
    }
  }
  // 冰凌合围：四根大冰凌从外侧滑入，内长外短，尖端对准目标并上下浮动；锁链框周期性外扩波纹
  if (rk > 0.0 && uVariant < 0.5){
    float enter = 1.0 - (1.0 - uReady) * (1.0 - uReady) * (1.0 - uReady);
    vec2 lq = cp - vec2(0.84 + 0.7 * (1.0 - enter) + 0.035 * sin(t * 3.0), 0.0);
    facetFill(sdRhombus(lq, lq.x < 0.0 ? vec2(0.27, 0.07) : vec2(0.1, 0.07)), rk, smoothstep(-0.004, 0.004, lq.y));
    stroke(sdSeg(lq, vec2(-0.22, 0.0), vec2(0.07, 0.0)), 0.0025, 0.6 * rk);
    // 两侧的小冰晶
    vec2 q2 = rot(-0.5) * vec2(lq.x - 0.05, abs(lq.y) - 0.075);
    facetFill(sdRhombus(q2, vec2(0.09, 0.024)), rk * 0.85, step(0.0, q2.y));
    glint(lq + vec2(0.27, 0.0), 0.15, rk * (0.7 + 0.3 * sin(t * 5.0)));

    // 周期性向外扩散的菱形波纹
    float ph = fract(t / 1.1);
    float fade = (1.0 - ph) * (1.0 - ph);
    stroke(abs(max(a.x, a.y) - (sc + 0.06 + ph * 0.75)), 0.007 * (1.0 - ph) + 0.002, rk * fade);
  }

  // 合拢瞬间：边中点扣合闪光 + 向外扩散的菱形冲击波
  if (uReadyAge >= 0.0 && uReadyAge < 0.6){
    float kk = uReadyAge / 0.6;
    float fade = (1.0 - kk) * (1.0 - kk);
    glint(b - vec2(sc, 0.0), 0.45 * (0.6 + 0.4 * kk), fade * 1.5 * uChain);
    stroke(abs(max(a.x, a.y) - (sc + kk * 0.8)), 0.012 * (1.0 - kk) + 0.003, fade * 1.2 * uChain);
  }
}

void main(){
  vec2 p = (gl_FragCoord.xy - uCenter) / uRadius;
  AA = 1.0 / uRadius;
  gE = 0.0;
  gCov = 0.0;
  float r = length(p);
  float lk = clamp(uLock, 0.0, 1.0);
  float e = easeOutBack(lk);
  float e3 = 1.0 - (1.0 - lk) * (1.0 - lk) * (1.0 - lk);
  float s = mix(1.6, 0.86, e);
  float rk = uReady * uChain;
  gDeep = mix(uDeep, uReadyDeep, rk);
  gMid = mix(uMid, uReadyMid, rk);
  gPulse = exp(-fract(uTime / 1.1) * 5.0);

  // 寒气笼罩目标
  gE += smoothstep(1.0, 0.1, r) * 0.12 * e3;

  // 菱形框加粗、冰刺变长只属于冰凌合围方案
  styleBracket(p, r, e, e3, s, uVariant < 0.5 ? rk : 0.0);
  if (uChain > 0.0) lockChain(p, s, rk);

  motes(p, smoothstep(0.0, 0.5, lk));

  // 锁定瞬间：冲击环 + 中心大星芒
  if (uAge >= 0.0 && uAge < 0.55){
    float k = uAge / 0.55;
    float fk = (1.0 - k) * (1.0 - k);
    stroke(abs(r - (1.0 + k * 1.1)), 0.012 * (1.0 - k) + 0.003, fk * 1.3);
    glint(p, 0.9 * (0.6 + 0.4 * k), fk * 1.6);
  }

  vec3 col = ramp(gE) * (1.0 - exp(-gE * 1.8));
  float a = clamp(gCov, 0.0, 1.0) * 0.55 + clamp(gE, 0.0, 1.0) * 0.06;
  gl_FragColor = vec4(col, a) * uAlpha;
}

<script>
const STATE_DESC = {
  cd: '冰凌锁未冷却：菱形框外圈的锁链从四个顶点冰刺向各边中点逐节冻结，成形长度就是冷却进度；未成形处只留暗淡虚点，生长前端有星芒闪烁。冷却返还时锁链会快速向前推进。',
  ready: '冰凌锁冷却完毕：锁链在边中点合拢（扣合闪光 + 冲击波），整个准星换成就绪配色，再叠加所选方案的就绪提示。释放后锁链收回，重新开始冷却。',
};
const VARIANTS = [
  { name: '冰凌合围（厚重）', desc: '菱形框加粗、锁链加亮流光，四根大冰凌从外侧对准目标，锁链框周期外扩波纹。信号最强也最厚重。' },
  { name: '流光描边', desc: '锁链退为暗淡底纹，锁链框变成一条细亮线，两道光点沿框追逐环绕。运动明显但线条很细。' },
  { name: '星芒轮闪', desc: '四个顶点冰刺尖端依次闪出大十字星芒，逆时针轮转。点状闪烁，几乎不增加面积。' },
  { name: '冰晶环绕', desc: '三枚小冰晶沿锁链框巡游并拖短尾光。有持续运动，元素少而小。' },
  { name: '仅变色呼吸', desc: '锁链合拢后只换就绪配色，加一点缓慢的呼吸明暗。最克制，主要依赖颜色区分。' },
];
const READY_PALETTES = [
  { deep: [0.0, 0.62, 1.0], mid: [0.62, 1.0, 1.0] },
  { deep: [1.0, 0.52, 0.1], mid: [1.0, 0.88, 0.55] },
  { deep: [0.6, 0.2, 1.0], mid: [0.88, 0.7, 1.0] },
  null,
];
const PALETTES = [
  { deep: [0.1, 0.32, 1.0], mid: [0.42, 0.85, 1.0] },
  { deep: [0.4, 0.55, 0.85], mid: [0.8, 0.92, 1.0] },
  { deep: [0.38, 0.18, 0.95], mid: [0.58, 0.76, 1.0] },
];
const TAU = Math.PI * 2;

const $ = id => document.getElementById(id);
const scene = $('scene'), ctx = scene.getContext('2d');
const glc = $('gl');
const gl = glc.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
const bg = document.createElement('canvas');

const opt = { gallery: 'off', variant: 1, moving: true, palette: 0, readyPalette: 0, lockTime: 0.35, size: 1.2, auto: true, cdTime: 6, equip: true, paused: false };

// ---------- 冰凌锁冷却状态（与 IceConeTargetSystem 的逻辑一致） ----------
const newCd = (progress, ready = false) => ({ ready, progress: ready ? 1 : progress, shown: ready ? 1 : progress, blend: ready ? 1 : 0, age: ready ? 99 : -1, vis: 1 });
function stepCd(c, dt, equipped, autoRate){
  if (!c.ready && autoRate > 0) {
    c.progress = Math.min(1, c.progress + dt * autoRate);
    if (c.progress >= 1) c.ready = true;
  }
  c.vis = equipped ? Math.min(1, c.vis + dt * 4) : Math.max(0, c.vis - dt * 4);
  // 显示值追赶实际进度：冷却返还时锁链快速推进，释放后锁链收回
  const target = c.ready ? 1 : c.progress;
  c.shown += (target - c.shown) * Math.min(1, dt * 8);
  const closed = c.ready && c.shown > 0.995;
  if (closed) c.shown = 1;
  c.blend = closed ? Math.min(1, c.blend + dt / 0.25) : Math.max(0, c.blend - dt * 5);
  c.age = closed ? (c.age < 0 ? 0 : c.age + dt) : -1;
}
function cast(c){ if (c.ready) { c.ready = false; c.progress = 0; } }
function refund(c, amount){ if (!c.ready) { c.progress = Math.min(1, c.progress + amount); if (c.progress >= 1) c.ready = true; } }

const cd = newCd(0.4);

// ---------- HUD ----------
function syncHud(){
  const st = cd.ready ? 'ready' : 'cd';
  [...$('states').children].forEach(b => b.classList.toggle('on', b.dataset.s === st));
  $('desc').textContent = STATE_DESC[st] + (st === 'ready' ? '\n当前方案：' + VARIANTS[opt.variant].desc : '');
  $('progress').value = cd.progress;
  $('progressV').textContent = Math.round(cd.progress * 100) + '%';
  $('cast').disabled = !cd.ready;
  $('refund').disabled = cd.ready;
}
$('states').onclick = e => {
  const s = e.target.dataset && e.target.dataset.s;
  if (s === 'ready') { cd.ready = true; cd.progress = 1; }
  else if (s === 'cd' && cd.ready) { cd.ready = false; cd.progress = 0; }
};
$('progress').oninput = e => { cd.progress = +e.target.value; cd.ready = cd.progress >= 1; };
$('auto').onchange = e => { opt.auto = e.target.checked; };
$('cdTime').oninput = e => { opt.cdTime = +e.target.value; $('cdTimeV').textContent = opt.cdTime.toFixed(1) + 's'; };
$('cast').onclick = () => cast(cd);
$('refund').onclick = () => refund(cd, 0.3);
$('equip').onchange = e => { opt.equip = e.target.checked; };
VARIANTS.forEach((v, i) => $('variant').add(new Option(`${i + 1}. ${v.name}`, i)));
$('variant').value = opt.variant;
$('variant').onchange = e => { opt.variant = +e.target.value; };
$('gallery').onchange = e => { opt.gallery = e.target.value; };
$('moving').onchange = e => { opt.moving = e.target.checked; };
$('palette').onchange = e => { opt.palette = +e.target.value; };
$('readyPalette').onchange = e => { opt.readyPalette = +e.target.value; };
$('lockTime').oninput = e => { opt.lockTime = +e.target.value; $('lockTimeV').textContent = opt.lockTime.toFixed(2) + 's'; };
$('size').oninput = e => { opt.size = +e.target.value; $('sizeV').textContent = opt.size.toFixed(2) + '×'; };
addEventListener('keydown', e => {
  if (e.code === 'Space') { cast(cd); e.preventDefault(); }
  if (e.key === 'r' || e.key === 'R') refund(cd, 0.3);
  if (e.key === 'e' || e.key === 'E') { $('equip').checked = opt.equip = !opt.equip; }
  if (e.key === 'g' || e.key === 'G') {
    const modes = ['off', 'states', 'variants'];
    $('gallery').value = opt.gallery = modes[(modes.indexOf(opt.gallery) + 1) % modes.length];
  }
  if (e.key >= '1' && e.key <= String(VARIANTS.length)) { $('variant').value = opt.variant = +e.key - 1; }
  if (e.key === 'p' || e.key === 'P') opt.paused = !opt.paused;
  if (e.key === 'm' || e.key === 'M') { $('moving').checked = opt.moving = !opt.moving; }
});

// ---------- GL ----------
function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, $('vs').textContent));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, $('fs').textContent));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
const U = {};
['uCenter', 'uExtent', 'uRes', 'uRadius', 'uTime', 'uLock', 'uAge', 'uAlpha', 'uDeep', 'uMid', 'uChain', 'uCd', 'uReady', 'uReadyAge', 'uReadyDeep', 'uReadyMid', 'uVariant']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

// ---------- 场景 ----------
let W, H, DPR, groundY;
let stars = [], snow = [];
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [scene, glc]) { c.width = W * DPR; c.height = H * DPR; }
  groundY = Math.floor(H * 0.8);
  stars = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: Math.random() * H * 0.6, r: 0.5 + Math.random() * 1.1, ph: Math.random() * TAU }));
  snow = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: 0.8 + Math.random() * 1.8, v: 18 + Math.random() * 40, ph: Math.random() * TAU }));
  buildBackground();
  layoutEnemies();
}
function buildBackground(){
  bg.width = W * DPR; bg.height = H * DPR;
  const g = bg.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  let grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#060b1e'); grad.addColorStop(0.55, '#142a52'); grad.addColorStop(1, '#2c5490');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  // 极光
  g.filter = 'blur(28px)';
  g.globalCompositeOperation = 'lighter';
  [['rgba(70,255,200,.16)', 0.14, 0], ['rgba(110,150,255,.14)', 0.2, 1.8], ['rgba(70,230,255,.10)', 0.27, 3.1]].forEach(([c, y, ph]) => {
    g.strokeStyle = c; g.lineWidth = 40;
    g.beginPath();
    for (let x = -50; x <= W + 50; x += 20) {
      const yy = H * y + Math.sin(x * 0.006 + ph) * 40 + Math.sin(x * 0.017 + ph * 2) * 12;
      x === -50 ? g.moveTo(x, yy) : g.lineTo(x, yy);
    }
    g.stroke();
  });
  g.filter = 'none';
  g.globalCompositeOperation = 'source-over';
  // 远山
  const ridge = (base, amp, f, ph, c1, c2) => {
    const gr = g.createLinearGradient(0, base - amp, 0, groundY);
    gr.addColorStop(0, c1); gr.addColorStop(1, c2);
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(0, groundY);
    for (let x = 0; x <= W; x += 8) g.lineTo(x, base + Math.sin(x * f + ph) * amp + Math.sin(x * f * 3.1 + ph) * amp * 0.3);
    g.lineTo(W, groundY); g.fill();
  };
  ridge(groundY - 150, 40, 0.004, 0.5, '#2a4c80', '#1a3462');
  ridge(groundY - 70, 26, 0.007, 2.0, '#3a679f', '#244a7e');
  // 雪地
  grad = g.createLinearGradient(0, groundY, 0, H);
  grad.addColorStop(0, '#eaf5ff'); grad.addColorStop(0.08, '#bcd9f4'); grad.addColorStop(1, '#6f9bd0');
  g.fillStyle = grad; g.fillRect(0, groundY, W, H - groundY);
  g.fillStyle = 'rgba(255,255,255,.8)'; g.fillRect(0, groundY, W, 2);
}

const enemies = [];
function layoutEnemies(){
  enemies.length = 0;
  enemies.push({ type: 'dummy', x: W * 0.62, y: groundY - 34, w: 46, h: 70, rad: 42 });
  enemies.push({ type: 'slime', x: W * 0.3, y: groundY - 15, w: 46, h: 32, rad: 30, vx: 0, vy: 0, ground: true, timer: 0.5, dir: 1, squash: 0 });
  enemies.push({ type: 'slime', x: W * 0.82, y: groundY - 15, w: 46, h: 32, rad: 30, vx: 0, vy: 0, ground: true, timer: 1.2, dir: -1, squash: 0 });
  enemies.push({ type: 'eye', x: W * 0.4, y: H * 0.35, w: 42, h: 42, rad: 30 });
}

function updateEnemies(dt, t){
  for (const e of enemies) {
    if (e.type === 'slime') {
      if (e.ground) {
        e.timer -= dt;
        e.squash += (0 - e.squash) * Math.min(1, dt * 8);
        if (e.timer < 0.15) e.squash = 0.18;
        if (e.timer <= 0) {
          if (Math.random() < 0.3) e.dir *= -1;
          e.vy = -520 - Math.random() * 120; e.vx = e.dir * (120 + Math.random() * 80); e.ground = false;
        }
      } else {
        e.vy += 1500 * dt; e.x += e.vx * dt; e.y += e.vy * dt;
        e.squash = -0.15;
        if (e.x < 60 || e.x > W - 60) { e.dir *= -1; e.vx *= -1; e.x = Math.max(60, Math.min(W - 60, e.x)); }
        if (e.y >= groundY - 15) { e.y = groundY - 15; e.ground = true; e.timer = 0.7 + Math.random() * 0.9; e.squash = 0.3; }
      }
    } else if (e.type === 'eye') {
      e.x = W * 0.42 + Math.sin(t * 0.45) * W * 0.22;
      e.y = H * 0.36 + Math.sin(t * 1.3) * 50;
      e.vx = Math.cos(t * 0.45);
    }
  }
}

function rrect(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function drawDummy(e){
  const { x, y } = e;
  ctx.fillStyle = '#6b4a2b';
  rrect(x - 3, y - 16, 6, 50, 2);
  rrect(x - 22, y - 13, 44, 6, 3);
  ctx.fillStyle = '#d4b077'; rrect(x - 14, y - 18, 28, 32, 6);
  ctx.fillStyle = '#b48b52'; rrect(x - 14, y + 8, 28, 5, 2);
  ctx.fillStyle = '#d4b077'; ctx.beginPath(); ctx.arc(x, y - 26, 9, 0, TAU); ctx.fill();
  [[7, '#c0453b'], [4.5, '#f1e4c0'], [2, '#c0453b']].forEach(([r, c]) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y - 3, r, 0, TAU); ctx.fill(); });
}
function drawSlime(e){
  const base = e.y + 15;
  const w = 46 * (1 + e.squash), h = 32 * (1 - e.squash);
  const cy = base - h / 2;
  const gr = ctx.createRadialGradient(e.x - w * 0.15, cy - h * 0.2, 2, e.x, cy, w * 0.6);
  gr.addColorStop(0, 'rgba(210,245,255,.95)'); gr.addColorStop(0.6, 'rgba(110,190,250,.9)'); gr.addColorStop(1, 'rgba(50,120,210,.9)');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.ellipse(e.x, cy, w / 2, h / 2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(30,80,160,.7)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.ellipse(e.x - w * 0.22, cy - h * 0.22, 5, 3, -0.5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#123a66';
  const ex = e.dir > 0 ? 4 : -4;
  [-7, 7].forEach(o => { ctx.beginPath(); ctx.ellipse(e.x + o + ex, cy - 1, 2.5, 4, 0, 0, TAU); ctx.fill(); });
}
function drawEye(e, t, mx, my){
  const back = e.vx > 0 ? -1 : 1;
  ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    ctx.strokeStyle = `rgba(160,210,255,${0.7 - i * 0.15})`; ctx.lineWidth = 4 - i;
    ctx.beginPath(); ctx.moveTo(e.x + back * 12, e.y - 6 + i * 6);
    ctx.quadraticCurveTo(e.x + back * 26, e.y - 8 + i * 6 + Math.sin(t * 8 + i) * 6, e.x + back * 38, e.y - 6 + i * 8 + Math.sin(t * 6 + i) * 6);
    ctx.stroke();
  }
  const gr = ctx.createRadialGradient(e.x - 5, e.y - 5, 2, e.x, e.y, 19);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#a9c6e8');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(e.x, e.y, 18, 0, TAU); ctx.fill();
  const dx = mx - e.x, dy = my - e.y, dl = Math.hypot(dx, dy) || 1;
  const ix = e.x + dx / dl * 6, iy = e.y + dy / dl * 6;
  const ig = ctx.createRadialGradient(ix, iy, 1, ix, iy, 10);
  ig.addColorStop(0, '#7fd4ff'); ig.addColorStop(1, '#1d6fb8');
  ctx.fillStyle = ig; ctx.beginPath(); ctx.arc(ix, iy, 10, 0, TAU); ctx.fill();
  ctx.fillStyle = '#081627'; ctx.beginPath(); ctx.arc(ix, iy, 4, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ix - 3, iy - 3, 2, 0, TAU); ctx.fill();
}

function drawScene(t, dt, list){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const s of stars) {
    ctx.fillStyle = `rgba(220,235,255,${0.3 + 0.4 * (0.5 + 0.5 * Math.sin(t * 2 + s.ph))})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  for (const e of list) {
    if (e.type === 'dummy') drawDummy(e);
    else if (e.type === 'slime') drawSlime(e);
    else drawEye(e, t, mouse.x, mouse.y);
  }
  for (const s of snow) {
    s.y += s.v * dt; s.x += Math.sin(t + s.ph) * 12 * dt;
    if (s.y > H) { s.y = -4; s.x = Math.random() * W; }
    ctx.fillStyle = `rgba(240,248,255,${0.35 + s.r * 0.25})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
}

// ---------- 瞄准状态 ----------
const mouse = { x: -999, y: -999 };
scene.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
scene.addEventListener('mouseleave', () => { mouse.x = mouse.y = -999; });

const newAim = () => ({ target: null, lock: 0, alpha: 0, age: -1, x: 0, y: 0 });
const aim = newAim();

function stepLock(rt, on, dt){
  if (on) { rt.lock = Math.min(1, rt.lock + dt / opt.lockTime); rt.alpha = Math.min(1, rt.alpha + dt * 10); }
  else { rt.lock = Math.max(0, rt.lock - dt * 3.5); rt.alpha = Math.max(0, rt.alpha - dt * 4.5); }
  if (on && rt.lock >= 1) rt.age = rt.age < 0 ? 0 : rt.age + dt;
  else if (!on) rt.age = -1;
}
function pick(){
  let best = null, bd = Infinity;
  for (const e of enemies) {
    const dx = Math.abs(mouse.x - e.x), dy = Math.abs(mouse.y - e.y);
    if (dx < e.w / 2 + 6 && dy < e.h / 2 + 6) {
      const d = dx + dy;
      if (d < bd) { bd = d; best = e; }
    }
  }
  return best;
}
function updateAim(dt){
  const hit = pick();
  if (hit && hit !== aim.target) { aim.target = hit; aim.lock = 0; aim.age = -1; }
  stepLock(aim, !!hit, dt);
  if (aim.target) {
    // 锁定过程中准星从鼠标位置吸附到目标中心
    const k = 1 - Math.pow(1 - aim.lock, 4);
    aim.x = mouse.x + (aim.target.x - mouse.x) * k;
    aim.y = mouse.y + (aim.target.y - mouse.y) * k;
  }
}

function drawReticle(rt, c, rad, t, variant = opt.variant){
  if (rt.alpha <= 0.001) return;
  const pal = PALETTES[opt.palette];
  const R = rad * opt.size * DPR;
  const e3 = 1 - Math.pow(1 - Math.min(rt.lock, 1), 3);
  gl.uniform2f(U.uCenter, rt.x * DPR, (H - rt.y) * DPR);
  gl.uniform1f(U.uExtent, R * 2.8);
  gl.uniform2f(U.uRes, glc.width, glc.height);
  gl.uniform1f(U.uRadius, R);
  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uLock, rt.lock);
  gl.uniform1f(U.uAge, rt.age);
  gl.uniform1f(U.uAlpha, rt.alpha);
  gl.uniform3fv(U.uDeep, pal.deep);
  gl.uniform3fv(U.uMid, pal.mid);
  gl.uniform1f(U.uChain, c.vis * e3);
  gl.uniform1f(U.uCd, c.shown);
  gl.uniform1f(U.uReady, c.blend);
  gl.uniform1f(U.uReadyAge, c.age);
  const rp = READY_PALETTES[opt.readyPalette] || pal;
  gl.uniform3fv(U.uReadyDeep, rp.deep);
  gl.uniform3fv(U.uReadyMid, rp.mid);
  gl.uniform1f(U.uVariant, variant);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ---------- 并排对比 ----------
const GALLERY = [
  { label: '冷却中 · 25%', cd: newCd(0.25) },
  { label: '冷却中 · 70%', cd: newCd(0.7) },
  { label: '冷却完毕', cd: newCd(1, true) },
  { label: '循环演示', cd: newCd(0), demo: true, hold: 0 },
];
// 全部就绪方案并排：每个都处于冷却完毕状态
const VARIANT_GALLERY = VARIANTS.map((v, i) => ({ label: `${i + 1}. ${v.name}`, cd: newCd(1, true), variant: i }));
const galleryAims = GALLERY.map(newAim);
const variantAims = VARIANT_GALLERY.map(newAim);
// 移动时各假人走不同的横向往返 + 跳跃轨迹，模拟实战中目标移动
const slotX = (i, n) => 360 + (W - 360) * (i + 0.5) / n;
const galleryDummies = (t, n) => Array.from({ length: n }, (_, i) => {
  const m = opt.moving ? 1 : 0;
  const x = slotX(i, n) + m * Math.sin(t * (1.1 + i * 0.23) + i * 1.7) * W * 0.05;
  const y = H * 0.5 - m * Math.abs(Math.sin(t * (1.6 + i * 0.31) + i)) * 70;
  return { type: 'dummy', x, y, w: 46, h: 70, rad: 42 };
});

// ---------- 主循环 ----------
let last = performance.now(), T = 0;
function frame(now){
  const dt = opt.paused ? 0 : Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  gl.viewport(0, 0, glc.width, glc.height);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);

  stepCd(cd, dt, opt.equip, opt.auto ? 1 / opt.cdTime : 0);
  syncHud();

  if (opt.gallery !== 'off') {
    const list = opt.gallery === 'states' ? GALLERY : VARIANT_GALLERY;
    const aims = opt.gallery === 'states' ? galleryAims : variantAims;
    const dummies = galleryDummies(T, list.length);
    drawScene(T, dt, dummies);
    ctx.font = '14px "Microsoft YaHei"'; ctx.textAlign = 'center'; ctx.fillStyle = '#cfe8ff';
    dummies.forEach((d, i) => {
      const g = list[i], rt = aims[i];
      if (g.demo) {
        // 3 秒冷却 → 就绪停留 1.6 秒 → 释放
        if (g.cd.ready && (g.hold += dt) > 1.6) { cast(g.cd); g.hold = 0; }
      }
      stepCd(g.cd, dt, opt.equip, g.demo ? 1 / 3 : 0);
      stepLock(rt, true, dt);
      rt.x = d.x; rt.y = d.y;
      ctx.fillText(g.label, slotX(i, list.length), H * 0.5 - 150 * opt.size);
      drawReticle(rt, g.cd, d.rad, T, g.variant ?? opt.variant);
    });
  } else {
    updateEnemies(dt, T);
    drawScene(T, dt, enemies);
    updateAim(dt);
    drawReticle(aim, cd, aim.target ? aim.target.rad : 30, T);
  }
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
