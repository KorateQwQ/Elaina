<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56" fill="none">
  <title>人偶操控 · 悬丝玩偶</title>
  <desc>透明底白色线稿，猫、垂耳犬、兔子与小熊玩偶以魔法丝线悬挂。空心轮廓与稀疏缝线减少辉光积聚。</desc>
  <defs>
    <mask id="strings-behind-dolls" maskUnits="userSpaceOnUse" x="0" y="0" width="56" height="56">
      <rect width="56" height="56" fill="white"/>
      <g fill="black" stroke="black" stroke-width="2">
        <path transform="translate(12 30) rotate(-9) scale(.9) translate(-12 -30)" d="M4.8 23.8 9.3 26Q12.1 24.7 14.8 25.9L18 22.8 18.2 29.1Q20.4 34.2 16 36.1Q12.3 38 8.1 35.8Q4.3 34.1 5.1 29.4Z"/>
        <path d="M21.4 23.1Q21.4 18.8 27.6 18.8Q33.5 18.8 34.5 23.8L34.9 29.8 31.5 31.8H24L20.4 29.8Z"/>
        <path transform="rotate(7 44.6 29)" d="M40.4 26C39.1 22.3 38.7 17.5 40.6 17.1C43 16.8 43.6 22.5 43.7 25.2L46 25.3C47.2 22.5 49.9 18.9 51.4 19.9C53 21.1 49.7 25.5 48.4 27.4C51.6 30.1 51.4 34.6 47.5 36.1C43.4 37.6 38.8 35.9 38.4 32.5C38.1 29.7 39.1 27.7 40.4 26Z"/>
        <path d="M19.5 38.4C16.1 37.3 17 32.6 20 33.1Q22.4 33.2 22.8 36Q27.7 34.6 32 36C32.5 33.1 36.1 32.4 37.4 34.6Q39.2 37.5 35.8 39C37 42 36.8 45.9 34.7 48Q32.1 50.7 27.5 50.7Q22.6 50.7 20.1 48Q17.8 45.2 19.5 38.4Z"/>
      </g>
    </mask>
  </defs>

  <!-- Fine strings are secondary to the hollow plush outlines. -->
  <g id="puppet-strings" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" mask="url(#strings-behind-dolls)">
    <path d="M28 7.5 11.2 26M28 7.5 42.1 17.2M28 8.8 27.8 36" stroke-width=".65" opacity=".4"/>
    <path d="M10.6 38.5Q13.1 43.1 17.1 44.2M39.3 43.8Q43.2 41.8 45 38.6" stroke-width=".75" opacity=".26"/>
  </g>

  <g stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cat: pointed ears, stitched eyes and a split embroidered muzzle. -->
    <g id="cat" transform="translate(12 30) rotate(-9) scale(.9) translate(-12 -30)">
      <path d="M4.8 23.8 9.3 26Q12.1 24.7 14.8 25.9L18 22.8 18.2 29.1Q20.4 34.2 16 36.1Q12.3 38 8.1 35.8Q4.3 34.1 5.1 29.4Z" stroke-width="1.05" opacity=".88"/>
      <path d="M7 26.7 8.4 28M16.4 26 15.6 27.8" stroke-width=".65" opacity=".52"/>
      <path d="M8.3 30.1 10.1 31.8M10.1 30.1 8.3 31.8M14.2 30 15.9 31.6M15.9 30 14.2 31.6" stroke-width=".7" opacity=".85"/>
      <path d="M11.5 32.3 12.5 32.3 12 33Z" fill="#fff" stroke="none" opacity=".88"/>
      <path d="M12 33v.7M10.3 33.9Q11 34.9 12 33.7Q13 34.9 13.7 33.9" stroke-width=".65" opacity=".76"/>
      <path d="M6.5 32.1 7.5 32.5M6.6 33.6 7.6 33.6" stroke-width=".6" opacity=".44"/>
    </g>

    <!-- Drooping ears distinguish the little dog at the back. -->
    <g id="dog">
      <path d="M23.3 22.2Q23.8 18.9 27.8 18.9Q31.7 18.9 32.8 22.2M23.7 27.9Q24.4 31.3 28.2 31.3Q31.5 31.3 32.1 28.1" stroke-width=".95" opacity=".83"/>
      <path d="M23.6 21.1C20.8 21.8 20.8 26.6 21.1 28.7Q21.5 30.1 22.6 29.5C23.6 28.9 24.2 24.2 23.6 21.1ZM32 21.1C34.7 21.7 35.1 26.5 34.6 28.8Q34.1 30.2 33 29.4C32 28.5 31.6 24.3 32 21.1Z" stroke-width=".85" opacity=".72"/>
      <path d="M25.9 23.7v1.2M29.9 23.7v1.2" stroke-width=".85" opacity=".87"/>
      <path d="M26.9 26.5Q28 25.7 29 26.5L28 27.4Z" stroke-width=".65" opacity=".83"/>
      <path d="M28 27.5v1M26.9 28.7Q28 29.5 29.2 28.7M27.5 20.4v.9" stroke-width=".6" opacity=".55"/>
    </g>

    <!-- Rabbit: distinct long ears, hollow face, small cross stitches. -->
    <g id="rabbit" transform="rotate(7 44.6 29)">
      <path d="M40.4 26C39.1 22.3 38.7 17.5 40.6 17.1C43 16.8 43.6 22.5 43.7 25.2L46 25.3C47.2 22.5 49.9 18.9 51.4 19.9C53 21.1 49.7 25.5 48.4 27.4C51.6 30.1 51.4 34.6 47.5 36.1C43.4 37.6 38.8 35.9 38.4 32.5C38.1 29.7 39.1 27.7 40.4 26Z" stroke-width="1" opacity=".88"/>
      <path d="M40.9 20.2 41.6 23.8M49.6 22.2 47.8 24.9" stroke-width=".6" opacity=".44"/>
      <path d="M40.9 29.4 42.5 31M42.5 29.4 40.9 31M46.5 29.8 48 31.3M48 29.8 46.5 31.3" stroke-width=".7" opacity=".84"/>
      <path d="M43.7 32.2h1.4l-.7.7Z" fill="#fff" stroke="none" opacity=".85"/>
      <path d="M44.4 32.9v.7M42.9 33.8Q43.7 34.7 44.4 33.6Q45.1 34.7 45.9 33.9" stroke-width=".65" opacity=".73"/>
    </g>

    <!-- Foreground teddy: no face fill, and open spacing between each facial stitch. -->
    <g id="bear">
      <path d="M19.5 38.4C16.1 37.3 17 32.6 20 33.1Q22.4 33.2 22.8 36Q27.7 34.6 32 36C32.5 33.1 36.1 32.4 37.4 34.6Q39.2 37.5 35.8 39C37 42 36.8 45.9 34.7 48Q32.1 50.7 27.5 50.7Q22.6 50.7 20.1 48Q17.8 45.2 19.5 38.4Z" stroke-width="1.05" opacity=".92"/>
      <path d="M19.3 36.8Q18.8 34.5 20.7 35.6M34.1 36Q35.6 34.6 35.8 36.6" stroke-width=".65" opacity=".47"/>
      <path d="M22.3 39.9 24.3 41.9M24.3 39.9 22.3 41.9M30.6 39.9 32.6 41.9M32.6 39.9 30.6 41.9" stroke-width=".8" opacity=".88"/>
      <path d="M24.6 44.5C24.6 42.3 30.7 42.3 30.7 44.5V46.1Q30.3 47.9 27.7 47.9Q25 47.9 24.6 46.1Z" stroke-width=".7" opacity=".68"/>
      <path d="M26.7 44.4h2l-1 1Z" fill="#fff" stroke="none" opacity=".88"/>
      <path d="M27.7 45.4v1M26.6 46.5h2.2" stroke-width=".65" opacity=".75"/>
      <path d="M27.5 36.7v1M27.5 39v.8M33.9 45.7l.8.6M32.8 47l.7.7" stroke-width=".6" opacity=".39"/>
    </g>
  </g>

  <g id="magic-controller" fill="#fff">
    <path d="M28 3.1 28.7 6.2 31.8 6.9 28.7 7.6 28 10.7 27.3 7.6 24.2 6.9 27.3 6.2Z" opacity=".9"/>
    <path d="M8.1 10 8.5 11.5 10 11.9 8.5 12.3 8.1 13.8 7.7 12.3 6.2 11.9 7.7 11.5Z" opacity=".6"/>
    <path d="M47.4 10.4 47.8 11.8 49.2 12.2 47.8 12.6 47.4 14 47 12.6 45.6 12.2 47 11.8Z" opacity=".6"/>
    <circle cx="37.5" cy="5.2" r=".45" opacity=".3"/>
    <circle cx="11.9" cy="47.4" r=".5" opacity=".38"/>
    <circle cx="45.3" cy="47.4" r=".5" opacity=".38"/>
  </g>
</svg>
