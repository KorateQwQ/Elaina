<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>炼金手记 · 改版预览</title>
<style>
/* ============================================================
   炼金手记改版：与魔女手札（Tools/SkillPanelRedesign）共用同一套设计语言
   · 同一张 1100×800 书页、同款页缘 / 点线内框 / 星角饰
   · 标题区：徽记圆 + 菱角 → 宋体书名 →（留白）→ 竖点线 → LV 印 + 经验条（位于右栏正上方）→ 关闭
   · 页签：等分格、数字紧跟标签、选中标记落在点线上；右侧「研究收录」与「星图收录」同构；页签下直接是目录，不加图例 / 工具条
   · 左栏目录：保留「标本卡」（倾斜 / 拾起回正 / 羽毛笔 / 封印）；默认月白纸（比现版压暗一档），夜色纸作对比
   · 右栏详情：不再是框中框，直接写在书页上，分区只用点线（与技能详情同款）
   · 底栏：与装配栏同一结构——点线 + 三连星 / 区块标题 / 方槽 / 竖点线 / 调试幽灵按钮
   ============================================================ */
@font-face { font-family: "Gelasio"; src: url("../../.vissandbox/gelasio-source/Gelasio.ttf"), local("Georgia"); }
:root {
  --ink: #eee9f5; --muted: #b2a8c3; --muted2: #9e96ae; --faint: #6c6579; --lav: #cab2ed; --gold: #e6cea5; --rose: rgb(226,128,150); --mint: rgb(178,222,200);
  --serif: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
  --hsans: "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
  --latin: "Gelasio", Georgia, serif;
  --dot: rgba(236,229,247,.32);
  /* 标本卡 · 夜色（对比用；默认 body.moon） */
  --cBg: rgb(47,39,62); --cBg2: rgb(41,34,55); --cEdge: rgba(202,178,237,.26); --cDot: rgba(236,229,247,.2); --cMark: rgba(202,178,237,.5);
  --cInk: rgb(240,231,244); --cMuted: rgb(170,158,190); --cFaint: rgba(178,168,195,.45); --cShadow: rgba(6,4,12,.55);
  --cLock: rgba(178,168,195,.28); --cLockInk: rgba(178,168,195,.42); --cGold: rgb(230,206,165); --cGoldA: rgba(230,206,165,.75);
}
/* 默认：月白纸（接近现在游戏内的浅色纸卡，纸色压暗一档，避免在深色书页上发白刺眼） */
body.moon {
  --cBg: rgb(226,220,234); --cBg2: rgb(214,207,224); --cEdge: rgba(120,100,145,.35); --cDot: rgba(90,70,115,.28); --cMark: rgba(110,85,140,.6);
  --cInk: rgb(52,44,64); --cMuted: rgb(118,108,134); --cFaint: rgba(118,108,134,.6); --cShadow: rgba(6,4,12,.6); --cGold: rgb(150,108,40); --cGoldA: rgba(150,108,40,.8);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font-family: var(--hsans); color: var(--ink); background: #07080d; }
svg.defs { position: absolute; width: 0; height: 0; }
#world { position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 30% 20%, rgba(70,84,140,.45), transparent 70%),
    radial-gradient(ellipse 60% 40% at 80% 85%, rgba(60,40,70,.5), transparent 70%),
    linear-gradient(180deg, #1b2440, #121626 60%, #0d0f18); }
#world::after { content: ""; position: absolute; inset: 0; background: rgb(8,10,18); opacity: .72; }
#app { width: 1100px; height: 800px; position: absolute; left: 50%; top: 50%; transform-origin: center; }
#body, #page { position: absolute; left: 0; top: 0; width: 1100px; height: 800px; }
#body { pointer-events: none; }
#body svg { position: absolute; left: 0; top: 0; overflow: visible; }
#page > img.surface { position: absolute; left: 0; top: 0; width: 1100px; height: 800px; display: block; }
svg.layer { position: absolute; left: 0; top: 0; width: 1100px; height: 800px; overflow: visible; }
#chrome { pointer-events: none; z-index: 3; }
#chrome .hit { pointer-events: all; cursor: pointer; fill: transparent; }
#marker { transition: transform .18s ease-in-out; }
.spark { width: 1em; height: 1em; display: inline-block; vertical-align: -.12em; fill: currentColor; }
.dotline { height: 3px; background: radial-gradient(circle, var(--dot) .7px, transparent 1px) 0 50% / 4.5px 3px repeat-x; }
.vdots { width: 3px; background: radial-gradient(circle, var(--dot) .7px, transparent 1px) 50% 0 / 3px 4.5px repeat-y; }
.lat { font-family: var(--latin); }
img.px, image.px { image-rendering: pixelated; }

/* ============ 目录：标本卡 ============ */
#catalog { position: absolute; left: 26px; top: 150px; width: 727px; height: 550px; overflow: hidden;
  -webkit-mask: linear-gradient(180deg, transparent, #000 16px, #000 calc(100% - 26px), transparent); mask: linear-gradient(180deg, transparent, #000 16px, #000 calc(100% - 26px), transparent); }
#scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
#scroller::-webkit-scrollbar { display: none; }
#grid { position: relative; width: 727px; }
.card { position: absolute; width: 118px; height: 132px; cursor: pointer;
  transform: translate(var(--ox), var(--oy)) rotate(var(--r));
  transition: transform .55s cubic-bezier(.3,1.55,.55,1), opacity .25s; }
.card > svg { position: absolute; left: 0; top: 0; width: 118px; height: 132px; overflow: visible; }
.card .sh { position: absolute; inset: 2px; transform: translate(2px, 4px); background: var(--cShadow); filter: blur(5px); transition: transform .4s, opacity .4s; opacity: .8; }
.card.st-locked .sh { display: none; }
.card:hover { transform: translate(var(--ox), calc(var(--oy) - 3px)) rotate(calc(var(--r) * .6)) scale(1.015); z-index: 2; }
.card:hover .sh { transform: translate(3px, 7px); opacity: .9; }
.card.sel { transform: translate(0, -6px) rotate(0deg) scale(1.045); z-index: 4; }
.card.sel .sh { transform: translate(4px, 10px); opacity: 1; filter: blur(8px); }
.card.sel > svg { animation: breathe 2.6s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { filter: drop-shadow(0 0 3px rgba(230,206,165,.35)); } 50% { filter: drop-shadow(0 0 9px rgba(230,206,165,.6)); } }
/* 像素图标不随卡片旋转 / 缩放：最近邻采样下旋转会切歪像素行、非整数缩放会让像素一宽一窄。
   图标只跟随位置，朝向与尺寸用反向变换抵消（缓动与卡片一致）。 */
.card .ico { position: absolute; pointer-events: none; transform: rotate(calc(var(--r) * -1));
  transition: transform .55s cubic-bezier(.3,1.55,.55,1); }
.card:hover .ico { transform: rotate(calc(var(--r) * -.6)) scale(calc(1 / 1.015)); }
.card.sel .ico { transform: scale(calc(1 / 1.045)); }
.card.st-locked .ico { opacity: .26; filter: grayscale(1); }
/* 物品描边（body.ol）：只用在深色书页上；纸卡上的物品自带深色轮廓，白纸上不再加边 */
body.ol .dIcon image.px, body.ol #slots image.px, body.ol .ing img.px, body.ol .chip img.px { filter: url(#olDark); }
/* 可制 · 丝带：悬停 / 选中时轻轻一晃（书签丝带同款节奏） */
.card .rb { transform-box: fill-box; transform-origin: 50% 0; }
.card:hover .rb, .card.sel .rb { animation: rbSway 1.6s cubic-bezier(.3,.6,.4,1) both; }
@keyframes rbSway { 0% { transform: rotate(0); } 20% { transform: rotate(6deg); } 45% { transform: rotate(-3.5deg); } 70% { transform: rotate(1.5deg); } 100% { transform: rotate(0); } }
/* 可制 · 角星：错开相位慢慢闪 */
.card .twk { transform-box: fill-box; transform-origin: center; animation: twinkle 2.8s ease-in-out infinite; animation-delay: var(--tw, 0s); }
@keyframes twinkle { 0%, 100% { opacity: .75; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
.card.flash > svg { animation: flash .9s ease-out; }
@keyframes flash { 0% { filter: drop-shadow(0 0 0 rgba(255,244,220,0)) brightness(1); } 25% { filter: drop-shadow(0 0 14px rgba(255,244,220,.9)) brightness(1.35); } 100% { filter: drop-shadow(0 0 3px rgba(230,206,165,.35)) brightness(1); } }
/* 选中卡封印上方升起的三颗小光点 */
.mote { position: absolute; left: 59px; top: -2px; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: rgb(255,244,220);
  box-shadow: 0 0 4px rgba(255,236,200,.9); opacity: 0; animation: rise 2.4s ease-out infinite; pointer-events: none; }
.mote:nth-of-type(2) { animation-delay: .8s; --dx: -7px; } .mote:nth-of-type(3) { animation-delay: 1.6s; --dx: 6px; }
@keyframes rise { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 20% { opacity: .95; } 100% { opacity: 0; transform: translate(var(--dx, 2px), -26px) scale(1); } }
#quill { position: absolute; width: 22px; height: 42px; z-index: 5; pointer-events: none; image-rendering: auto;
  transition: left .45s cubic-bezier(.25,.8,.3,1), top .45s cubic-bezier(.25,.8,.3,1); filter: drop-shadow(1px 3px 2px rgba(6,4,12,.5)); }
/* 自绘滚动条：一条竖点线 + 薰衣草滑块 */
#sbar { position: absolute; left: 741px; top: 162px; width: 3px; height: 518px; z-index: 3; }
#sbar .vdots { position: absolute; inset: 0; }
#sbar i { position: absolute; left: 0; width: 3px; border-radius: 1.5px; background: rgba(202,178,237,.7); }
#toast { position: absolute; left: 389.5px; top: 664px; transform: translate(-50%, 6px); white-space: nowrap; height: 28px; padding: 0 18px; border-radius: 14px; z-index: 6;
  display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 1.5px; color: rgb(240,222,186);
  background: rgba(24,19,32,.92); box-shadow: inset 0 0 0 1px rgba(227,193,141,.5), 0 6px 18px rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast .spark { width: 9px; height: 9px; }
#toast b { font: 13px/1 var(--latin); font-weight: 400; }

/* ============ 右栏详情（嵌页，与技能详情同款结构） ============ */
.detail { position: absolute; left: 790px; top: 160px; width: 270px; height: 536px; color: var(--ink); }
.detail .in { height: 100%; display: flex; flex-direction: column; }
.detail .dotline { flex: none; margin: 12px 0; }
.dKind { display: flex; align-items: center; gap: 6px; height: 14px; font-size: 11px; letter-spacing: 2px; color: rgb(196,180,210); flex: none; }
.dKind .spark { width: 8px; height: 8px; color: var(--lav); }
.dKind .st { margin-left: auto; font-size: 10px; letter-spacing: 1.5px; color: var(--muted2); display: flex; align-items: center; gap: 5px; }
.dKind .st.gold { color: var(--gold); } .dKind .st.rose { color: var(--rose); }
.dHead { display: flex; align-items: center; gap: 12px; margin-top: 8px; flex: none; }
.dIcon { width: 76px; height: 76px; flex: none; margin-left: -4px; overflow: visible; }
.dName { flex: 1; min-width: 0; }
.dName h2 { margin: 0; font: 400 25px/1.25 var(--serif); letter-spacing: 3px; color: rgb(240,231,244); white-space: nowrap; }
.dName h2.mask { color: var(--muted); letter-spacing: 4px; }
.dSub { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 1.5px; color: var(--muted2); }
.dSub .lat { font-size: 12px; letter-spacing: .5px; color: var(--muted); }
.dSub .rar { display: inline-flex; gap: 3px; }
.dSub .rar i { width: 6px; height: 6px; transform: rotate(45deg); box-shadow: inset 0 0 0 1px rgba(230,206,165,.55); }
.dSub .rar i.on { background: rgba(230,206,165,.9); box-shadow: none; }
.dSub .own { margin-left: auto; display: flex; align-items: baseline; gap: 5px; font-size: 10px; letter-spacing: 1.5px; }
.dSub .own b { font: 400 16px/1 var(--latin); letter-spacing: 0; color: var(--ink); }
.dSub .own b.nil { color: var(--faint); }
/* 中段可滚动：长效果 / 多素材不会把底部动作挤出页面 */
.dMid { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; margin-right: -8px; padding-right: 8px; }
.dMid::-webkit-scrollbar { display: none; }
.dMid.more { -webkit-mask: linear-gradient(180deg, #000 calc(100% - 22px), transparent); mask: linear-gradient(180deg, #000 calc(100% - 22px), transparent); }
.dMid .dotline { margin: 12px 0; }
h4.sec { margin: 0 0 6px; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 400; letter-spacing: 2px; color: rgb(196,180,210); }
h4.sec .spark { width: 8px; height: 8px; color: var(--lav); }
h4.sec .r { margin-left: auto; font-size: 10px; letter-spacing: 1.5px; color: var(--muted2); }
h4.sec .r .lat { font-size: 12px; letter-spacing: 0; color: var(--muted); }
.dDesc p { margin: 0; font-size: 13px; line-height: 1.85; letter-spacing: .5px; color: rgba(238,233,245,.86); }
.dDesc p .mana { color: rgb(120,165,255); }
.dDesc p .mana img { width: 13px; height: 13px; vertical-align: -2px; margin-right: 2px; }
/* 效果条目：与「下一级」行同款——左名称，右数值，行间一道极淡的线 */
.rows { margin-top: 6px; }
.rows .r { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-height: 28px; padding: 5px 0; line-height: 18px; font-size: 12px; letter-spacing: 1.5px; color: rgb(214,200,224); }
.rows .r + .r { box-shadow: inset 0 1px 0 rgba(236,229,247,.06); }
.rows .r > span:first-child { flex: none; }
.rows .v { text-align: right; font-size: 12px; letter-spacing: 1px; color: var(--ink); }
.rows .v.num { font: 15px/18px var(--latin); letter-spacing: 0; }
.rows .v.bad { color: var(--rose); }
.rows .v b { font-weight: 400; } .rows .v .ok { color: var(--gold); } .rows .v .no { color: var(--rose); }
/* 所需素材：图标 + 名称（可点击跳到该素材条目）+ 持有 / 需要 */
.ing { display: flex; align-items: center; gap: 10px; height: 34px; }
.ing + .ing { box-shadow: inset 0 1px 0 rgba(236,229,247,.06); }
.ing .ii { width: 26px; height: 26px; flex: none; display: grid; place-items: center; position: relative; }
.ing .ii::before { content: ""; position: absolute; inset: 0; transform: rotate(45deg) scale(.78); box-shadow: inset 0 0 0 1px rgba(202,178,237,.2); }
.ing .ii img { max-width: 24px; max-height: 24px; position: relative; }
.ing .nm { font-size: 13px; letter-spacing: 1px; color: rgb(222,212,232); }
.ing a.nm { cursor: pointer; text-decoration: none; background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size .2s, color .15s; }
.ing a.nm:hover { color: var(--lav); background-size: 100% 1px; }
.ing a.nm::after { content: "›"; margin-left: 4px; font-size: 12px; color: var(--muted2); }
.ing .v { margin-left: auto; font: 14px/1 var(--latin); color: var(--muted); white-space: nowrap; }
.ing .v b { font-weight: 400; font-size: 17px; } .ing .v .ok { color: var(--gold); } .ing .v .no { color: var(--rose); }
.ing .v small { font-size: 11px; color: var(--muted2); margin-left: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { all: unset; cursor: pointer; height: 22px; padding: 0 10px; border-radius: 11px; font-size: 11px; letter-spacing: 1.2px; color: rgb(214,200,224);
  box-shadow: inset 0 0 0 1px rgba(236,229,247,.2); display: inline-flex; align-items: center; gap: 6px; transition: all .15s; }
.chip img { max-width: 16px; max-height: 16px; }
.chip:hover { color: var(--ink); box-shadow: inset 0 0 0 1px rgba(236,229,247,.5); background: rgba(236,229,247,.05); }
.chip.locked { color: var(--faint); }
.plain { margin: 0; font-size: 12px; line-height: 1.8; letter-spacing: 1px; color: rgba(238,233,245,.8); }
.dRec { margin-top: 12px; display: flex; align-items: center; font-size: 10px; letter-spacing: 2px; color: var(--muted2); }
.dRec .spark { width: 8px; height: 8px; color: var(--lav); margin-right: 6px; }
.dRec span:last-child { margin-left: auto; color: rgb(196,180,210); letter-spacing: 1px; }
/* 底部：批数胶囊（缩放胶囊同款）+ 提示 + 动作 */
.dFoot { flex: none; }
.dBatch { display: flex; align-items: center; gap: 10px; height: 28px; }
.dBatch .lb { font-size: 11px; letter-spacing: 2px; color: rgb(196,180,210); }
.step { height: 27px; border-radius: 13.5px; display: flex; align-items: center; background: rgba(26,22,35,.45); box-shadow: inset 0 0 0 1px rgba(236,229,247,.18); }
.step button { all: unset; cursor: pointer; width: 28px; height: 27px; display: grid; place-items: center; color: var(--lav); font: 16px/1 var(--latin); }
.step button:hover { color: var(--ink); }
.step button.off { color: rgba(178,168,195,.3); pointer-events: none; }
.step .q { width: 28px; text-align: center; font: 15px/27px var(--latin); color: var(--ink); }
.step .vd { width: 3px; height: 16px; margin: 0 2px; background: radial-gradient(circle, var(--dot) .7px, transparent 1px) 50% 0 / 3px 4.5px repeat-y; }
.step button.mx { width: auto; padding: 0 12px 0 8px; font: 11px/1 var(--hsans); letter-spacing: 1.5px; color: var(--muted); }
.step button.mx:hover { color: var(--ink); }
.dBatch .out { margin-left: auto; font-size: 10px; letter-spacing: 1.5px; color: var(--muted2); }
.dBatch .out b { font: 400 17px/1 var(--latin); letter-spacing: 0; color: var(--mint); margin-left: 4px; }
.dLack { margin: 10px 0 8px; text-align: right; font-size: 10px; letter-spacing: 1.5px; color: var(--rose); min-height: 12px; }
.dLack.ok { color: var(--muted2); } .dLack .lat { font-size: 11px; letter-spacing: .5px; }
.dActs { display: flex; gap: 10px; }
.dBtn { all: unset; box-sizing: border-box; cursor: pointer; flex: 1; height: 36px; border-radius: 18px; position: relative; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; letter-spacing: 3px; color: rgb(222,212,232);
  box-shadow: inset 0 0 0 1px rgba(236,229,247,.26); transition: background .15s, box-shadow .15s, color .15s; }
.dBtn:hover { color: var(--ink); background: rgba(236,229,247,.06); box-shadow: inset 0 0 0 1px rgba(236,229,247,.55); }
.dBtn.gold { color: rgb(240,222,186); background: rgba(185,155,87,.1); box-shadow: inset 0 0 0 1px rgba(227,193,141,.6); }
.dBtn.gold:hover { background: rgba(185,155,87,.2); box-shadow: inset 0 0 0 1px rgba(227,193,141,.95), 0 0 14px rgba(195,162,118,.18); }
.dBtn.gold::before, .dBtn.gold::after { content: ""; position: absolute; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; background: currentColor; opacity: .55;
  -webkit-mask: var(--sparkMask) center / contain no-repeat; mask: var(--sparkMask) center / contain no-repeat; }
.dBtn.gold::before { left: 16px; } .dBtn.gold::after { right: 16px; }
.dBtn.dis { opacity: .4; pointer-events: none; }
.dBtn .c { font: 13px/1 var(--latin); letter-spacing: 0; opacity: .85; }
.dBtn .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, rgba(227,193,141,.08), rgba(227,193,141,.28)); pointer-events: none; }
.dBtn.brew { pointer-events: none; }
.dBtn.brew .fill { animation: brew var(--brew) linear forwards; }
@keyframes brew { to { width: 100%; } }
.dDone { margin-top: 2px; display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 2px; color: var(--muted2); }
.dDone .spark { width: 8px; height: 8px; color: var(--gold); }
.fade { animation: fadeIn .28s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ============ 底栏（与装配栏同构） ============ */
.bottomLine { position: absolute; top: 704px; left: 26px; width: 1048px; height: 13px; display: flex; align-items: center; }
.bottomLine .dotline { flex: 1; }
.bottomLine svg { fill: var(--ink); flex: none; }
.bottom { position: absolute; left: 32px; right: 30px; top: 719px; height: 68px; display: flex; align-items: center; }
.matHead { width: 78px; flex: none; }
.matHead h3 { margin: 0; font: 400 13px/1 var(--serif); letter-spacing: 2px; display: flex; align-items: center; gap: 5px; color: rgb(213,197,215); }
.matHead small { display: block; margin-top: 7px; font-size: 10px; color: var(--muted2); letter-spacing: 1px; padding-left: 17px; white-space: nowrap; }
.matHead small .lat { font-size: 11px; }
/* 素材袋：8 格可视窗口，内容横向滚动；滚轮 / 拖动滑块 / 点轨道均可 */
.matStrip { position: relative; width: 386px; height: 68px; flex: none; }
.matView { position: absolute; left: 0; top: 0; width: 386px; height: 60px; overflow: hidden; }
.matView.fadeR { -webkit-mask: linear-gradient(90deg, #000 calc(100% - 26px), transparent); mask: linear-gradient(90deg, #000 calc(100% - 26px), transparent); }
.matView.fadeL { -webkit-mask: linear-gradient(90deg, transparent, #000 26px); mask: linear-gradient(90deg, transparent, #000 26px); }

  t.innerHTML = `${SP}${html}`; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2800);
}

/* ============================================================
   底栏 · 素材袋：装配栏同款方槽
   · 原先只重复右栏的「所需素材」；现在列出背包里所有炼金素材，当前配方要用的排在最前并描金
   · 数量压在下框线上（装配栏把键位压在上框线上，这里对称地放到下边）
   ============================================================ */
let hoverSlot = -1;
const matView = document.getElementById("matView"), hbar = document.getElementById("hbar");
function matList() {
  const r = byId(selId), need = stateOf(r) === "done" && craftable(r) ? r.ing.map(([n, m]) => [m, n * qty]) : [];
  const req = need.map(([m, n]) => ({ m, need: n }));
  const rest = Object.keys(MATS).filter(m => have(m) > 0 && !need.some(([x]) => x === m)).map(m => ({ m }));
  return req.concat(rest);
}

function renderSlots() {
  _gid = 3000;
  const list = matList(), n = Math.max(8, list.length), W = n * 48 - 6 + 2;
  const SURF = "rgb(32,30,47)", Y = 9;
  let o = "";
  for (let i = 0; i < n; i++) {
    const it = list[i], x = 1 + i * 48, y = Y, hv = i === hoverSlot, cx = x + 21, cy = y + 21;
    const req = it && it.need != null, enough = req && have(it.m) >= it.need;
    if (req) o += glowE(cx, cy, 30, 30, "rgb(195,162,118)", .2);
    o += `<rect x="${x}" y="${y}" width="42" height="42" fill="${req ? rgba(185, 155, 87, .1) : "rgb(33,27,44)"}"/>`;
    for (let k = 1; k <= 3; k++) o += frame(x + k, y + k, 42 - 2 * k, 42 - 2 * k, req ? rgba(185, 155, 87, .09) : rgba(52, 35, 62, .333));
    o += frame(x, y, 42, 42, req ? (enough ? "rgba(227,193,141,.9)" : C(ROSE, .7)) : hv ? C(LAV) : rgba(164, 136, 179, .34));
    if (!it) { o += crossStar(cx, cy, 5, 5, rgba(155, 125, 173, .35), .4); continue; }
    // 原图 1 倍居中（只在超出 30 时缩小），不做非整数放大
    const sz = ICON_SIZE[it.m] || [24, 24], k = Math.max(sz[0], sz[1]) > 30 ? 30 / Math.max(sz[0], sz[1]) : 1, iw = sz[0] * k, ih = sz[1] * k;
    o += `<image class="px" href="${matIcon(it.m)}" x="${Math.round(cx - iw / 2)}" y="${Math.round(cy - 1 - ih / 2)}" width="${iw}" height="${ih}"/>`;
    // 数量压在下框线上
    const label = req ? `${have(it.m)}/${it.need}` : String(have(it.m)), lw = measure(label, 9, LATIN);
    o += `<rect x="${x + 40 - lw - 3}" y="${y + 37}" width="${lw + 6}" height="10" fill="${SURF}"/>`;
    o += T(label, x + 40, y + 36, 9, req ? (enough ? "rgb(240,222,186)" : C(ROSE)) : "rgb(203,189,211)", { font: LATIN, align: 1 });
    if (req) o += crossStar(x + 6, y + 6, 6, 6, enough ? "rgb(227,193,141)" : C(ROSE, .9), .4);
    const ent = entryOfMat(it.m);
    o += `<rect class="hit" data-i="${i}" data-m="${it.m}" x="${x - 3}" y="${y - 4}" width="48" height="56"><title>${MATS[it.m][0]} · 持有 ${have(it.m)}${req ? ` · 需要 ${it.need}` : ""}\n${MATS[it.m][1]}${ent ? "\n点击查看条目" : ""}</title></rect>`;
  }
  const svg = document.getElementById("slots");
  svg.setAttribute("width", W); svg.setAttribute("viewBox", `0 0 ${W} 60`); svg.innerHTML = o;
  document.getElementById("matCount").innerHTML = `持有 <span class="lat">${Object.keys(MATS).filter(m => have(m) > 0).length}</span> 种`;
  updateHbar();
}
// 滑条：滑块长度 = 可视宽 / 内容宽；位置跟随 scrollLeft；内容放得下时整条隐藏
function updateHbar() {
  const vw = matView.clientWidth, cw = matView.scrollWidth, max = Math.max(0, cw - vw), th = hbar.querySelector("i"), tw = hbar.clientWidth;
  hbar.style.display = max > 0 ? "" : "none";
  if (max > 0) { const w = Math.max(24, tw * vw / cw); th.style.width = w + "px"; th.style.left = (tw - w) * matView.scrollLeft / max + "px"; }
  matView.classList.toggle("fadeL", matView.scrollLeft > 1);
  matView.classList.toggle("fadeR", matView.scrollLeft < max - 1);
}
const scrollMats = x => { matView.scrollLeft = Math.max(0, Math.min(matView.scrollWidth - matView.clientWidth, x)); updateHbar(); };
// 滚轮：竖向滚轮直接横向滚动素材袋
document.querySelector(".matStrip").addEventListener("wheel", e => { e.preventDefault(); scrollMats(matView.scrollLeft + (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY)); }, { passive: false });
// 拖动滑块 / 点轨道跳转
hbar.addEventListener("pointerdown", e => {
  const th = hbar.querySelector("i"), tw = hbar.clientWidth, w = th.offsetWidth, max = matView.scrollWidth - matView.clientWidth;
  const k = hbar.getBoundingClientRect().width / tw || 1;   // 页面整体缩放
  const toScroll = left => scrollMats(max * left / Math.max(1, tw - w));
  let grab = w / 2;
  if (e.target === th) grab = (e.clientX - th.getBoundingClientRect().left) / k;
  const x0 = hbar.getBoundingClientRect().left;
  const move = ev => toScroll((ev.clientX - x0) / k - grab);
  move(e);
  hbar.classList.add("drag"); hbar.setPointerCapture(e.pointerId);
  hbar.onpointermove = move;
  hbar.onpointerup = () => { hbar.classList.remove("drag"); hbar.onpointermove = hbar.onpointerup = null; };
});
const slotsEl = document.getElementById("slots");
slotsEl.addEventListener("click", e => { const s = e.target.closest(".hit"); if (!s) return; const ent = entryOfMat(s.dataset.m); if (ent) select(ent.id, true); });
slotsEl.addEventListener("pointerover", e => { const s = e.target.closest(".hit"), i = s ? +s.dataset.i : -1; if (i !== hoverSlot) { hoverSlot = i; renderSlots(); } });
slotsEl.addEventListener("pointerleave", () => { if (hoverSlot !== -1) { hoverSlot = -1; renderSlots(); } });

/* ---------- 调试按钮 ---------- */
document.getElementById("tLv").onclick = () => { if (level < LV_CAP) { level++; if (level >= LV_CAP) exp = 0; toast(`炼金等级 <b>${level}</b>`); refreshAll(); } };
document.getElementById("tFill").onclick = () => {
  const r = byId(selId);
  if (!(stateOf(r) === "done" && craftable(r))) { toast("当前条目没有可补充的配方素材"); return; }
  for (const [n, m] of r.ing) inv[m] = have(m) + n * 10;
  toast(`已补充「${r.n}」单批需求的 <b>10</b> 倍素材`); refreshAll();
};
document.getElementById("tReset").onclick = () => { resetState(); qty = 1; toast("手记已重置"); refreshAll(); };
function refreshAll() { renderChrome(); renderCards(); renderDetail(false); renderSlots(); document.getElementById("tLv").classList.toggle("dis", level >= LV_CAP); }


/* ---------- 键盘：在当前分类内移动 ---------- */
addEventListener("keydown", e => {
  const d = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -COLS, ArrowDown: COLS }[e.key];
  if (d == null) return;
  e.preventDefault();
  const list = visible(), i = list.findIndex(r => r.id === selId), j = Math.max(0, Math.min(list.length - 1, i + d));
  if (j !== i) select(list[j].id, true);
});

/* ---------- 预览开关 ---------- */
document.getElementById("devPaper").onclick = e => { document.body.classList.toggle("moon"); e.target.textContent = "纸色：" + (document.body.classList.contains("moon") ? "月白" : "夜色"); };
document.getElementById("devStamp").onclick = e => {
  const ks = Object.keys(STAMPS); stamp = ks[(ks.indexOf(stamp) + 1) % ks.length];
  e.target.textContent = "可制标记：" + STAMPS[stamp]; renderChrome(); renderCards();
};
document.getElementById("devOl").onclick = e => { document.body.classList.toggle("ol"); e.target.textContent = "物品描边：" + (document.body.classList.contains("ol") ? "贴纸" : "无"); };
document.getElementById("devLang").onclick = e => {
  const ks = Object.keys(LANGS); lang = ks[(ks.indexOf(lang) + 1) % ks.length];
  e.target.textContent = "语言：" + LANGS[lang]; renderChrome(); renderCards();
};
const DEMOS = [["mana", "素材不足"], ["bread", "可炼制"], ["featherlight", "可研究"], ["starpower", "条件未满足"], ["flour", "外界素材"], ["moondew", "中间素材"]];
let demo = 0;
document.getElementById("devSel").onclick = e => { demo = (demo + 1) % DEMOS.length; select(DEMOS[demo][0], true); e.target.textContent = "示例：" + DEMOS[demo][1]; };

function fit() { document.getElementById("app").style.transform = `translate(-50%, -50%) scale(${Math.min(innerWidth / 1180, innerHeight / 860)})`; }
addEventListener("resize", fit); fit();
const Q = new URLSearchParams(location.search);
if (Q.get("sel") && byId(Q.get("sel"))) selId = Q.get("sel");
if (Q.get("researched") === "all") { const all = () => R.forEach(r => researched.add(r.id)); all(); const rs = resetState; resetState = () => { rs(); all(); }; }
if (Q.get("outline") === "0") { document.body.classList.remove("ol"); document.getElementById("devOl").textContent = "物品描边：无"; }
if (LANGS[Q.get("lang")]) { lang = Q.get("lang"); document.getElementById("devLang").textContent = "语言：" + LANGS[lang]; }
if (STAMPS[Q.get("stamp")]) { stamp = Q.get("stamp"); document.getElementById("devStamp").textContent = "可制标记：" + STAMPS[stamp]; }
if (Q.get("paper") === "night") { document.body.classList.remove("moon"); document.getElementById("devPaper").textContent = "纸色：夜色"; }
// 素材图标的原始尺寸（底栏方槽按原图 1 倍绘制）
const ICON_SIZE = {};
const iconsReady = Promise.all(Object.keys(MATS).map(m => new Promise(res => {
  const im = new Image(); im.onload = () => { ICON_SIZE[m] = [im.naturalWidth, im.naturalHeight]; res(); }; im.onerror = res; im.src = matIcon(m);
})));
function boot() { renderBody(); renderFrame(); refreshAll(); select(selId, true); }
boot();
Promise.all([document.fonts.ready, iconsReady]).then(boot);
</script>
