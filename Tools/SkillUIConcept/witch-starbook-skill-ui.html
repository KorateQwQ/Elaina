<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星蝶魔导书 · 技能界面样式预览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d9b86c; --gold2:#f4e2ad; --goldDim:#8a7447; --goldFaint:rgba(217,184,108,.22);
  --text:#dde1f4; --muted:#8e95c2; --faint:#5d6394;
  --rose:#cfa2ec; --mana:#4c91ff; --red:#e0889a; --green:#a9d8b4;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  --latin:"Cinzel","Trajan Pro",serif; --italic:"Cormorant Garamond","Georgia",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05060f;font-family:var(--serif);color:var(--text);user-select:none}
svg{display:block}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
#sky,#drift{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#stage{position:absolute;left:0;top:0;width:1600px;height:1000px;transform-origin:0 0}

/* ---------- sky ---------- */
.tw{animation:twinkle var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes twinkle{0%,100%{opacity:var(--o)}50%{opacity:calc(var(--o)*.25)}}
.shoot{animation:shoot 9s linear infinite}
@keyframes shoot{0%,86%{stroke-dasharray:0 400;stroke-dashoffset:0;opacity:0}88%{opacity:1}95%{stroke-dasharray:160 400;stroke-dashoffset:-60;opacity:.9}100%{stroke-dasharray:0 400;stroke-dashoffset:-260;opacity:0}}

/* ---------- book ---------- */
#book{position:absolute;left:90px;top:92px;width:1420px;height:820px}
#ribbons,#cover{position:absolute;left:0;top:0;overflow:visible}
.page{position:absolute;top:30px;width:674px;height:770px}
#leftPage{left:34px}
#rightPage{left:712px}
#close{position:absolute;left:1392px;top:-14px;width:40px;height:40px;cursor:pointer}
#close:hover .o{stroke:var(--gold2)}

.ribbon{cursor:pointer}
.ribbon .body{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.ribbon text{font-family:var(--serif);font-size:14px;fill:#f6eedd;text-anchor:middle;pointer-events:none}
.ribbon:hover .body{transform:translateY(-6px)}
.ribbon.on .body{transform:translateY(-16px)}

/* ---------- left page ---------- */
#crest{position:absolute;left:40px;top:28px}
#titleBlock{position:absolute;left:206px;top:40px;width:440px}
.kicker{font-family:var(--latin);font-size:12px;letter-spacing:5px;color:var(--goldDim)}
.title{font-size:44px;font-weight:700;letter-spacing:6px;line-height:1.15;
  background:linear-gradient(180deg,#fff4cf 0%,#e2c27a 55%,#a8874a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(226,194,122,.25))}
.subtitle{font-size:13.5px;color:var(--muted);letter-spacing:2px;margin-top:6px;white-space:nowrap}
.subtitle i{font-family:var(--italic);font-size:16px;letter-spacing:.5px;color:#a9a1cf}
#profile{position:absolute;left:206px;top:150px;width:440px;height:76px;display:flex;align-items:center;gap:16px;white-space:nowrap}
.lvring{position:relative;width:72px;height:72px;flex:none}
.lvring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--latin);font-size:24px;color:var(--gold2);line-height:1;font-weight:500}
.lvring b small{font-size:9px;letter-spacing:2px;color:var(--goldDim);margin-bottom:2px}
.pcol{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);letter-spacing:1px}
.pcol .v{font-family:var(--latin);color:var(--text);font-size:13px;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.pcol .v em{font-style:normal;color:var(--gold2);font-size:16px}
.pcol .v img{width:20px;height:20px}
.vsep{width:1px;height:46px;background:linear-gradient(transparent,var(--goldFaint),transparent)}
.bar{width:120px;height:3px;background:#262a52;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#9064c4,#f4e2ad)}
.rule{position:absolute;height:12px}
#chart{position:absolute;left:20px;top:250px;width:634px;height:490px}
#chartSvg{position:absolute;inset:0;overflow:visible}
#legend{position:absolute;left:40px;top:744px;display:flex;gap:20px;font-size:12px;color:var(--muted);align-items:center}
#legend span{display:flex;align-items:center;gap:6px}
#chartHint{position:absolute;right:40px;top:744px;font-size:12px;color:var(--faint);letter-spacing:1px}

/* nodes: HTML over the SVG chart so pixel icons stay crisp */
.node{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;cursor:pointer;transition:opacity .4s}
.node .halo{position:absolute;left:-30px;top:-30px;width:124px;height:124px;border-radius:50%;
  background:radial-gradient(circle,var(--el) 0%,transparent 62%);opacity:0;transition:opacity .4s;pointer-events:none}
.node .plate{position:absolute;left:4px;top:4px;width:56px;height:56px;background:radial-gradient(circle at 50% 38%,#25224c,#0c0e23 75%);
  clip-path:polygon(6px 0,50px 0,56px 6px,56px 50px,50px 56px,6px 56px,0 50px,0 6px)}
.node img{position:absolute;left:4px;top:4px;width:56px;height:56px;transition:filter .4s}
.node .fr{position:absolute;left:0;top:0;width:64px;height:64px;overflow:visible;pointer-events:none}
.node .fr .edge0{fill:none;stroke:#545884;stroke-width:1.2}
.node .fr .tick{fill:none;stroke:#545884;stroke-width:1.2;opacity:0}
.node .fr .gem{fill:#545884}
.node .sel{fill:none;stroke:var(--rose);stroke-width:1;stroke-dasharray:3 5;opacity:0;transform-origin:32px 32px;animation:spin 14s linear infinite;transition:opacity .3s}
.node .name{position:absolute;left:-38px;width:140px;top:70px;text-align:center;font-size:12.5px;letter-spacing:1px;color:#9aa0c9;white-space:nowrap}
.node .lv{position:absolute;left:-38px;width:140px;top:87px;text-align:center;font-family:var(--latin);font-size:9.5px;letter-spacing:1.5px;color:#6c7199}
.node .q{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:#14163a;border:1px solid #4a4e7c;color:#8a8fc0;font:10px var(--latin);display:flex;align-items:center;justify-content:center}
.node.learned .halo{opacity:.42}
.node.learned .fr .edge0{stroke:var(--gold)}
.node.learned .fr .tick{stroke:var(--gold);opacity:.8}
.node.learned .fr .gem{fill:var(--gold2)}
.node.learned .name{color:#ecdfbb}
.node.learned .lv{color:var(--gold)}
.node.available img{filter:saturate(.55) brightness(.82)}
.node.available .fr .edge0{stroke:var(--gold);stroke-dasharray:4 3}
.node.available .fr .gem{fill:var(--gold)}
.node.available .halo{animation:pulse 2.6s ease-in-out infinite}
.node.available .name{color:#d0c7a8}
.node.locked img{filter:grayscale(1) brightness(.45) contrast(.9)}
.node.locked .name{color:#757aa6}
.node.hidden img{filter:brightness(0) drop-shadow(0 0 1px rgba(160,140,230,.95)) drop-shadow(0 0 1px rgba(160,140,230,.6))}
.node.hidden .fr .edge0{stroke:#3b3f66;stroke-dasharray:1 3.5}
.node.hidden .name{color:#4f557f}
.node:hover .fr .edge0{stroke-width:2}
.node:hover img{filter:none}
.node.locked:hover img{filter:grayscale(.6) brightness(.7)}
.node.hidden:hover img{filter:brightness(0) drop-shadow(0 0 1px #cfa2ec) drop-shadow(0 0 2px #cfa2ec)}
.node.on .sel{opacity:1}
.node.on .halo{opacity:.6}
.node.on .fr .edge0{stroke:var(--gold2);stroke-width:1.6}
.node.dim{opacity:.16}
.node.flash .halo{animation:flash .9s ease-out}
.node.core .ring{fill:none;stroke:var(--gold);stroke-opacity:.5}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.08}50%{opacity:.4}}
@keyframes flash{0%{opacity:1;transform:scale(.5)}100%{opacity:.42;transform:scale(1.5)}}
.edge{fill:none;transition:opacity .4s}
.edge.lit{stroke:var(--gold);stroke-width:1.3;opacity:.6}
.edge.flow{stroke:#fff3c9;stroke-width:1.6;stroke-dasharray:2 14;animation:flow 2.2s linear infinite;opacity:.75}
.edge.open{stroke:var(--gold);stroke-width:1;stroke-dasharray:5 5;opacity:.38}
.edge.dark{stroke:#4a4e7c;stroke-width:1;stroke-dasharray:1 5;opacity:.7}
.edge.dim{opacity:.06}
@keyframes flow{to{stroke-dashoffset:-32}}
#tip{position:absolute;pointer-events:none;z-index:9;padding:8px 12px 9px;background:rgba(14,17,38,.95);border:1px solid rgba(217,184,108,.45);
  font-size:12px;color:var(--muted);opacity:0;transform:translate(-50%,-100%);transition:opacity .15s;white-space:nowrap;
  clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
#tip b{display:block;font-size:14px;color:var(--gold2);font-weight:600;letter-spacing:1px;margin-bottom:2px}

/* butterfly: a clipped window over the project's 4×4 sprite sheet */
.bfo{position:absolute;left:0;top:0;width:64px;height:64px;pointer-events:none;z-index:6}
.bfw{width:64px;height:64px;overflow:hidden;
  filter:sepia(.45) hue-rotate(215deg) saturate(1.5) drop-shadow(0 0 .7px #1a0f33) drop-shadow(0 0 .7px #1a0f33) drop-shadow(0 0 5px rgba(207,162,236,.9)) drop-shadow(0 0 12px rgba(144,100,196,.6))}
.bfw img{display:block;width:256px;height:256px}
.drift{opacity:.45;z-index:0}

/* ---------- right page ---------- */
#detail{position:absolute;inset:0}
#detail.swap .body{animation:inkIn .55s cubic-bezier(.2,.7,.2,1)}
@keyframes inkIn{0%{opacity:0;clip-path:inset(0 100% 0 0);filter:blur(3px)}60%{opacity:1}100%{opacity:1;clip-path:inset(0 -20px 0 0);filter:blur(0)}}
.chapter{position:absolute;left:44px;right:44px;top:30px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--goldDim);letter-spacing:3px}
.chapter .pg{font-family:var(--latin);letter-spacing:4px}
#medal{position:absolute;left:30px;top:66px;width:140px;height:140px}
#medal .glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,var(--el) 0%,transparent 64%);opacity:.5}
#medal svg{position:absolute;inset:0;overflow:visible}
#medal .plate{position:absolute;left:14px;top:14px;width:112px;height:112px;background:radial-gradient(circle at 50% 36%,#2b2757,#0b0d22 76%);
  clip-path:polygon(10px 0,102px 0,112px 10px,112px 102px,102px 112px,10px 112px,0 102px,0 10px)}
#medal img{position:absolute;left:14px;top:14px;width:112px;height:112px}
.sname{position:absolute;left:190px;top:76px;font-size:36px;font-weight:700;letter-spacing:5px;color:#f1e6c8;text-shadow:0 0 18px rgba(226,194,122,.25);white-space:nowrap}
.sen{position:absolute;left:192px;top:126px;font-family:var(--italic);font-size:18px;color:#a69ecb;letter-spacing:.5px}
.tags{position:absolute;left:190px;top:160px;display:flex;gap:8px}
.tag{font-size:11.5px;letter-spacing:2px;padding:3px 10px 4px;border:1px solid rgba(217,184,108,.38);color:#d8c79c;background:rgba(217,184,108,.06);white-space:nowrap}
.tag.rose{border-color:rgba(207,162,236,.45);color:var(--rose);background:rgba(207,162,236,.07)}
.tag.el{border-color:color-mix(in srgb,var(--el) 55%,transparent);color:var(--el);background:color-mix(in srgb,var(--el) 9%,transparent)}
.tag.dim{border-color:#3f4370;color:var(--faint);background:none}
.desc{position:absolute;left:44px;right:44px;top:222px;height:118px;overflow:hidden;font-size:14.5px;line-height:1.85;color:#c8cce6;text-align:justify}
.desc .cap{float:left;width:48px;height:48px;margin:5px 10px 0 0;position:relative}
.desc .cap svg{position:absolute;inset:0}
.desc .cap span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--gold2)}
.desc em{font-style:normal;color:var(--gold2)}
.desc .mp{color:var(--mana);white-space:nowrap}
.desc .mp img{width:16px;height:16px;vertical-align:-3px;margin-right:1px}
.stats{position:absolute;left:44px;right:44px;top:352px;height:60px;display:flex}
.stat{flex:1;display:flex;align-items:center;gap:12px;padding-left:16px;position:relative}
.stat+.stat::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:1px;background:linear-gradient(transparent,var(--goldFaint),transparent)}
.stat img{width:30px;height:30px;flex:none}
.stat .l{font-size:11.5px;color:var(--muted);letter-spacing:2px}
.stat .n{font-family:var(--latin);font-size:23px;color:#f1e6c8;line-height:1.1}
.stat .n small{font-size:11px;color:var(--goldDim);margin-left:3px;letter-spacing:1px}
.lvrow{position:absolute;left:44px;right:44px;top:426px;display:flex;align-items:center;gap:14px}
.lvrow .l{font-size:13px;color:var(--muted);letter-spacing:3px}
.moons{display:flex;gap:9px}
.lvrow .n{margin-left:auto;font-family:var(--latin);font-size:13px;color:var(--goldDim);letter-spacing:2px}
.lvrow .n b{font-size:22px;color:var(--gold2);font-weight:500;margin-right:4px}
.cmp{position:absolute;left:44px;right:44px;top:466px}
.cmp .h{font-size:12.5px;color:var(--muted);letter-spacing:3px;margin-bottom:2px}
.cmp .row{display:flex;align-items:baseline;height:27px;font-size:13.5px;color:#b9bedb}
.cmp .row .lead{flex:1;margin:0 10px;border-bottom:1px dotted rgba(142,149,194,.35);transform:translateY(-4px)}
.cmp .row .c{font-family:var(--latin);color:#9aa0c9;font-size:14px}
.cmp .row .a{color:var(--goldDim);margin:0 8px;font-size:12px}
.cmp .row .x{font-family:var(--latin);color:var(--gold2);font-size:15px;min-width:58px;text-align:right}
.cmp .row .x small{font-size:10px;color:var(--goldDim);margin-left:2px}
.cmp .note{font-size:13.5px;color:var(--muted);line-height:1.8}
.reqs{position:absolute;left:44px;right:44px;top:566px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.reqs .l{letter-spacing:2px;margin-right:4px}
.req{display:flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid #33386a;background:rgba(10,12,30,.5)}
.req img{width:18px;height:18px}
.req b{font-family:var(--latin);font-weight:500;color:var(--green)}
.req.short b{color:var(--red)}
.actions{position:absolute;left:44px;right:44px;top:606px;height:60px;display:flex;align-items:center;gap:14px}
.seal-wrap{position:relative;flex:1;height:56px;padding-left:28px}
.seal-btn{position:relative;width:100%;height:56px;border:none;cursor:pointer;color:#f6ead0;font-family:var(--serif);text-align:left;padding-left:52px;
  background:linear-gradient(100deg,#4a2b62 0%,#33204e 55%,#28203f 100%);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);transition:filter .2s}
.seal-btn::after{content:"";position:absolute;inset:3px;border:1px solid rgba(217,184,108,.45);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);pointer-events:none}
.seal-btn:hover{filter:brightness(1.18)}
.seal-btn .t1{display:block;font-size:19px;letter-spacing:6px;font-weight:600}
.seal-btn .t2{display:flex;align-items:center;gap:4px;font-size:11.5px;color:#bba9d6;letter-spacing:1px;margin-top:1px}
.seal-btn .t2 img{width:14px;height:14px}
.seal-btn.off{cursor:default;background:linear-gradient(100deg,#252845,#1c1f38);color:#7d82ad;filter:none}
.seal-btn.off .t2{color:#5b6090}
.seal{position:absolute;left:-4px;top:-6px;width:68px;height:68px;pointer-events:none;z-index:2}
.seal-wrap.stamp .seal{animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{0%{transform:scale(1)}35%{transform:scale(.78) rotate(-8deg)}100%{transform:scale(1)}}
.ghost-btn{height:56px;width:170px;border:1px solid rgba(217,184,108,.4);background:rgba(217,184,108,.05);color:#e2d3ac;font-family:var(--serif);font-size:15px;letter-spacing:3px;cursor:pointer;transition:background .2s}
.ghost-btn small{display:block;font-size:11px;color:var(--goldDim);letter-spacing:1px;margin-top:2px}
.ghost-btn:hover{background:rgba(217,184,108,.12)}
.ghost-btn.off{border-color:#33386a;color:#5b6090;background:none;cursor:default}
.ghost-btn.off small{color:#464b78}
.toggle{display:flex;align-items:center;gap:10px;height:56px;width:170px;padding:0 14px;border:1px solid rgba(207,162,236,.35);cursor:pointer;font-size:14px;letter-spacing:2px;color:var(--rose)}
.toggle svg{width:46px;height:24px}
.toggle.offst{color:var(--faint);border-color:#33386a}
.loadout{position:absolute;left:44px;right:44px;top:680px}
.loadout .head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);letter-spacing:3px}
.loadout .head span:last-child{color:var(--faint);letter-spacing:1px;font-size:11.5px}
.slots{display:flex;justify-content:space-between;margin-top:18px}
.slot{position:relative;width:64px;height:64px;cursor:pointer}
.slot .plate{position:absolute;left:4px;top:4px;width:56px;height:56px;background:radial-gradient(circle at 50% 38%,#1c1b3e,#0b0d21 75%);
  clip-path:polygon(6px 0,50px 0,56px 6px,56px 50px,50px 56px,6px 56px,0 50px,0 6px)}
.slot img{position:absolute;left:4px;top:4px;width:56px;height:56px}
.slot svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.slot .e{fill:none;stroke:#3a3f6c;stroke-width:1.2;transition:stroke .2s}
.slot:hover .e{stroke:var(--goldDim)}
.slot.full .e{stroke:var(--gold)}
.slot.pick .e{stroke:var(--rose);stroke-width:2}
.slot .num{font-family:var(--latin);font-size:9px;letter-spacing:1px;fill:var(--goldDim);text-anchor:middle}
.slot .plus{stroke:#3e4372;stroke-width:1.2}
#foot{position:absolute;left:0;right:0;top:944px;text-align:center;font-size:12px;letter-spacing:3px;color:#4c527f}
#foot b{font-weight:400;color:#6d73a3}
</style>
</head>
<body>
<svg id="sky" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="skyG" cx="50%" cy="8%" r="95%"><stop offset="0" stop-color="#1d2458"/><stop offset=".45" stop-color="#0d1130"/><stop offset="1" stop-color="#04050d"/></radialGradient>
    <radialGradient id="moonGlow"><stop offset="0" stop-color="#f6e6b8" stop-opacity=".35"/><stop offset="1" stop-color="#f6e6b8" stop-opacity="0"/></radialGradient>
    <linearGradient id="moonFace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6da"/><stop offset="1" stop-color="#d7bf86"/></linearGradient>
    <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
    <mask id="crescent"><circle cx="1500" cy="74" r="56" fill="#fff"/><circle cx="1524" cy="58" r="50" fill="#000"/></mask>
  </defs>
  <rect width="1600" height="1000" fill="url(#skyG)"/>
  <g filter="url(#blur40)" opacity=".55">
    <ellipse cx="760" cy="420" rx="900" ry="120" fill="#3b2f78" transform="rotate(-18 760 420)" opacity=".55"/>
    <ellipse cx="700" cy="450" rx="560" ry="54" fill="#7a5bb0" transform="rotate(-18 760 420)" opacity=".35"/>
    <ellipse cx="1200" cy="860" rx="420" ry="160" fill="#2b2d6e" opacity=".5"/>
  </g>
  <g id="stars"></g>
  <circle cx="1500" cy="74" r="140" fill="url(#moonGlow)"/>
  <circle cx="1500" cy="74" r="56" fill="url(#moonFace)" mask="url(#crescent)"/>
  <path class="shoot" d="M1180 40 L880 210" stroke="#fff3cf" stroke-width="1.6" stroke-linecap="round" fill="none"/>
</svg>
<div id="drift"></div>

<div id="stage">
  <div id="book">
    <svg id="ribbons" width="1420" height="820"></svg>
    <svg id="cover" width="1420" height="820" viewBox="0 0 1420 820">
      <defs>
        <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3c2249"/><stop offset=".5" stop-color="#2a1736"/><stop offset="1" stop-color="#36203f"/></linearGradient>

function applyFilter(){
  document.querySelectorAll('.node').forEach(n => n.classList.toggle('dim', !inCat(byId[n.dataset.id])));
  document.querySelectorAll('.edge').forEach(e => e.classList.toggle('dim', !inCat(byId[e.dataset.a]) && !inCat(byId[e.dataset.b])));
}
function tip(s, show){
  const t = $('#tip');
  if (!show){ t.style.opacity = 0; return; }
  const st = state(s);
  t.innerHTML = `<b>${st === 'hidden' ? '？？？' : s.name}</b>${CATS[s.type].name} · ${STATE_NAME[st]}${st === 'learned' ? ` · ${s.lv}/${s.max}` : ''}`;
  t.style.left = s.x + 'px'; t.style.top = s.y - (s.core ? 64 : 48) + 'px'; t.style.opacity = 1;
}

/* ---------- butterfly (project sprite, 4×4 frames, faces left) ---------- */
function makeButterfly(cls){
  const o = document.createElement('div'); o.className = 'bfo ' + (cls || '');
  o.innerHTML = `<div class="bfw"><img src="${ASSET.butterfly}" alt=""></div>`;
  o.img = o.querySelector('img');
  return o;
}
function setFrame(o, f){ o.img.style.transform = `translate(${-(f % 4)*64}px,${-Math.floor(f/4)*64}px)`; }
const perch = makeButterfly();
const bf = {x:0, y:0, flip:false, anim:0};
const perchPoint = s => ({x: s.x + (s.core ? 40 : 34), y: s.y - (s.core ? 46 : 38)});
function placeBf(x, y, f){
  perch.style.left = (x - 32).toFixed(1) + 'px'; perch.style.top = (y - 32).toFixed(1) + 'px';
  perch.style.transform = bf.flip ? 'scaleX(-1)' : '';
  setFrame(perch, f);
}
function flyTo(s, instant){
  const to = perchPoint(s);
  cancelAnimationFrame(bf.anim); clearTimeout(idleTimer);
  if (instant){ bf.x = to.x; bf.y = to.y; placeBf(bf.x, bf.y, 14); idleFlap(); return; }
  const from = {x:bf.x, y:bf.y}, dist = Math.hypot(to.x-from.x, to.y-from.y);
  const ctrl = {x:(from.x+to.x)/2 + (to.y-from.y)*.25, y:Math.min(from.y, to.y) - 50 - dist*.15};
  const dur = 520 + dist*1.4, t0 = performance.now(); bf.flip = to.x > from.x;
  const step = now => {
    const t = Math.min(1, (now - t0)/dur), e = t < .5 ? 4*t*t*t : 1 - (-2*t+2)**3/2, u = 1 - e;
    bf.x = u*u*from.x + 2*u*e*ctrl.x + e*e*to.x;
    bf.y = u*u*from.y + 2*u*e*ctrl.y + e*e*to.y + Math.sin(now/90)*2*(1-t);
    placeBf(bf.x, bf.y, t < 1 ? Math.floor(now/38) % 16 : 14);
    if (t < 1) bf.anim = requestAnimationFrame(step); else idleFlap();
  };
  bf.anim = requestAnimationFrame(step);
}
let idleTimer;
function idleFlap(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    const t0 = performance.now();
    const step = now => {
      const f = Math.floor((now - t0)/55);
      if (f >= 16){ placeBf(bf.x, bf.y, 14); idleFlap(); return; }
      placeBf(bf.x, bf.y, f); bf.anim = requestAnimationFrame(step);
    };
    bf.anim = requestAnimationFrame(step);
  }, 1800 + Math.random()*2600);
}
(function drift(){
  const host = $('#drift'), list = [];
  for (let i = 0; i < 4; i++){
    const o = makeButterfly('drift'); host.appendChild(o);
    list.push({o, ph:i*1.7, sp:.00005 + i*.000012, s:.42 + (i%2)*.14, lane:[.045,.955,.1,.9][i]});
  }
  const tick = now => {
    const W = innerWidth, H = innerHeight;
    list.forEach(b => {
      const t = now*b.sp + b.ph, x = ((t*.9) % 1.2 - .1)*W, y = b.lane*H + Math.sin(t*9)*24 + Math.sin(t*23)*7;
      b.o.style.transform = `translate(${x}px,${y}px) scale(${-b.s},${b.s})`;
      setFrame(b.o, Math.floor(now/60 + b.ph*10) % 16);
    });
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();

const canPay = s => P.points >= s.cost;
function reqs(s, st){

  return `<div class="reqs"><span class="l">${st === 'available' ? '研习所需' : '进修所需'}</span>
    <span class="req ${canPay(s) ? '' : 'short'}"><img src="${ASSET.study}">研习点 <b>${P.points} / ${s.cost}</b></span></div>`;

function actions(s, st){
  let main, side;
  const costLine = `<img src="${ASSET.study}">消耗 ${s.cost} 研习点`;
  if (st === 'hidden') main = {t1:'尚未显现', t2:'这一页仍被星光封存', off:true};
  else if (st === 'locked') main = {t1:'尚未接通', t2:`需先习得「${byId[s.pre.find(id => byId[id].lv === 0)].name}」`, off:true};
  else if (st === 'available') main = {t1:'研 习', t2: canPay(s) ? costLine : '研习点不足', off:!canPay(s), act:'learn'};
  else if (s.lv >= s.max) main = {t1:'已臻圆满', t2:'此页已无可进修之处', off:true};
  else main = {t1:'进 修', t2: canPay(s) ? costLine : '研习点不足', off:!canPay(s), act:'up'};
  if (st === 'learned' && s.type === 'active'){
    const at = P.slots.indexOf(s.id);
    side = `<button class="ghost-btn" data-act="equip">${at >= 0 ? '卸 下' : '装 配'}<small>${at >= 0 ? `当前 · 第 ${roman(at+1)} 格` : `至第 ${roman(P.pick+1)} 格`}</small></button>`;
  } else if (st === 'learned'){
    side = `<div class="toggle ${s.on ? '' : 'offst'}" data-act="toggle"><svg viewBox="0 0 46 24"><rect x="1" y="3" width="44" height="18" rx="9" fill="${s.on ? 'rgba(207,162,236,.18)' : '#12142c'}" stroke="currentColor" stroke-opacity=".6"/>

  } else side = `<button class="ghost-btn off">装 配<small>${s.type === 'passive' ? '心得无需装配' : '习得后可装配'}</small></button>`;
  return `<div class="actions"><div class="seal-wrap">${seal(main.off)}<button class="seal-btn ${main.off ? 'off' : ''}" data-act="${main.act || ''}"><span class="t1">${main.t1}</span><span class="t2">${main.t2}</span></button></div>${side}</div>`;
}
function loadout(){
  const slots = P.slots.map((id, i) => {
    const s = id && byId[id];
    return `<div class="slot ${s ? 'full' : ''} ${i === P.pick ? 'pick' : ''}" data-slot="${i}"><div class="plate"></div>
      ${s ? `<img class="px" src="${icon(s)}" alt="">` : ''}
      <svg viewBox="0 0 64 64"><path class="e" d="M8 1H56L63 8V56L56 63H8L1 56V8Z"/>${s ? '' : '<path class="plus" d="M27 32H37M32 27V37"/>'}<text class="num" x="32" y="-6">${roman(i+1)}</text></svg></div>`;
  }).join('');
  return `<div class="loadout"><div class="head"><span>随身咒契</span><span>点击空位选定 · 再点「装配」或双击星点</span></div><div class="slots">${slots}</div></div>`;
}
function renderDetail(anim = true){
  const s = sel, st = state(s), d = $('#detail');
  const pg = 40 + SK.indexOf(s)*2;
  let body;
  if (st === 'hidden'){
    const pre = byId[s.pre[0]];
    body = `${medal(s, st)}
      <div class="sname" style="color:#7d82ad">未显现之页</div><div class="sen">— folium latens —</div>
      <div class="tags"><span class="tag dim">${CATS[s.type].name}</span><span class="tag dim">未显现</span></div>
      <div class="desc" style="color:#7d82ad"><div class="cap">${capSvg(true)}<span style="color:#7d82ad">此</span></div>页的墨迹尚未干透，只能隐约看见一个图案的轮廓。或许当<em style="color:#b8a8d6">「${pre.name}」</em>被完整读懂之后，这一页才会向你显露它的名字。</div>
      ${actions(s, st)}`;
  } else {
    const plain = s.desc.replace(/<[^>]+>/g, ''), first = plain[0];
    const moons = Array.from({length:s.max}, (_, i) => moon(i < s.lv ? 'full' : i === s.lv && st !== 'locked' ? 'next' : 'empty')).join('');
    let cmp;
    if (s.lv >= s.max) cmp = `<div class="note">此页已被读至最深处。星光会在这里停留，不再改变。</div>`;
    else if (st === 'learned' && s.up) cmp = `<div class="h">下一次进修 · ${roman(s.lv)} → ${roman(s.lv+1)}</div>` +
      s.up.map(([l, c, x, u]) => `<div class="row"><span>${l}</span><span class="lead"></span><span class="c">${c}</span><span class="a">⟶</span><span class="x">${x}<small>${u}</small></span></div>`).join('');
    else if (st === 'available') cmp = `<div class="note">书页已经向你敞开。研习后，<em style="font-style:normal;color:var(--gold2)">${s.name}</em>将以第 Ⅰ 阶写入星图${s.type === 'active' ? '，并可装配到随身咒契' : ''}。</div>`;
    else cmp = `<div class="note">需先习得 ${s.pre.filter(id => byId[id].lv === 0).map(id => `<span style="color:var(--rose)">「${byId[id].name}」</span>`).join(' 与 ')}，此页的星轨才会接通。</div>`;
    const equipped = s.type === 'active' && P.slots.includes(s.id);
    body = `${medal(s, st)}
      <div class="sname">${s.name}</div><div class="sen">${s.en}</div>
      <div class="tags"><span class="tag">${CATS[s.type].name}</span><span class="tag el" style="--el:${ELEM[s.el].c}">${ELEM[s.el].name}</span>
        <span class="tag ${st === 'learned' ? 'rose' : st === 'locked' ? 'dim' : ''}">${STATE_NAME[st]}</span>${equipped ? `<span class="tag rose">已装配 · ${roman(P.slots.indexOf(s.id)+1)}</span>` : ''}</div>
      <div class="desc"><div class="cap">${capSvg()}<span>${first}</span></div>${s.desc.replace(first, '')}</div>
      <div class="stats">${s.stats.map(statHtml).join('')}</div>
      <div class="lvrow"><span class="l">研习进度</span><div class="moons">${moons}</div><span class="n"><b>${s.lv}</b>/ ${s.max}</span></div>
      <div class="cmp">${cmp}</div>
      ${reqs(s, st)}
      ${actions(s, st)}`;
  }
  d.innerHTML = `
    <div class="chapter"><span>${CATS[cat].ch}</span><span class="pg">— ${pg} —</span></div>
    <svg class="rule" id="ruleR" style="left:44px;top:52px;width:586px" viewBox="0 0 586 12"></svg>
    <div class="body">${body}</div>
    ${loadout()}`;
  rule($('#ruleR'), 586);
  bindDetail();
  if (anim){ d.classList.remove('swap'); void d.offsetWidth; d.classList.add('swap'); }
}
function bindDetail(){
  const d = $('#detail');
  d.querySelectorAll('[data-slot]').forEach(e => e.addEventListener('click', () => {
    const i = +e.dataset.slot;
    if (P.pick === i && P.slots[i]){ select(byId[P.slots[i]]); return; }
    P.pick = i; renderDetail(false);
  }));
  const main = d.querySelector('.seal-btn[data-act]');
  if (main && main.dataset.act) main.addEventListener('click', () => {
    const s = sel; if (!canPay(s)) return;
    P.points -= s.cost; s.lv++;
    main.parentElement.classList.add('stamp');
    setTimeout(() => { drawChart(); drawProfile(); renderDetail(false); flash(s); }, 260);
  });
  const eq = d.querySelector('[data-act="equip"]');
  if (eq) eq.addEventListener('click', () => equip(sel));
  const tg = d.querySelector('[data-act="toggle"]');
  if (tg) tg.addEventListener('click', () => { sel.on = !sel.on; renderDetail(false); });
}
function flash(s){
  const n = document.querySelector(`.node[data-id="${s.id}"]`); if (!n) return;
  n.classList.add('flash'); setTimeout(() => n.classList.remove('flash'), 900);
}
function equip(s){
  if (state(s) !== 'learned' || s.type !== 'active') return;
  const at = P.slots.indexOf(s.id);
  if (at >= 0 && s === sel){ P.slots[at] = null; P.pick = at; }
  else { if (at >= 0) P.slots[at] = null; P.slots[P.pick] = s.id; const free = P.slots.indexOf(null); if (free >= 0) P.pick = free; }
  if (s !== sel) select(s); else renderDetail(false);
}
function select(s){
  if (s === sel && document.querySelector('.node.on')) return;
  sel = s;
  document.querySelectorAll('.node').forEach(n => n.classList.toggle('on', n.dataset.id === s.id));
  flyTo(s); renderDetail();
}

/* ---------- boot ---------- */
drawRibbons(); drawCrest(); drawProfile(); rule($('#ruleL'), 594); drawLegend(); drawChart(); renderDetail(false);
flyTo(sel, true);
$('#close').addEventListener('click', () => { const b = $('#book'); b.style.transition = 'transform .5s, opacity .5s'; b.style.transform = 'scale(.96)'; b.style.opacity = '0'; setTimeout(() => { b.style.transform = ''; b.style.opacity = ''; }, 900); });
</script>
</body>
</html>
