<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>冰凌锁 · 特效预览</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#dce8f1;background:#0b111b;font-size:14px}
*{box-sizing:border-box}body{margin:0}main{max-width:1500px;padding:24px 30px 18px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}
h1{font-size:24px;letter-spacing:.06em;margin:0 0 7px;font-weight:600}.subtitle{color:#8c9eae;font-size:12px}
.badge{border:1px solid #334557;padding:7px 12px;border-radius:20px;color:#a7cada;white-space:nowrap;font-size:12px}
.toolbar,.transport,.markers{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.toolbar{justify-content:space-between;margin-bottom:14px}
.group{display:flex;align-items:center;gap:8px}.label{color:#7f94a7;font-size:12px;margin-right:3px}
button,select{background:#162231;border:1px solid #2c3e50;color:#c5d6e3;padding:9px 13px;border-radius:7px;font:inherit;cursor:pointer}
button:hover,select:hover{border-color:#789db3;background:#1e3043}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #b2e6ff;outline-offset:3px}
button[aria-pressed=true],.primary{background:#c2e8fb;border-color:#c2e8fb;color:#132736}.primary:hover{background:#dbf2ff}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-height:65vh;overflow:hidden;border:1px solid #2b3b4c;border-radius:12px;background:#213040}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
.stage-note{position:absolute;left:18px;top:15px;pointer-events:none;color:#9db2c3;font-size:11px;letter-spacing:.12em}
.frame-note{position:absolute;right:18px;bottom:15px;background:#0e1724bb;color:#bad4e6;padding:7px 10px;border-radius:5px;font-variant-numeric:tabular-nums;pointer-events:none}
.timeline{margin-top:16px;display:flex;align-items:center;gap:16px}input[type=range]{flex:1;accent-color:#b5e5ff;cursor:pointer;min-width:100px}
output{font-size:12px;color:#a6bacb;font-variant-numeric:tabular-nums;min-width:112px}.transport{margin-top:13px;justify-content:space-between}.markers{gap:6px}.markers button{font-size:12px;padding:7px 10px}
footer{margin-top:18px;display:flex;justify-content:space-between;gap:12px;color:#6f8599;font-size:12px;line-height:1.6}a{color:#98c3df;text-decoration:none}a:hover{text-decoration:underline}
#error{display:none;white-space:pre-wrap;background:#381d25;color:#ffc2c2;padding:14px;margin:12px 0;border-radius:7px}
@media(max-width:800px){main{padding:15px}header{align-items:flex-start}.toolbar{gap:12px}.stage{max-height:none}footer{display:block}footer>span{display:block;margin-top:4px}.transport{gap:15px}.badge{display:none}}
</style>
</head>
<body><main>
<header><div><h1>冰凌锁</h1><div class="subtitle">悬停瞄准 · 确认蓄冰 · 快速乱序齐射</div><div class="subtitle" id="buildStatus"></div></div><span class="badge">FNA 离线帧 · HTML 播放</span></header>
<div class="toolbar">
  <div class="group" role="group" aria-label="预览版本"><label class="label" for="demo">演示</label><select id="demo"><option value="cast">完整施法</option><option value="switch">切换目标</option></select><span class="label">版本</span><button id="after" aria-pressed="true">优化版</button><button id="before" aria-pressed="false">修改前</button></div>
  <div class="group"><label class="label" for="target">目标</label><select id="target"><option value="fishron">猪鲨</option><option value="golem">石巨人</option><option value="none">无目标</option></select>
  <label class="label" for="background">背景</label><select id="background"><option value="normal">森林白昼</option><option value="dark">森林夜晚</option></select>
  <label class="label" for="zoom">缩放</label><select id="zoom"><option value="1">全景</option><option value="2" selected>2 倍</option><option value="3">3 倍</option><option value="4">4 倍</option></select><button id="recenter">居中</button></div>
</div>
<div id="error" role="alert"></div>
<div class="stage" id="stage"><canvas id="canvas" aria-label="冰凌锁动画画面"></canvas><div class="stage-note" id="stageLabel">优化版 / 成球渐亮</div><div class="frame-note" id="frameLabel">正在载入</div></div>
<div class="timeline"><input id="timeline" aria-label="动画时间轴" type="range" min="0" max="277" value="0" step="1"><output id="time">0.00 / 4.62 秒</output></div>
<div class="transport">
 <div class="group"><button id="play" class="primary">暂停</button><button id="restart">重播</button><button id="previous" aria-label="上一帧">←</button><button id="next" aria-label="下一帧">→</button><label class="label" for="speed">速度</label><select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option></select></div>
 <div class="markers" id="castMarkers"><span class="label">跳转</span><button data-phase="hover">悬停瞄准</button><button data-phase="confirm">确认蓄冰</button><button data-phase="ready">全部待发</button><button data-phase="launch">开始发射</button><button data-tick="31">刺入冲击</button><button data-before="65" data-tick="85">连续穿刺</button><button data-before="105" data-tick="140">蓄光开始</button><button data-before="109" data-tick="176">光片透出</button><button data-before="110" data-tick="212">终爆</button><button data-before="126" data-tick="228">破碎余韵</button></div>
 <div class="markers" id="switchMarkers" style="display:none"></div>
</div>
<footer><span>空格暂停 · ← → 逐帧 · 拖动画面平移<br><span id="demoNote">原版尺寸 · 首击冰封，终爆解除 · 未模拟 AI 与碰撞</span></span><span><a href="npc-comparison.png" target="_blank">Boss 打击对照</a> · <a href="comparison.png" target="_blank">无目标关键帧</a><br>原生帧 2560 × 1440 · FNA 离线预览</span></footer>
</main>
<script type="module">
'use strict';
import {restoreViewState, watchBuild} from './preview-refresh.js';
const $=id=>document.getElementById(id), canvas=$('canvas'), ctx=canvas.getContext('2d');
let version='after', background='normal', tick=0, playing=true, speed=1, zoom=2;
let target='fishron', demo='cast';
const timings=await (await fetch('timing.json',{cache:'no-store'})).json();
const endTick=()=>timings[demo==='switch'?'switch':version].endTick;
const targetNames={none:'无目标',fishron:'猪鲨',golem:'石巨人'};
let lastTime=performance.now(), elapsed=0, lastDrawn='', busy=false, generation=0, failed=false;
let panX=0,panY=0,drag=null;
const cache=new Map(), maxCache=26;
const saved=restoreViewState();
if(saved){
 ({version,background,target,tick,playing,speed,zoom,panX,panY}=saved);
 demo=saved.demo||'cast';
 tick=Math.max(0,Math.min(endTick(),tick));elapsed=tick/60;
 $('target').value=target;$('background').value=background;$('zoom').value=String(zoom);$('speed').value=String(speed);
 $('play').textContent=playing?'暂停':'播放';
}
if(new URLSearchParams(location.search).get('demo')==='switch' && !saved){demo='switch';version='after';tick=0;elapsed=0;}
if(!timings.switch)$('demo').querySelector('[value="switch"]').disabled=true;
for(const phase of timings.switch?.stages||[]){
 const button=document.createElement('button');button.textContent=phase.label;
 button.onclick=()=>{setPlaying(false);seek(phase.tick);};$('switchMarkers').append(button);
}
function fail(message){failed=true;playing=false;$('play').textContent='播放';$('error').style.display='block';$('error').textContent=message;}
window.addEventListener('unhandledrejection',e=>fail(String(e.reason?.stack||e.reason)));
window.addEventListener('error',e=>fail(e.message));
function keyFor(t){return `${demo==='switch'?'switch':`${target==='none'?'':`targets/${target}/`}${version}`}/${background}/${String(t).padStart(3,'0')}.${timings.frameExtension||'webp'}`;}
function load(key){
 if(cache.has(key)){const entry=cache.get(key);entry.used=performance.now();return entry.promise;}
 const entry={bitmap:null,used:performance.now(),promise:null};
 entry.promise=(async()=>{const response=await fetch(key,{cache:'no-store'});if(!response.ok)throw new Error(`帧读取失败：${key} (${response.status})`);const blob=await response.blob();entry.bitmap=await createImageBitmap(blob);return entry.bitmap;})();
 cache.set(key,entry);return entry.promise;
}
function trim(){
 const current=keyFor(tick);
 const oldest=[...cache].filter(([key,e])=>e.bitmap&&key!==current).sort((a,b)=>a[1].used-b[1].used);
 while(cache.size>maxCache&&oldest.length){const [key,entry]=oldest.shift();entry.bitmap.close();cache.delete(key);}
}
function updateLabels(){
 const switching=demo==='switch';$('demo').value=demo;
 $('target').disabled=switching;$('before').disabled=switching;
 $('castMarkers').style.display=switching?'none':'flex';$('switchMarkers').style.display=switching?'flex':'none';
 $('demoNote').textContent=switching?'白色箭头为脚本鼠标 · 快速切换、移出重锁，再接完整施法':'原版尺寸 · 首击冰封，终爆解除 · 未模拟 AI 与碰撞';
 $('timeline').max=endTick();$('timeline').value=tick;$('time').textContent=`${(tick/60).toFixed(2)} / ${(endTick()/60).toFixed(2)} 秒`;
 $('frameLabel').textContent=`${version==='after'?'优化版':'修改前'} · 第 ${String(tick).padStart(3,'0')} 帧`;
 const t=timings.after;
 const phase=tick<t.confirmTick?'悬停瞄准':tick<t.launchTick?'锁定动画 · 冰锥生成':tick<t.chargeStart?'乱序齐射 · 命中定身':tick<t.launchTick+t.volleySpan+3?'穿刺与蓄光':tick<t.burstTick?'成球蓄光':'终爆消散';
 $('stageLabel').textContent=`${targetNames[target]} / ${version==='after'?phase:'修改前 · 原冰凌锁'}`;
 if(switching)$('stageLabel').textContent=`切换目标 / ${timings.switch.stages.filter(p=>p.tick<=tick).at(-1).label}`;
 $('before').setAttribute('aria-pressed',version==='before');$('after').setAttribute('aria-pressed',version==='after');
}
async function render(){
 if(busy||failed)return;
 const key=keyFor(tick), stamp=`${key}/${generation}/${canvas.width}/${canvas.height}`;
 if(lastDrawn===stamp)return;
 busy=true;
 const bitmap=await load(key);
 if(key===keyFor(tick)){
  ctx.fillStyle=background==='dark'?'#090e18':'#213040';ctx.fillRect(0,0,canvas.width,canvas.height);
  const fit=Math.min(canvas.width/2560,canvas.height/1440), scale=fit*zoom;
  const centerX=demo==='switch'?950:1280;
  ctx.drawImage(bitmap,canvas.width/2-centerX*scale+panX*devicePixelRatio,(canvas.height-1440*scale)/2+panY*devicePixelRatio,2560*scale,1440*scale);
  lastDrawn=stamp;updateLabels();
 }
 busy=false;
 for(let i=1;i<=6;i++)void load(keyFor((tick+i)%(endTick()+1)));
 trim();
}
function seek(value){tick=Math.max(0,Math.min(endTick(),Number(value)));elapsed=tick/60;generation++;lastTime=performance.now();void render();}
function setPlaying(value){playing=value;$('play').textContent=playing?'暂停':'播放';lastTime=performance.now();}
$('play').onclick=()=>setPlaying(!playing);
$('restart').onclick=()=>{seek(0);setPlaying(true);};
$('previous').onclick=()=>{setPlaying(false);seek(tick-1);};$('next').onclick=()=>{setPlaying(false);seek(tick+1);};
$('timeline').oninput=e=>{setPlaying(false);seek(e.target.value);};
$('speed').onchange=e=>{speed=Number(e.target.value);lastTime=performance.now();};
$('background').onchange=e=>{background=e.target.value;generation++;void render();};
$('target').onchange=e=>{target=e.target.value;generation++;void render();};
$('demo').onchange=e=>{demo=e.target.value;version='after';panX=panY=0;updateLabels();seek(0);setPlaying(true);};
$('zoom').onchange=e=>{zoom=Number(e.target.value);generation++;void render();};
$('recenter').onclick=()=>{panX=panY=0;generation++;void render();};
for(const name of ['before','after'])$(name).onclick=()=>{version=name;seek(Math.min(tick,endTick()));};
for(const button of document.querySelectorAll('[data-tick]'))button.onclick=()=>{
 setPlaying(false);
 const original=Number(button.dataset.tick), t=timings.after;
 const mapped=original===31?t.launchTick+5:original===85?t.launchTick+Math.floor(t.volleySpan/2):original+(t.chargeOffset??t.flightOffset??0);
 seek(version==='before'?(button.dataset.before||original):mapped);
};
for(const button of document.querySelectorAll('[data-phase]'))button.onclick=()=>{
 version='after';setPlaying(false);
 seek({hover:0,confirm:timings.after.confirmTick,ready:timings.after.launchTick-1,launch:timings.after.launchTick}[button.dataset.phase]);
};
window.addEventListener('keydown',e=>{
 if(['INPUT','SELECT'].includes(e.target.tagName))return;
 if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}
 if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();setPlaying(false);seek(tick+(e.code==='ArrowRight'?1:-1));}
});
canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,px:panX,py:panY};canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(!drag)return;panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;generation++;void render();};
canvas.onpointerup=canvas.onpointercancel=()=>{drag=null;};
new ResizeObserver(()=>{canvas.width=Math.round(canvas.clientWidth*devicePixelRatio);canvas.height=Math.round(canvas.clientHeight*devicePixelRatio);generation++;void render();}).observe(canvas);
document.addEventListener('visibilitychange',()=>{lastTime=performance.now();});
function animate(now){
 if(playing&&!document.hidden&&!failed){elapsed+=(now-lastTime)/1000*speed;const duration=endTick()/60+.5;if(elapsed>duration)elapsed%=duration;const next=Math.min(endTick(),Math.floor(elapsed*60));if(next!==tick){tick=next;void render();}}
 lastTime=now;void render();requestAnimationFrame(animate);
}
updateLabels();void render();requestAnimationFrame(animate);
watchBuild('timing.json',timings,()=>({version,background,target,demo,tick,playing,speed,zoom,panX,panY}),$('buildStatus'));
</script></body></html>
