<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50" data-pencil-art="bottled-rain">
  <defs>
    <linearGradient id="glass" x1=".12" y1=".05" x2=".9" y2="1">
      <stop offset="0" stop-color="#e4d7f2" stop-opacity=".85"/>
      <stop offset=".3" stop-color="#b7b4e0" stop-opacity=".66"/>
      <stop offset=".65" stop-color="#79cbd9" stop-opacity=".72"/>
      <stop offset="1" stop-color="#5d7fad" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="water" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#d5c4ec"/>
      <stop offset=".42" stop-color="#8bd5df"/>
      <stop offset="1" stop-color="#5c91bd"/>
    </linearGradient>
    <linearGradient id="cloud" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fffaff"/>
      <stop offset=".55" stop-color="#e7dcf5"/>
      <stop offset="1" stop-color="#abdce5"/>
    </linearGradient>
    <linearGradient id="lilac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c7ef"/>
      <stop offset=".52" stop-color="#b48bd1"/>
      <stop offset="1" stop-color="#765b9b"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb7d9"/>
      <stop offset=".55" stop-color="#cf84c6"/>
      <stop offset="1" stop-color="#8d6ab1"/>
    </linearGradient>
    <radialGradient id="glow" cx=".45" cy=".35" r=".75">
      <stop offset="0" stop-color="#fff2ff" stop-opacity=".6"/>
      <stop offset=".55" stop-color="#c7a8e8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#75d4dd" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="inside">
      <path d="M19.2 10.3h11.6v7.4c0 1.7 6.3 5.1 7.3 10.1v11c0 3.1-2.7 5-6 5H18c-3.3 0-6-1.9-6-5v-11c1-5 7.3-8.4 7.3-10.1Z"/>
    </clipPath>
  </defs>

  <ellipse cx="25" cy="45.4" rx="14.8" ry="1.8" fill="#1b1737" fill-opacity=".33"/>

  <path d="M37.2 8.2l.4 1.1 1.1.4-1.1.4-.4 1.1-.4-1.1-1.1-.4 1.1-.4Z" fill="#f4d995"/>

  <!-- A curved, pear-shaped glass bottle. -->
  <path id="rain-glass" d="M19.2 8.7h11.6v9c0 1.7 6.3 4.5 7.3 9.8v11.4c0 3.5-2.9 5.7-6.6 5.7H18.5c-3.7 0-6.6-2.2-6.6-5.7V27.5c1-5.3 7.3-8.1 7.3-9.8Z" fill="url(#glass)" stroke="#40375f" stroke-width="1.2" stroke-linejoin="round"/>
  <g clip-path="url(#inside)">
    <path id="rain-water" d="M9 32c5.6-2.5 10.2-1.3 15.8.2 4.9-2.1 9.7-1.9 17.2.5v14H9Z" fill="url(#water)"/>
    <path id="rain-surface" d="M10 34c5.4-2.3 10.2-1.1 15.2.3 4.9-2 9.3-1.7 15.7.5" fill="none" stroke="#e5f7f5" stroke-opacity=".72" stroke-width=".75" stroke-linecap="round"/>
    <path d="M14 18c6-5 16-4.4 23 1v28H13Z" fill="url(#glow)"/>

    <!-- A floating rain cloud, with the rain drawn as graceful strands. -->
    <path d="M16.2 29.5c-2.2-.8-2.1-3.4.1-4.5-.1-2.6 3.1-4.2 4.9-2.2 1.2-3.2 5.8-3.1 6.9.1 3.2-.4 5.1 3 3.1 5.4 1.3 1 .6 2.5-1.1 2.6H17.7c-1.7 0-2.4-.9-1.5-1.4Z" fill="url(#cloud)" stroke="#6c78a8" stroke-width=".75" stroke-linejoin="round"/>
    <path id="rain-strands" d="M19.4 31.2c-.6 1.5-.4 2.5.4 3.4m4.5-3.5c-.4 1.7-.1 2.8.6 3.8m4.4-3.8c-.3 1.4 0 2.4.8 3.2m3.1-2.1c-.1 1 .1 1.6.6 2.2" fill="none" stroke="#86dce3" stroke-width="1.05" stroke-linecap="round"/>
    <path id="rain-flecks" d="M19.1 37.3l-.6 1.6m5.6-1.2-.4 1.7m5.5-1.9-.5 1.5" fill="none" stroke="#ebf8f5" stroke-opacity=".83" stroke-width=".6" stroke-linecap="round"/>

    <!-- Tiny star-like reflections inside the rain. -->
    <path d="M24.6 20.2l.5 1.2 1.2.5-1.2.5-.5 1.2-.5-1.2-1.2-.5 1.2-.5Z" fill="#f6dda2"/>
    <circle cx="33.3" cy="28.8" r=".55" fill="#f3c8e7"/>
    <path id="rain-botanical" d="M16.5 38.9c1.3-.6 2.2-.5 3.2.2m-.5-.8c.6-.9 1.3-1.2 2.1-1.1" fill="none" stroke="#b8e6b6" stroke-width=".65" stroke-linecap="round"/>
  </g>

  <!-- A soft lilac neck and ribbon seal. -->
  <path d="M18.2 5.1c2.3-.9 11.1-.9 13.6.1l-.3 4.8H18.5Z" fill="url(#lilac)" stroke="#40375f" stroke-width="1.05" stroke-linejoin="round"/>
  <path d="M18.7 6.5c3 1 8.8 1 12.5-.1m-12.7 2.1c3.4.9 9.4.9 12.9-.1" fill="none" stroke="#f1e6f7" stroke-opacity=".64" stroke-width=".62" stroke-linecap="round"/>
  <path d="M18.4 10.3h13.2M18.5 16.8h12.9" stroke="url(#ribbon)" stroke-width="1.15" stroke-linecap="round"/>

  <!-- Curved glass highlights and a loose magical droplet. -->
  <path d="M15.6 26.5c-.9 2.1-1.1 5.2-.9 8.3m2-11.2c-.3.7-.4 1.3-.4 2" fill="none" stroke="#fbffff" stroke-opacity=".78" stroke-width="1.15" stroke-linecap="round"/>
  <path d="M34.6 26.5c.7 2.7.8 5.1.6 7.5" fill="none" stroke="#d8f3f4" stroke-opacity=".35" stroke-width=".7" stroke-linecap="round"/>
  <path d="M39.2 19.2c1.3 1 1.7 2.1 1.3 3.2" fill="none" stroke="#ffb9da" stroke-opacity=".8" stroke-width=".65" stroke-linecap="round"/>
  <circle cx="40.6" cy="24" r=".55" fill="#c8a8e6"/>
</svg>
